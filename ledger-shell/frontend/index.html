<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger-Driven Deterministic Shell</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #00ff88;
            overflow: hidden;
            user-select: none;
        }
        
        #container {
            display: flex;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }
        
        #canvas-section {
            flex: 3;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        #canvas {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
            border-radius: 4px;
            position: relative;
        }
        
        .dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ff88;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 8px;
            color: #000;
        }
        
        .dot.selected {
            width: 16px;
            height: 16px;
            box-shadow: 0 0 20px #00ff88;
        }
        
        #panel-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .panel {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff88;
            border-radius: 8px;
            padding: 15px;
            overflow-y: auto;
        }
        
        .panel h2 {
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            border-bottom: 1px solid #00ff88;
            padding-bottom: 8px;
        }
        
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        button {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        
        button:hover {
            background: rgba(0, 255, 136, 0.2);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        
        #state-display {
            max-height: 200px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff88;
            padding: 10px;
            border-radius: 4px;
            word-break: break-all;
            white-space: pre-wrap;
        }
        
        #log-display {
            max-height: 300px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #00ff88;
            padding: 10px;
            border-radius: 4px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 5px;
            color: #00ff88;
            border-left: 2px solid #00ff88;
            padding-left: 8px;
        }
        
        .log-entry.action {
            color: #0099ff;
            border-left-color: #0099ff;
        }
        
        .log-entry.error {
            color: #ff0055;
            border-left-color: #ff0055;
        }
        
        #ledger-entry-count {
            font-size: 10px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }
        
        #status {
            font-size: 10px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid #00ff88;
        }
        
        #llm-input {
            width: 100%;
            padding: 8px;
            font-family: inherit;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #0099ff;
            border-radius: 4px;
            color: #00ff88;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        
        #llm-input::placeholder {
            color: rgba(0, 255, 136, 0.3);
        }
        
        #llm-reasoning {
            font-size: 8px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #0099ff;
            border-left-color: #00ff88;
            padding: 10px;
            border-radius: 4px;
            min-height: 80px;
            max-height: 200px;
            overflow-y: auto;
            color: #0099ff;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-section">
            <div id="canvas"></div>
        </div>
        
        <div id="panel-section">
            <div class="panel">
                <h2>Actions</h2>
                <div class="button-group">
                    <button onclick="createObject()">Create Object</button>
                    <button onclick="moveObject()">Move Object</button>
                    <button onclick="renderText()">Render Text</button>
                    <button onclick="setView()">Change View</button>
                </div>
            </div>
            
            <div class="panel">
                <h2>LLM Query</h2>
                <input type="text" id="llm-input" placeholder="Ask the system to do something..."/>
                <button onclick="submitLLMQuery()" style="width: 100%; margin-bottom: 8px;">Send Query</button>
                <div id="llm-reasoning">LLM reasoning will appear here...</div>
            </div>
            
            <div class="panel" id="state-panel">
                <h2>Current State</h2>
                <div id="state-display">Loading...</div>
            </div>
            
            <div class="panel">
                <h2>Ledger</h2>
                <div id="ledger-entry-count">Entries: 0</div>
                <button onclick="viewLedger()" style="margin-top: 8px;">View Full Ledger</button>
            </div>
            
            <div class="panel">
                <h2>Status</h2>
                <div id="status">Ready</div>
            </div>
        </div>
    </div>
    
    <div id="log-display" style="position: fixed; bottom: 20px; left: 20px; width: 300px; z-index: 1000;"></div>

    <script>
        const API_BASE = "http://127.0.0.1:8000";
        
        let objects = [];
        let selectedObject = null;
        
        function log(message, type = "log") {
            const logDiv = document.getElementById("log-display");
            const entry = document.createElement("div");
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            if (logDiv.children.length > 20) {
                logDiv.removeChild(logDiv.firstChild);
            }
        }
        
        async function postIntent(action, params) {
            try {
                const response = await fetch(`${API_BASE}/api/intent`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ action, params })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    log(`Error: ${error.detail}`, "error");
                    return null;
                }
                
                const result = await response.json();
                log(`Intent posted: ${action}`, "action");
                updateState();
                return result;
            } catch (err) {
                log(`Network error: ${err.message}`, "error");
                return null;
            }
        }
        
        async function submitLLMQuery() {
            const input = document.getElementById("llm-input").value.trim();
            if (!input) {
                log("Query cannot be empty", "error");
                return;
            }
            
            log(`Sending query: ${input}`, "action");
            document.getElementById("llm-reasoning").textContent = "🔬 Reasoning...";
            
            try {
                const response = await fetch(`${API_BASE}/api/query`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ input })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    log(`Query error: ${error.detail}`, "error");
                    document.getElementById("llm-reasoning").textContent = `❌ Error: ${error.detail}`;
                    return;
                }
                
                const result = await response.json();
                
                // Handle both success and clarification responses
                if (result.status === "clarification_needed") {
                    log(`Clarification needed: ${result.message}`, "warning");
                    const reasoning_display = `
🤔 Clarification Needed

Message: ${result.message}
Confidence: ${(result.confidence * 100).toFixed(1)}%

Reasoning steps:
${result.reasoning_steps.map(s => `  • ${s}`).join('\n')}
`;
                    document.getElementById("llm-reasoning").textContent = reasoning_display;
                } else {
                    log(`Query processed: ${result.intent.action}`, "action");
                    
                    const pattern_scores = result.reasoning.pattern_scores || {};
                    const reasoning_display = `
✅ Intent Determined

Matched Pattern: ${result.reasoning.matched_pattern}
Confidence: ${(result.reasoning.confidence * 100).toFixed(1)}%

Intent: ${result.intent.action}
Parameters: ${JSON.stringify(result.intent.params, null, 2)}

Pattern Scores:
${Object.entries(pattern_scores)
    .map(([pattern, score]) => `  ${pattern}: ${(score * 100).toFixed(1)}%`)
    .join('\n')}

Reasoning Steps:
${(result.reasoning.reasoning_steps || []).slice(0, 5).map(s => `  • ${s}`).join('\n')}${(result.reasoning.reasoning_steps || []).length > 5 ? `\n  ... and ${(result.reasoning.reasoning_steps || []).length - 5} more steps` : ''}

Status: ${result.result.status}
`;
                    document.getElementById("llm-reasoning").textContent = reasoning_display;
                }
                
                document.getElementById("llm-input").value = "";
                updateState();
                
            } catch (err) {
                log(`Network error: ${err.message}`, "error");
                document.getElementById("llm-reasoning").textContent = `❌ Error: ${err.message}`;
            }
        }
        
        async function updateState() {
            try {
                const response = await fetch(`${API_BASE}/api/state`);
                const state = await response.json();
                
                document.getElementById("state-display").textContent = JSON.stringify(state, null, 2);
                
                const ledgerResp = await fetch(`${API_BASE}/api/ledger`);
                const ledger = await ledgerResp.json();
                document.getElementById("ledger-entry-count").textContent = `Entries: ${ledger.entries.length}`;
                
                renderCanvas(state);
            } catch (err) {
                log(`State update failed: ${err.message}`, "error");
            }
        }
        
        function renderCanvas(state) {
            const canvas = document.getElementById("canvas");
            canvas.innerHTML = "";
            
            if (state.objects && state.objects.length > 0) {
                state.objects.forEach(obj => {
                    // DEFENSIVE: Skip objects with null/missing ID
                    if (!obj.id || obj.id === null || obj.id === undefined) {
                        console.warn("Skipping object with null ID:", obj);
                        return;
                    }
                    const dot = document.createElement("div");
                    dot.className = "dot";
                    dot.style.left = `${obj.x}px`;
                    dot.style.top = `${obj.y}px`;
                    dot.textContent = obj.id.substring(0, 1);
                    dot.onclick = () => selectObject(obj.id);
                    canvas.appendChild(dot);
                });
            }
        }
        
        function selectObject(id) {
            selectedObject = id;
            updateState();
            log(`Object selected: ${id}`, "action");
        }
        
        async function createObject() {
            const x = Math.random() * (window.innerWidth / 2 - 60);
            const y = Math.random() * (window.innerHeight - 60);
            const objId = `obj_${Date.now()}`;
            
            await postIntent("create_object", {
                id: objId,
                type: "point",
                x: Math.floor(x),
                y: Math.floor(y)
            });
        }
        
        async function moveObject() {
            if (!selectedObject) {
                log("No object selected", "error");
                return;
            }
            
            const x = Math.random() * (window.innerWidth / 2 - 60);
            const y = Math.random() * (window.innerHeight - 60);
            
            await postIntent("move_object", {
                id: selectedObject,
                to: [Math.floor(x), Math.floor(y)]
            });
        }
        
        async function renderText() {
            const text = prompt("Enter text to render:");
            if (text) {
                await postIntent("render_text", { text });
            }
        }
        
        async function setView() {
            const view = prompt("Enter view name:", "default");
            if (view) {
                await postIntent("set_view", { view });
            }
        }
        
        async function viewLedger() {
            try {
                const response = await fetch(`${API_BASE}/api/ledger`);
                const ledger = await response.json();
                console.log("Full Ledger:", ledger);
                alert(`Ledger entries: ${ledger.entries.length}\n\nOpen browser console to see full ledger.`);
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }
        
        // Initialize
        setInterval(updateState, 1000);
        updateState();
        log("System initialized", "action");
    </script>
</body>
</html>
