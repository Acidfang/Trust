      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Lato:wght@400;700&amp;display=swap');
      
      /* Hierarchy: each row fades in opacity (binary encoding: tier level) */
      .title-main { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; fill: #d4af8a; text-anchor: middle; letter-spacing: 6px; }
      .title-sub { font-family: 'Lato', sans-serif; font-size: 16px; font-weight: 400; fill: #b8956a; text-anchor: middle; letter-spacing: 1px; }
      .card-title-t1 { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; fill: #d4af8a; text-anchor: middle; letter-spacing: 1px; }
      .card-text-t1 { font-family: 'Lato', sans-serif; font-size: 15px; font-weight: 400; fill: #b8956a; text-anchor: middle; line-height: 1.7; }
      .statement-text { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; fill: #d4af8a; text-anchor: middle; letter-spacing: 2px; }
      .closing-text { font-family: 'Lato', sans-serif; font-size: 15px; font-weight: 400; fill: #b8956a; text-anchor: middle; }
      .emphasis { fill: #d4af8a; font-weight: 700; }
      .meta-text { font-family: 'Lato', sans-serif; font-size: 12px; font-weight: 400; fill: #9d7e63; text-anchor: middle; }
    </style>
    
    <!-- Gradient backgrounds -->
