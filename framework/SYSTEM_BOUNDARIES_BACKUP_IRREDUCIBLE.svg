  <text x="690" y="1015" class="card-text-t1">Absolute freedom</text>
  <text x="690" y="1033" class="card-text-t1">impossible</text>
  
  <rect x="970" y="890" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2" opacity="0.3"/>
