  <circle cx="1280" cy="1570" r="2" fill="#d4af8a" opacity="0.2"/>
  
  <text x="700" y="1400" class="closing-text">A system can act, but <tspan class="emphasis">not without limits.</tspan></text>
  <text x="700" y="1425" class="closing-text">A system can <tspan class="emphasis">know,</tspan> but <tspan class="emphasis">not completely.</tspan></text>
  <text x="700" y="1450" class="closing-text">A system can <tspan class="emphasis">change,</tspan> but <tspan class="emphasis">not without risk.</tspan></text>
  
