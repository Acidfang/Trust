  <circle cx="1250" cy="1310" r="1.5" fill="#d4af8a" opacity="0.2"/>
  <path d="M 300 1320 L 250 1330 M 1100 1320 L 1150 1330" stroke="#d4af8a" stroke-width="0.6" opacity="0.15" fill="none"/>
  
