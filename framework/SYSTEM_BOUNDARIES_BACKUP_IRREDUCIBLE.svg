  <text x="700" y="1640" class="statement-text" style="font-size: 18px; font-style: italic;">You are what you select.</text>
  <text x="700" y="1670" class="statement-text" style="font-size: 18px; font-style: italic;">And you are shaped by what you cannot.</text>
  
