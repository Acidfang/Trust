  <circle cx="1200" cy="1475" r="1.2" fill="#d4af8a" opacity="0.2"/>
  
  <text x="700" y="1530" class="closing-text">No system escapes <tspan class="emphasis">structure.</tspan></text>
  <text x="700" y="1555" class="closing-text">No system escapes <tspan class="emphasis">uncertainty.</tspan></text>
  
