<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 1800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Lato:wght@400;700&amp;display=swap");
      .bg-main { fill: #0a0a0a; }
      .text-title { font-family: "Playfair Display", serif; font-weight: 700; fill: #d4af8a; text-anchor: middle; }
      .text-body { font-family: "Lato", sans-serif; font-weight: 400; fill: #b8956a; text-anchor: middle; }
      .meta { font-family: "Lato", sans-serif; font-size: 12px; fill: #9d7e63; text-anchor: middle; }
      .tier-1 { opacity: 0.8; }
      .tier-2 { opacity: 0.5; }
      .tier-3 { opacity: 0.3; }
      .tier-accent { opacity: 0.15; }
      .emphasis { fill: #d4af8a; font-weight: 700; }
    </style>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1410;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- BACKGROUND ARCHITECTURE -->
  <rect width="1400" height="1800" fill="url(#darkGrad)"/>
  <rect width="1400" height="1800" fill="#0f0f0f" opacity="0.3"/>

  <!-- TIER ACCENT: FIELD ANCHORS & DECORATION -->
  <g class="tier-accent" opacity="0.15">
    <!-- CORNER ANCHORS -->
    <path d="M 50 100 V 50 H 100 M 1300 50 H 1350 V 100 M 50 1700 V 1750 H 100 M 1300 1750 H 1350 V 1700" stroke="#d4af8a" stroke-width="0.5" fill="none"/>
    
    <!-- ACCENT DOT CLUSTER (25+) -->
    <circle cx="50" cy="50" r="2" opacity="0.2"/><circle cx="1350" cy="50" r="2" opacity="0.2"/>
    <circle cx="50" cy="1750" r="2" opacity="0.2"/><circle cx="1350" cy="1750" r="2" opacity="0.2"/>
    <circle cx="100" cy="100" r="1.5" opacity="0.2"/><circle cx="1200" cy="100" r="1.5" opacity="0.2"/>
    <circle cx="300" cy="200" r="1.5" opacity="0.2"/><circle cx="1100" cy="200" r="1.5" opacity="0.2"/>
    <circle cx="700" cy="50" r="1.5" opacity="0.2"/><circle cx="700" cy="1750" r="1.5" opacity="0.2"/>
    <circle cx="50" cy="900" r="1.5" opacity="0.2"/><circle cx="1350" cy="900" r="1.5" opacity="0.2"/>
    <circle cx="200" cy="1500" r="1.5" opacity="0.2"/><circle cx="1200" cy="1500" r="1.5" opacity="0.2"/>
    <circle cx="400" cy="1650" r="1.5" opacity="0.2"/><circle cx="1000" cy="1650" r="1.5" opacity="0.2"/>
    <circle cx="600" cy="1200" r="1.5" opacity="0.2"/><circle cx="800" cy="1200" r="1.5" opacity="0.2"/>
    <circle cx="50" cy="400" r="1" opacity="0.1"/><circle cx="1350" cy="400" r="1" opacity="0.1"/>
    <circle cx="50" cy="1400" r="1" opacity="0.1"/><circle cx="1350" cy="1400" r="1" opacity="0.1"/>
    <circle cx="700" cy="1100" r="1" opacity="0.1"/><circle cx="700" cy="1500" r="1" opacity="0.1"/>
    <circle cx="150" cy="150" r="1" opacity="0.1"/><circle cx="1250" cy="150" r="1" opacity="0.1"/>
    <circle cx="350" cy="350" r="1" opacity="0.1"/><circle cx="1050" cy="350" r="1" opacity="0.1"/>
  </g>

  <!-- HEADER -->
  <text x="700" y="100" class="text-title" style="font-size: 72px; letter-spacing: 6px;">THE LIMITS OF</text>
  <text x="700" y="170" class="text-title" style="font-size: 72px; letter-spacing: 6px;">KNOWLEDGE &amp; CONTROL</text>
  <text x="700" y="230" class="text-body" style="font-size: 16px; letter-spacing: 1px;">Every complete system must eventually face this.</text>

  <!-- TIER 1 -->
  <g class="tier-1" opacity="0.8">
    <rect x="50" y="270" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <g transform="translate(230, 310)">
      <circle r="21" fill="none" stroke="#d4af8a" stroke-width="1.5"/>
      <circle cx="-11" cy="-7" r="1.8" fill="#d4af8a"/>
      <circle cx="11" cy="-7" r="1.8" fill="#d4af8a"/>
      <circle cx="0" cy="10" r="1.8" fill="#d4af8a"/>
      <path d="M 0 14 V 22 M -4 18 H 4" stroke="#d4af8a" stroke-width="1" fill="none"/>
    </g>
    <text x="230" y="360" class="text-title" style="font-size: 20px; letter-spacing: 1px;">PERCEPTUAL</text>
    <text x="230" y="380" class="text-title" style="font-size: 20px; letter-spacing: 1px;">BOUNDARY</text>
    <text x="230" y="410" class="text-body" style="font-size: 15px;">Cannot perceive all inputs</text>

    <rect x="510" y="270" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <g transform="translate(690, 310)">
      <circle r="21" fill="none" stroke="#d4af8a" stroke-width="1.5"/>
      <circle r="12" fill="none" stroke="#d4af8a" stroke-width="1"/>
      <circle r="2.2" fill="#d4af8a"/>
    </g>
    <text x="690" y="360" class="text-title" style="font-size: 20px; letter-spacing: 1px;">REPRESENTATIONAL</text>
    <text x="690" y="380" class="text-title" style="font-size: 20px; letter-spacing: 1px;">BOUNDARY</text>
    <text x="690" y="410" class="text-body" style="font-size: 15px;">Cannot fully model itself</text>

    <rect x="970" y="270" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <g transform="translate(1150, 310)">
      <circle r="2.2" fill="#d4af8a"/>
      <path d="M 0 2.5 L -10 25 M 0 2.5 V 30 M 0 2.5 L 10 25" stroke="#d4af8a" stroke-width="2" fill="none"/>
    </g>
    <text x="1150" y="360" class="text-title" style="font-size: 20px; letter-spacing: 1px;">ACTION</text>
    <text x="1150" y="380" class="text-title" style="font-size: 20px; letter-spacing: 1px;">BOUNDARY</text>
    <text x="1150" y="410" class="text-body" style="font-size: 15px;">Cannot execute all selections</text>
  </g>

  <!-- ROW CONNECTORS (9 REQUIRED) -->
  <g class="tier-accent" opacity="0.2">
    <line x1="230" y1="530" x2="230" y2="580" stroke="#d4af8a" stroke-width="1"/>
    <line x1="690" y1="530" x2="690" y2="580" stroke="#d4af8a" stroke-width="1"/>
    <line x1="1150" y1="530" x2="1150" y2="580" stroke="#d4af8a" stroke-width="1"/>
    <line x1="230" y1="840" x2="230" y2="890" stroke="#d4af8a" stroke-width="1"/>
    <line x1="690" y1="840" x2="690" y2="890" stroke="#d4af8a" stroke-width="1"/>
    <line x1="1150" y1="840" x2="1150" y2="890" stroke="#d4af8a" stroke-width="1"/>
    <line x1="230" y1="1150" x2="230" y2="1200" stroke="#d4af8a" stroke-width="1"/>
    <line x1="690" y1="1150" x2="690" y2="1200" stroke="#d4af8a" stroke-width="1"/>
    <line x1="1150" y1="1150" x2="1150" y2="1200" stroke="#d4af8a" stroke-width="1"/>
  </g>

  <!-- TIER 2 -->
  <g class="tier-2" opacity="0.5">
    <rect x="50" y="580" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="230" y="670" class="text-title" style="font-size: 20px; letter-spacing: 1px;">RECURSION</text>
    <text x="230" y="690" class="text-title" style="font-size: 20px; letter-spacing: 1px;">LIMIT</text>
    <text x="230" y="720" class="text-body" style="font-size: 15px;">Self-modeling infinite regress</text>

    <rect x="510" y="580" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="690" y="670" class="text-title" style="font-size: 20px; letter-spacing: 1px;">PREDICTION</text>
    <text x="690" y="690" class="text-title" style="font-size: 20px; letter-spacing: 1px;">LIMIT</text>
    <text x="690" y="720" class="text-body" style="font-size: 15px;">Cannot predict predictability</text>

    <rect x="970" y="580" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="1150" y="670" class="text-title" style="font-size: 20px; letter-spacing: 1px;">CONTROL</text>
    <text x="1150" y="690" class="text-title" style="font-size: 20px; letter-spacing: 1px;">LIMIT</text>
    <text x="1150" y="720" class="text-body" style="font-size: 15px;">Always partial and temporary</text>
  </g>

  <!-- TIER 3 -->
  <g class="tier-3" opacity="0.3">
    <rect x="50" y="890" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="230" y="980" class="text-title" style="font-size: 20px; letter-spacing: 1px;">IDENTITY</text>
    <text x="230" y="1000" class="text-title" style="font-size: 20px; letter-spacing: 1px;">PARADOX</text>
    <text x="230" y="1030" class="text-body" style="font-size: 15px;">Too much change dissolves identity</text>

    <rect x="510" y="890" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="690" y="980" class="text-title" style="font-size: 20px; letter-spacing: 1px;">FREEDOM</text>
    <text x="690" y="1000" class="text-title" style="font-size: 20px; letter-spacing: 1px;">PARADOX</text>
    <text x="690" y="1030" class="text-body" style="font-size: 15px;">Absolute freedom is impossible</text>

    <rect x="970" y="890" width="360" height="260" fill="none" stroke="#d4af8a" stroke-width="2"/>
    <text x="1150" y="980" class="text-title" style="font-size: 20px; letter-spacing: 1px;">META-LIMIT</text>
    <text x="1150" y="1030" class="text-body" style="font-size: 15px;">No final layer beyond limitation</text>
  </g>

  <!-- CENTRAL STATEMENT -->
  <line x1="80" y1="1200" x2="1320" y2="1200" stroke="#d4af8a" stroke-width="1" opacity="0.3"/>
  <text x="700" y="1265" class="text-title" style="font-size: 20px; letter-spacing: 2px;">YOU ARE BOUNDED.</text>
  <text x="700" y="1300" class="text-title" style="font-size: 20px; letter-spacing: 2px;">BUT YOU STILL SELECT.</text>
  <line x1="80" y1="1330" x2="1320" y2="1330" stroke="#d4af8a" stroke-width="1" opacity="0.3"/>

  <!-- FINAL SUMMARY -->
  <rect x="100" y="1370" width="1200" height="210" fill="none" stroke="#d4af8a" stroke-width="1" opacity="0.2"/>
  <text x="700" y="1415" class="text-body" style="font-size: 15px;">A system can act, but <tspan class="emphasis">not without limits.</tspan></text>
  <text x="700" y="1445" class="text-body" style="font-size: 15px;">A system can <tspan class="emphasis">know,</tspan> but <tspan class="emphasis">not completely.</tspan></text>
  <text x="700" y="1475" class="text-body" style="font-size: 15px;">A system can <tspan class="emphasis">change,</tspan> but <tspan class="emphasis">not without risk.</tspan></text>
  <line x1="300" y1="1505" x2="1100" y2="1505" stroke="#d4af8a" stroke-width="0.75" opacity="0.2"/>
  <text x="700" y="1540" class="text-body" style="font-size: 15px;">No system escapes <tspan class="emphasis">structure.</tspan></text>
  <text x="700" y="1570" class="text-body" style="font-size: 15px;">No system escapes <tspan class="emphasis">uncertainty.</tspan></text>

  <!-- CLOSING -->
  <text x="700" y="1650" class="text-title" style="font-size: 18px; font-style: italic;">You are what you select.</text>
  <text x="700" y="1680" class="text-title" style="font-size: 18px; font-style: italic;">And you are shaped by what you cannot.</text>

  <!-- FOOTER -->
  <text x="700" y="1750" class="meta">System Boundaries Framework | UFM Irreducible Rebuild | April 11, 2026</text>
  <rect x="650" y="1740" width="100" height="20" fill="none" stroke="#d4af8a" stroke-width="0.5" opacity="0.1"/>
</svg>
