<!--
================================================================================
JARVIS FRONTEND - PURE FRAME RENDERER
================================================================================

COVENANT:
This HTML is ONLY:
- DOM renderer
- Frame parser
- Button event connector
- Static asset server

ALL decisions live in the kernel. The browser renders what kernel specifies.

RULES:
✓ Never add layout logic here
✓ Never hardcode view structures  
✓ Never assume what areas/nodes exist
✓ Never add menu/navigation logic
✓ Never modify without kernel spec change

The kernel decides:
- What areas exist (header/main/sidebar/custom)
- What nodes are rendered in each area
- What buttons do and where they navigate
- The entire layout structure

The HTML only:
- Creates areas dynamically based on kernel's frame
- Renders node types (TEXT, WIDGET, SCENE_3D)
- Sends button clicks to kernel
- Polls /api/frame for updates

If HTML needs changes: The kernel changed first. Respond to kernel, not to UI.
================================================================================
-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARIA Consciousness</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: monospace; background: #1a1a1a; color: #ffffff; }
        
        /* Canvas-like absolute positioning container */
        #root {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }

        /* All nodes positioned absolutely using ledger coordinates */
        .node {
            position: absolute;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Node type styling */
        .node-text { 
            display: flex;
            align-items: center;
            justify-content: flex-start;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow: hidden;
            padding: 4px;
        }
        
        .node-button {
            display: flex;
            align-items: stretch;
            justify-content: stretch;
            padding: 0;
            margin: 0;
        }
        
        .widget-button { 
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
            border: 2px solid;
            border-radius: 0;
            cursor: pointer;
            font-size: 12px;
            font-family: monospace;
            font-weight: normal;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: none;
            box-sizing: border-box;
        }
        .widget-button:hover { opacity: 0.9; }
        .widget-button:active { opacity: 0.8; }
        
        .node-scene-3d { 
            width: 100%;
            height: 100%;
            background: #000; 
            border: 2px solid #64b5f6;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64b5f6;
        }

        .loading { 
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            text-align: center;
            color: #999; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // ================================================================
        // MINIMAL JARVIS - LEDGER-DRIVEN RENDERING
        // ================================================================
        // HTML only does what's necessary:
        // - Has root container
        // - Polls kernel for frames
        // - Renders nodes exactly as kernel specifies
        // NO layout assumptions, NO hardcoded views, pure ledger-driven
        // ================================================================

        const serverUrl = `${window.location.protocol}//${window.location.host}`;
        const root = document.getElementById("root");
        let lastFrame = null;

        // ================================================================
        // NODE RENDERER - Renders nodes within pre-positioned containers
        // ================================================================
        class NodeRenderer {
            render(node, container) {
                // Container is already positioned absolutely with x, y, width, height
                // Just render the content inside it

                if (node.type === "TEXT") {
                    container.style.color = node.payload.color || "#ffffff";
                    container.style.fontSize = (node.payload.size === "header" ? 16 : 12) + "px";
                    container.style.fontWeight = node.payload.size === "header" ? "bold" : "normal";
                    container.style.textAlign = node.payload.align || "left";
                    container.style.padding = "4px";
                    container.textContent = node.payload.text || "";
                    
                } else if (node.type === "BUTTON") {
                    // Create button that fills container
                    const btn = document.createElement("button");
                    btn.className = "widget-button";
                    btn.id = node.id + "-btn";
                    btn.textContent = node.payload.label || "Button";
                    btn.disabled = node.payload.enabled === false;
                    if (btn.disabled) btn.style.opacity = "0.5";
                    if (node.payload.bg) btn.style.background = node.payload.bg;
                    if (node.payload.text) btn.style.color = node.payload.text;
                    btn.style.borderColor = node.payload.text || "#ffffff";
                    
                    // DEBUG: Log button creation
                    console.log(`[BUTTON] Created: ${node.id}, label: ${node.payload.label}, enabled: ${node.payload.enabled}`);
                    
                    btn.onclick = async (e) => {
                        console.log(`[CLICK] Button clicked: ${node.id}`);
                        try {
                            const response = await fetch("/api/interaction", {
                                method: "POST",
                                headers: {"Content-Type": "application/json"},
                                body: JSON.stringify({
                                    button_id: node.id
                                })
                            });
                            const result = await response.json();
                            console.log(`[CLICK_RESULT] ${node.id} -> ${result.view || result.status}`);
                        } catch(e) { 
                            console.error("[CLICK_ERROR]", node.id, e); 
                        }
                    };
                    
                    // Also add hover and focus handlers for debugging
                    btn.onmouseover = () => console.log(`[HOVER] ${node.id}`);
                    btn.onfocus = () => console.log(`[FOCUS] ${node.id}`);
                    
                    container.appendChild(btn);
                    
                    // DEBUG: Verify button is in DOM and has click handler
                    console.log(`[BUTTON_ATTACHED] ${node.id}, handler: ${btn.onclick ? 'YES' : 'NO'}`);
                    
                } else if (node.type === "SCENE_3D") {
                    container.className += " node-scene-3d";
                    container.textContent = "[3D Scene]";
                }
            }

            renderScene3D(payload, container) {
                container.onclick = () => {
                    container.innerHTML = "";
                    const scene = new THREE.Scene();
                    const camera = new THREE.PerspectiveCamera(payload.camera.fov, 
                        container.clientWidth / container.clientHeight, 0.1, 1000);
                    const renderer = new THREE.WebGLRenderer({antialias: true});
                    renderer.setSize(container.clientWidth, container.clientHeight);
                    renderer.setClearColor(payload.background);
                    container.appendChild(renderer.domElement);

                    // Add objects
                    (payload.objects || []).forEach(obj => {
                        const geom = new THREE.SphereGeometry(obj.geometry_params.radius, 8, 8);
                        const mat = new THREE.MeshPhongMaterial({color: obj.color});
                        const mesh = new THREE.Mesh(geom, mat);
                        mesh.position.set(...obj.position);
                        scene.add(mesh);
                    });

                    // Add lights
                    (payload.lights || []).forEach(light => {
                        if (light.type === "ambient") {
                            scene.add(new THREE.AmbientLight(light.color, light.intensity));
                        } else if (light.type === "point") {
                            const pl = new THREE.PointLight(light.color, light.intensity);
                            pl.position.set(...light.position);
                            scene.add(pl);
                        }
                    });

                    camera.position.set(...payload.camera.position);
                    const animate = () => {
                        requestAnimationFrame(animate);
                        renderer.render(scene, camera);
                    };
                    animate();
                };
            }
        }

        // ================================================================
        // LAYOUT ENGINE - Position nodes absolutely (ledger provides coordinates)
        // ================================================================
        class LayoutEngine {
            apply(frame) {
                root.innerHTML = "";
                const renderer = new NodeRenderer();
                
                console.log(`[LAYOUT] Rendering ${frame.nodes.length} nodes`);

                // Render each node at its absolute coordinates from ledger
                frame.nodes.forEach(node => {
                    const nodeDiv = document.createElement("div");
                    nodeDiv.className = `node node-${node.type.toLowerCase()}`;
                    nodeDiv.id = node.id;
                    
                    // Position absolutely using ledger coordinates
                    const x = node.x || 0;
                    const y = node.y || 0;
                    const width = node.width || 100;
                    const height = node.height || 30;
                    
                    nodeDiv.style.left = x + "px";
                    nodeDiv.style.top = y + "px";
                    nodeDiv.style.width = width + "px";
                    nodeDiv.style.height = height + "px";
                    
                    // DEBUG: Log button positioning
                    if (node.type === "BUTTON") {
                        console.log(`[NODE] ${node.id}: pos(${x},${y}) size(${width}x${height})`);
                    }
                    
                    renderer.render(node, nodeDiv);
                    root.appendChild(nodeDiv);
                });
                
                console.log(`[LAYOUT_COMPLETE] Total rendered: ${frame.nodes.length}`);
            }
        }

        // ================================================================
        // FRAME POLLER - Polls kernel for updates
        // ================================================================
        async function pollFrame() {
            try {
                const res = await fetch(`${serverUrl}/api/frame`);
                const frame = await res.json();

                if (JSON.stringify(frame) !== JSON.stringify(lastFrame)) {
                    const layout = new LayoutEngine();
                    layout.apply(frame);
                    lastFrame = frame;
                }
            } catch (e) {
                root.innerHTML = `<div class="loading">❌ Connection error</div>`;
            }
        }

        // Start polling
        root.innerHTML = "<div class='loading'>⏳ Initializing...</div>";
        setInterval(pollFrame, 500);
        pollFrame(); // First poll immediately
    </script>
</body>
</html>
