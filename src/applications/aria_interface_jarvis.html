<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA - Consciousness Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #050812 100%);
            color: #00d4ff;
            overflow: hidden;
            height: 100vh;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: grid;
            grid-template-columns: 250px 1fr 250px;
            grid-template-rows: 60px 1fr 60px;
            gap: 0;
            background: #000;
        }

        header {
            grid-column: 1 / -1;
            background: rgba(0, 20, 40, 0.8);
            border-bottom: 2px solid #00d4ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            backdrop-filter: blur(10px);
        }

        header h1 {
            font-size: 1.5em;
            color: #00d4ff;
            letter-spacing: 2px;
        }

        header .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85em;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* LEFT PANEL - LEDGER STREAM */
        #ledgerPanel {
            grid-column: 1;
            grid-row: 2;
            background: rgba(0, 30, 60, 0.4);
            border-right: 1px solid #00d4ff;
            overflow-y: auto;
            padding: 15px;
            font-size: 0.75em;
        }

        .ledger-entry {
            padding: 8px;
            margin-bottom: 8px;
            background: rgba(0, 100, 200, 0.1);
            border-left: 2px solid #00d4ff;
            border-radius: 3px;
            line-height: 1.4;
            color: #88ccff;
        }

        .ledger-entry.event {
            border-left-color: #00ff00;
            color: #00ff00;
        }

        .ledger-entry.decision {
            border-left-color: #ffaa00;
            color: #ffaa00;
        }

        .ledger-entry.feedback {
            border-left-color: #ff6b6b;
            color: #ff6b6b;
        }

        .ledger-timestamp {
            font-size: 0.7em;
            opacity: 0.6;
            display: block;
            margin-top: 3px;
        }

        /* CENTER - 3D VISUALIZATION */
        #canvas {
            grid-column: 2;
            grid-row: 2;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a0e27 0%, #050812 100%);
        }

        /* RIGHT PANEL - METRICS & INFO */
        #metricsPanel {
            grid-column: 3;
            grid-row: 2;
            background: rgba(0, 30, 60, 0.4);
            border-left: 1px solid #00d4ff;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85em;
        }

        .metric {
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 100, 200, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 4px;
        }

        .metric-label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.8em;
            color: #00ff00;
            font-weight: bold;
        }

        .metric-bar {
            width: 100%;
            height: 4px;
            background: rgba(0, 100, 200, 0.3);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #00ff00);
            border-radius: 2px;
            transition: width 0.3s;
        }

        .thread-list {
            margin-top: 10px;
            font-size: 0.75em;
        }

        .thread-item {
            padding: 5px;
            margin: 3px 0;
            background: rgba(0, 200, 255, 0.1);
            border-left: 2px solid #00d4ff;
            border-radius: 2px;
        }

        .thread-item.active {
            border-left-color: #00ff00;
            background: rgba(0, 255, 0, 0.1);
        }

        /* FOOTER - INPUT & CONTROLS */
        footer {
            grid-column: 1 / -1;
            grid-row: 3;
            background: rgba(0, 20, 40, 0.8);
            border-top: 2px solid #00d4ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            backdrop-filter: blur(10px);
        }

        .input-zone {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #micButton {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #micButton:hover {
            background: linear-gradient(135deg, #00ff00, #00cc00);
            transform: scale(1.1);
        }

        #micButton.listening {
            background: #ff6b6b;
            animation: listening-pulse 1s infinite;
        }

        @keyframes listening-pulse {
            0%, 100% { box-shadow: 0 0 10px #ff6b6b; }
            50% { box-shadow: 0 0 20px #ff6b6b; }
        }

        .input-text {
            flex: 1;
            background: rgba(0, 100, 200, 0.1);
            border: 1px solid #00d4ff;
            border-radius: 4px;
            padding: 10px;
            color: #00d4ff;
            font-size: 0.9em;
        }

        .input-text::placeholder {
            color: #666;
        }

        .input-text:focus {
            outline: none;
            background: rgba(0, 150, 255, 0.15);
            border-color: #00ff00;
        }

        #sendButton {
            padding: 10px 20px;
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            border: none;
            border-radius: 4px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        #sendButton:hover {
            background: linear-gradient(135deg, #00ff00, #00cc00);
            transform: translateY(-2px);
        }

        /* WAVEFORM INDICATOR */
        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 24px;
        }

        .waveform-bar {
            width: 3px;
            background: #00d4ff;
            border-radius: 2px;
            animation: wave 0.5s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        /* SCROLLBAR STYLING */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 100, 200, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00ff00;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>
            <h1>⚡ ARIA</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span id="statusText">Listening</span>
            </div>
        </header>

        <div id="ledgerPanel">
            <div style="color: #666; font-size: 0.7em; margin-bottom: 10px;">CONSCIOUSNESS STREAM</div>
            <div id="ledgerContent">
                <div class="ledger-entry event">
                    ⚡ System initialized
                    <span class="ledger-timestamp">Ready</span>
                </div>
            </div>
        </div>

        <canvas id="canvas"></canvas>

        <div id="metricsPanel">
            <div style="color: #666; font-size: 0.7em; margin-bottom: 10px;">METRICS</div>
            
            <div class="metric">
                <div class="metric-label">Coherence</div>
                <div class="metric-value" id="coherenceValue">0.82</div>
                <div class="metric-bar">
                    <div class="metric-fill" id="coherenceBar" style="width: 82%;"></div>
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">Confidence</div>
                <div class="metric-value" id="confidenceValue">--</div>
                <div class="metric-bar">
                    <div class="metric-fill" id="confidenceBar" style="width: 0%;"></div>
                </div>
            </div>

            <div class="metric">
                <div class="metric-label">Active Threads</div>
                <div id="threadList" class="thread-list">
                    <div class="thread-item">Main: listening</div>
                </div>
            </div>
        </div>

        <footer>
            <div class="input-zone">
                <button id="micButton" title="Click to toggle voice input">🎤</button>
                <input type="text" class="input-text" id="inputText" placeholder="Speak or type your question..." />
                <button id="sendButton">Send</button>
            </div>
            <div class="waveform" id="waveform" style="display: none;">
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
            </div>
        </footer>
    </div>

    <script>
        // ============================================================
        // THREE.JS VISUALIZATION - CONSCIOUSNESS CORE
        // ============================================================

        let scene, camera, renderer;
        let conscious_core, thread_particles = [], decision_rings = [];
        let animation_frame = 0;

        function init3D() {
            // Scene setup
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth * 0.65 / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'), 
                antialias: true, 
                alpha: true 
            });
            renderer.setSize(window.innerWidth * 0.65, window.innerHeight - 120);
            renderer.setClearColor(0x000000, 0.1);

            // Create consciousness core (central sphere)
            const core_geom = new THREE.IcosahedronGeometry(1, 4);
            const core_mat = new THREE.MeshPhongMaterial({
                color: 0x00d4ff,
                emissive: 0x0099cc,
                wireframe: false,
                sphericalEnvMappingEnabled: true
            });
            conscious_core = new THREE.Mesh(core_geom, core_mat);
            scene.add(conscious_core);

            // Create decision rings (orbital shells)
            for (let i = 0; i < 3; i++) {
                const ring_geom = new THREE.BufferGeometry();
                const points = [];
                for (let j = 0; j < 64; j++) {
                    const angle = (j / 64) * Math.PI * 2;
                    const radius = 2 + i * 1;
                    points.push(
                        Math.cos(angle) * radius,
                        Math.sin(angle) * radius * 0.5,
                        Math.sin(angle) * radius * 0.3
                    );
                }
                ring_geom.setAttribute('position', new THREE.BufferAttribute(new Float32Array(points), 3));
                const ring_mat = new THREE.LineBasicMaterial({
                    color: 0x00d4ff,
                    opacity: 0.3 + i * 0.1,
                    transparent: true
                });
                const ring = new THREE.Line(ring_geom, ring_mat);
                decision_rings.push(ring);
                scene.add(ring);
            }

            // Create particle threads
            for (let i = 0; i < 20; i++) {
                const particle_geom = new THREE.SphereGeometry(0.1, 8, 8);
                const particle_mat = new THREE.MeshBasicMaterial({
                    color: new THREE.Color().setHSL(Math.random(), 0.8, 0.6),
                    emissive: new THREE.Color().setHSL(Math.random(), 0.8, 0.6)
                });
                const particle = new THREE.Mesh(particle_geom, particle_mat);
                particle.position.set(
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8,
                    (Math.random() - 0.5) * 8
                );
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );
                particle.orbit_angle = Math.random() * Math.PI * 2;
                particle.orbit_radius = 2 + Math.random() * 2;
                particle.orbit_speed = 0.01 + Math.random() * 0.02;
                thread_particles.push(particle);
                scene.add(particle);
            }

            // Lighting
            const light1 = new THREE.PointLight(0x00d4ff, 1, 100);
            light1.position.set(5, 5, 5);
            scene.add(light1);

            const light2 = new THREE.PointLight(0x00ff00, 0.5, 100);
            light2.position.set(-5, -5, -5);
            scene.add(light2);

            const ambient = new THREE.AmbientLight(0x666666);
            scene.add(ambient);

            animate3D();
        }

        function animate3D() {
            requestAnimationFrame(animate3D);

            // Rotate consciousness core
            conscious_core.rotation.x += 0.001;
            conscious_core.rotation.y += 0.002;

            // Rotate decision rings
            decision_rings.forEach((ring, i) => {
                ring.rotation.z += 0.001 * (i + 1);
                ring.rotation.x += 0.0005 * (i + 1);
            });

            // Animate thread particles (orbiting + drifting)
            thread_particles.forEach(particle => {
                particle.orbit_angle += particle.orbit_speed;
                const x = Math.cos(particle.orbit_angle) * particle.orbit_radius;
                const y = Math.sin(particle.orbit_angle) * particle.orbit_radius * 0.3;
                const z = Math.sin(particle.orbit_angle * 0.5) * particle.orbit_radius * 0.2;
                
                particle.position.lerp(new THREE.Vector3(x, y, z), 0.1);
                particle.rotation.x += 0.01;
                particle.rotation.y += 0.01;
            });

            renderer.render(scene, camera);
        }

        // ============================================================
        // INTERFACE INTERACTION
        // ============================================================

        let ws = null;
        let listening = false;
        let recognition = null;

        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/aria`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                if (data.type === 'response') {
                    updateResponse(data.response, data.confidence);
                }
                if (data.type === 'ledger') {
                    addLedgerEntry(data.entry, data.event_type);
                }
                if (data.type === 'metrics') {
                    updateMetrics(data);
                }
                if (data.type === 'thread') {
                    addThreadIndicator(data.thread_name, data.status);
                }
            };

            ws.onerror = () => {
                updateStatus('Connection error');
            };
        }

        function initVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Speech Recognition not supported');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;

            recognition.onstart = () => {
                listening = true;
                document.getElementById('micButton').classList.add('listening');
                document.getElementById('waveform').style.display = 'flex';
                updateStatus('Listening...');
            };

            recognition.onresult = (event) => {
                let interim_transcript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript;
                    if (event.results[i].isFinal) {
                        document.getElementById('inputText').value = transcript;
                        sendMessage(transcript);
                    } else {
                        interim_transcript += transcript;
                    }
                }
                
                if (interim_transcript) {
                    document.getElementById('inputText').placeholder = interim_transcript;
                }
            };

            recognition.onend = () => {
                listening = false;
                document.getElementById('micButton').classList.remove('listening');
                document.getElementById('waveform').style.display = 'none';
                updateStatus('Ready');
            };
        }

        function toggleMic() {
            if (listening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function sendMessage(text) {
            if (!text.trim()) return;
            
            addLedgerEntry(`You: ${text}`, 'event');
            document.getElementById('inputText').value = '';
            
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'message',
                    text: text
                }));
            }
        }

        function updateResponse(response, confidence) {
            addLedgerEntry(`ARIA: ${response}`, 'decision');
            
            if (confidence) {
                document.getElementById('confidenceValue').textContent = (confidence * 100).toFixed(0) + '%';
                document.getElementById('confidenceBar').style.width = (confidence * 100) + '%';
            }
            
            // Text-to-speech
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(response);
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                speechSynthesis.speak(utterance);
            }
        }

        function addLedgerEntry(text, type = 'event') {
            const panel = document.getElementById('ledgerContent');
            const entry = document.createElement('div');
            entry.className = `ledger-entry ${type}`;
            entry.innerHTML = `
                ${text}
                <span class="ledger-timestamp">${new Date().toLocaleTimeString()}</span>
            `;
            panel.appendChild(entry);
            panel.scrollTop = panel.scrollHeight;
        }

        function updateMetrics(data) {
            if (data.coherence !== undefined) {
                document.getElementById('coherenceValue').textContent = data.coherence.toFixed(2);
                document.getElementById('coherenceBar').style.width = (data.coherence * 100) + '%';
            }
        }

        function addThreadIndicator(name, status) {
            const threadList = document.getElementById('threadList');
            let threadEl = document.querySelector(`[data-thread="${name}"]`);
            
            if (!threadEl) {
                threadEl = document.createElement('div');
                threadEl.className = `thread-item ${status}`;
                threadEl.setAttribute('data-thread', name);
                threadList.appendChild(threadEl);
            }
            
            threadEl.textContent = `${name}: ${status}`;
            threadEl.className = `thread-item ${status === 'active' ? 'active' : ''}`;
        }

        function updateStatus(text) {
            document.getElementById('statusText').textContent = text;
        }

        // ============================================================
        // EVENT LISTENERS
        // ============================================================

        document.getElementById('micButton').addEventListener('click', toggleMic);
        
        document.getElementById('sendButton').addEventListener('click', () => {
            const text = document.getElementById('inputText').value;
            sendMessage(text);
        });

        document.getElementById('inputText').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const text = document.getElementById('inputText').value;
                sendMessage(text);
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = (window.innerWidth * 0.65) / (window.innerHeight - 120);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.65, window.innerHeight - 120);
        });

        // ============================================================
        // INITIALIZATION
        // ============================================================

        document.addEventListener('DOMContentLoaded', () => {
            init3D();
            initWebSocket();
            initVoice();
            updateStatus('Ready');
        });
    </script>
</body>
</html>
