# RENDER SPECIFICATION - Constraint Declaration
# This is NOT a render function. This DECLARES what rendering means.
# Renderer executes this spec. Election respects this spec.

canvas:
  width: 2048
  height: 2048
  background: "#0a0a0a"
  anti_alias: true

# Each primitive maps to a visual constraint
# These are NOT instructions. These are MEANINGS.
primitives:

  # ⊙ SINGULARITY: Irreducible point of identity
  # Visual: Position in 3D space (center)
  singularity:
    visual_element: "sphere_center"
    spatial_mapping:
      x_axis: "election_index_in_timeline"
      y_axis: "singularity_strength"
      z_axis: "time_since_election"
    geometric:
      shape: "sphere"
      position_formula: "(x * 0.2, y * 500, z * 10)"
      position_range_x: [0, 2048]
      position_range_y: [0, 2048]
    appearance:
      color: "rgb(255, 255, 255)"
      opacity: 1.0

  # β DUALITY: Binary nature clarity
  # Visual: Branch lines from center
  duality:
    visual_element: "branch_lines"
    semantic: "strength of binary choice"
    weight_from: "β"
    geometric:
      shape: "line"
      start: "singularity_position"
      end_offset: "(±150 * β, 0, 0)"
    appearance:
      color: "rgb(0, 255, 128)"
      thickness: "2 * β"
      opacity: "β"

  # κ⊕ MANIFESTATION: Certainty/manifestness
  # Visual: Glow intensity around sphere
  manifestation:
    visual_element: "glow_intensity"
    semantic: "how certain is the decision"
    value_from: "κ⊕"
    geometric:
      source: "singularity_position"
      radius: "50 + (κ⊕ * 100)"
    appearance:
      color: "rgb(255, 200, 0)"
      intensity: "κ⊕ * 255"
      falloff: "exponential"

  # λ LEDGER: Recordability/immutability
  # Visual: Sphere size
  ledger:
    visual_element: "sphere_radius"
    semantic: "historical weight of this election"
    value_from: "λ"
    geometric:
      shape: "sphere"
      radius: "10 + (λ * 90)"
      position: "singularity_position"
    appearance:
      color: "rgb(100, 100, 200)"
      intensity: "0.5 + (λ * 0.5)"

  # Θ FREQUENCY: Timing/oscillation strength
  # Visual: Pulse rate
  frequency:
    visual_element: "pulse_animation"
    semantic: "how often does this recur"
    value_from: "Θ"
    animation:
      type: "pulse"
      period_ms: "1000 / (Θ + 0.1)"  # Faster pulse = higher frequency
      amplitude: "20 * Θ"
      target: "sphere_center"

  # τ COHERENCE: Organization/unity quality
  # Visual: Color saturation
  coherence:
    visual_element: "color_saturation"
    semantic: "how organized is this election"
    value_from: "τ"
    appearance:
      saturation_percent: "50 + (τ * 50)"
      hue_base: "180"  # Cyan for maximum coherence
      hue_desaturated: "0"  # Grayscale for low coherence
      target: "all_sphere_colors"

# Rendering rules that MUST be followed
rendering_rules:
  rule_1_bijection:
    name: "Every primitive maps to exactly one visual"
    validation: |
      For each primitive in {⊙, β, κ⊕, λ, Θ, τ}:
        Assert: exactly_one_visual_element exists
        Assert: visual_element is_drawable with given_values

  rule_2_determinism:
    name: "Same primitives always render same pixels"
    validation: |
      For any two elections with identical primitives:
        Assert: render(election1) == render(election2)
        (byte-for-byte identical PNG)

  rule_3_coverage:
    name: "Every pixel is determined by some primitive"
    validation: |
      For every pixel in output PNG:
        Assert: pixel_value comes_from one_or_more_primitives
        Assert: can_trace_to_rule in_this_spec

  rule_4_no_invention:
    name: "Renderer never makes decisions"
    validation: |
      For all pixels rendered:
        Assert: NOT renderer.decision(pixel)
        Assert: renderer.executes_only(this_spec)

  rule_5_always_valid:
    name: "Rendering never fails"
    validation: |
      For any election and primitives:
        Assert: render(primitives) always_succeeds
        Assert: output always_valid_png

# Output format specification
output:
  format: "PNG"
  signature: "0x89504E47"  # PNG magic number
  dimensions:
    width: 2048
    height: 2048
    channels: 4  # RGBA
    bit_depth: 8
  color_space: "sRGB"
  gamma: 2.2

# Validation checklist for this spec
validation_checklist:
  - "All 6 primitives declared"
  - "Each primitive has exactly one visual_element"
  - "No primitive appears twice"
  - "All geometric positions within canvas bounds"
  - "All color values are valid RGB/RGBA"
  - "All opacity values in [0, 1]"
  - "All formulas reference only declared primitives"
  - "No undefined variables in any formula"
  - "Bijection rule satisfied (1:1 primitive to visual)"
  - "Determinism guaranteed (no random choices)"
  - "No conditional logic (always render same way)"

# How this spec is used
usage:
  phase_1_declaration: "This spec DECLARES what rendering means"
  phase_2_validation: "Election MUST output primitives matching this spec"
  phase_3_execution: "Renderer MUST follow this spec exactly"
  phase_4_verification: "Output MUST satisfy all rendering_rules"

# Meta: What this specification IS
meta:
  purpose: "Constraint declaration, not implementation"
  executor: "Generic Renderer class"
  language: "Symbolic/declarative (this file)"
  execution: "Code interprets this, doesn't generate from it"
  immutable: true
  versioned: true
