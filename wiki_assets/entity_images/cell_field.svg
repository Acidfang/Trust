<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Fundamental field gradient -->
        <radialGradient id="fundamentalField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.68" />
            <stop offset="50%" style="stop-color:#00ddff;stop-opacity:0.34" />
            <stop offset="100%" style="stop-color:#1a1a3f;stop-opacity:0.2" />
        </radialGradient>
        
        <!-- Aesthetic field gradient -->
        <radialGradient id="aestheticField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.3" />
            <stop offset="50%" style="stop-color:#88ff00;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0.1" />
        </radialGradient>
        
        <!-- Interaction zone filter -->
        <filter id="fieldInteraction">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.6"/>
            </feComponentTransfer>
        </filter>
        
        <!-- Fundamental boundary marker -->
        <marker id="boundaryMarker" markerWidth="10" markerHeight="10" refX="5" refY="5" markerUnits="strokeWidth">
            <circle cx="5" cy="5" r="3" fill="#ff8800" opacity="0.7"/>
        </marker>
    </defs>
    
    <!-- Background: Void/latent field -->
    <rect width="800" height="800" fill="#0a0a0a"/>
    
    <!-- FUNDAMENTAL FIELD LAYERS (bottom) -->
    <g id="fundamentalField">
        <text x="10" y="30" fill="#ff8800" font-size="12" font-family="monospace" opacity="0.5">
            FUNDAMENTAL FIELD (Binary Level)
        </text>
        <!-- Layer 7 (radius 255) -->
        <circle cx="400" cy="400" r="255.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.372"/>
        <!-- Layer 6 (radius 230) -->
        <circle cx="400" cy="400" r="230.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.3331428571428572"/>
        <!-- Layer 5 (radius 205) -->
        <circle cx="400" cy="400" r="205.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.2942857142857143"/>
        <!-- Layer 4 (radius 180) -->
        <circle cx="400" cy="400" r="180.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.25542857142857145"/>
        <!-- Layer 3 (radius 155) -->
        <circle cx="400" cy="400" r="155.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.21657142857142858"/>
        <!-- Layer 2 (radius 130) -->
        <circle cx="400" cy="400" r="130.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.1777142857142857"/>
        <!-- Layer 1 (radius 105) -->
        <circle cx="400" cy="400" r="105.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.13885714285714287"/>
        
        <!-- Convergence Centers (9) -->
        <circle cx="460.0" cy="400.0" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="446.0" cy="438.6" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="410.4" cy="459.1" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="370.0" cy="452.0" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="343.6" cy="420.5" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="343.6" cy="379.5" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="370.0" cy="348.0" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="410.4" cy="340.9" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="446.0" cy="361.4" r="6" fill="#00ff88" opacity="0.7"/>
        <line x1="460.0" y1="400.0" x2="446.0" y2="438.6" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="446.0" y1="438.6" x2="410.4" y2="459.1" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="410.4" y1="459.1" x2="370.0" y2="452.0" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="370.0" y1="452.0" x2="343.6" y2="420.5" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="343.6" y1="420.5" x2="343.6" y2="379.5" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="343.6" y1="379.5" x2="370.0" y2="348.0" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="370.0" y1="348.0" x2="410.4" y2="340.9" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="410.4" y1="340.9" x2="446.0" y2="361.4" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
    </g>
    
    <!-- AESTHETIC FIELD (overlay) -->
    <g id="aestheticField" opacity="0.6">
        <text x="10" y="770" fill="#ff00ff" font-size="12" font-family="monospace" opacity="0.7">
            AESTHETIC FIELD (Representational)
        </text>
        <!-- Aesthetic Spiral 1 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 440.0,400.0 L 442.8,415.6 L 439.2,432.9 L 428.3,449.1 L 410.8,461.3 L 388.2,466.7 L 363.3,463.5 L 339.6,450.7 L 320.6,428.9 L 310.0,400.0 L 310.2,367.3 L 322.5,335.0 L 346.7,307.6 L 380.5,289.5 L 420.5,284.0 L 461.7,293.2 L 498.7,317.2 L 526.3,354.0" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 2 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 412.4,438.0 L 398.4,445.5 L 380.9,447.4 L 362.1,442.1 L 345.1,429.2 L 332.9,409.4 L 328.3,384.8 L 333.1,358.2 L 348.0,333.5 L 372.2,314.4 L 403.3,304.5 L 437.9,306.3 L 471.4,320.7 L 499.1,347.3 L 516.6,383.6 L 520.6,425.6 L 509.3,468.3 L 482.8,505.9" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 3 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 367.6,423.5 L 356.2,412.6 L 349.0,396.4 L 348.2,377.0 L 355.2,356.8 L 370.3,339.1 L 392.3,327.1 L 419.1,323.5 L 447.2,330.0 L 472.8,347.1 L 491.9,373.7 L 500.9,407.1 L 497.4,443.4 L 480.7,478.0 L 451.6,505.9 L 412.9,522.7 L 368.8,525.1 L 324.8,511.5" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 4 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 367.6,376.5 L 374.5,362.2 L 387.6,350.4 L 405.9,343.6 L 427.3,344.1 L 448.8,352.9 L 467.0,370.2 L 478.7,394.5 L 481.2,423.3 L 472.8,452.9 L 453.4,479.2 L 424.5,498.1 L 388.9,506.1 L 350.8,500.9 L 315.3,481.8 L 287.3,450.2 L 271.4,409.0 L 270.8,362.9" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 5 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 412.4,362.0 L 428.0,364.1 L 443.3,372.9 L 455.4,388.2 L 461.6,408.7 L 459.8,431.8 L 449.1,454.5 L 429.6,473.1 L 402.9,484.4 L 372.2,485.6 L 341.2,475.3 L 314.3,453.6 L 295.7,422.2 L 288.9,384.4 L 296.0,344.7 L 317.5,308.3 L 351.7,280.5 L 395.3,265.6" stroke-width="1"/>
        </g>
    </g>
    
    <!-- INTERACTION ZONE (where fields meet) -->
    <g id="interaction">
        <text x="10" y="50" fill="#88ff00" font-size="12" font-family="monospace" opacity="0.5">
            INTERACTION (Dual-Field Convergence)
        </text>
        
        <!-- Central coherence region -->
        <circle cx="400" cy="400" r="185.0" fill="url(#fundamentalField)" opacity="0.7"/>
        <circle cx="400" cy="400" r="185.0" fill="url(#aestheticField)" opacity="0.5"/>
    </g>
    
    <!-- BOUNDARY MARKER - Shows actual field edge -->
    <circle cx="400" cy="400" r="255.0" fill="none" stroke="#ff8800" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
    
    <!-- ENTITY INFORMATION -->
    <text x="400" y="730" text-anchor="middle" fill="#00ff88" font-size="14" font-family="monospace" font-weight="bold">
        Cell
    </text>
    <text x="400" y="750" text-anchor="middle" fill="#00ddff" font-size="11" font-family="monospace">
        Multi-center organized convergence
    </text>
    <text x="400" y="765" text-anchor="middle" fill="#88ff00" font-size="10" font-family="monospace">
        Centers: 9 | Layers: 7 | Coherence: 0.68
    </text>
    <text x="400" y="780" text-anchor="middle" fill="#ffff00" font-size="9" font-family="monospace">
        Boundary: membrane
    </text>
</svg>