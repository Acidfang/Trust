<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="800" height="800" fill="#0a0a0a"/>
    
    <!-- NUCLEUS: 6 protons + 6 neutrons (approximately) -->
    <circle cx="400" cy="400" r="10" fill="#ff0000" opacity="0.95"/>
    <text x="400" y="407" text-anchor="middle" fill="#ff0000" font-size="8" font-family="monospace">
        Z=6
    </text>
    
    <!-- ELECTRON CONFIGURATION: Deterministically derived from Aufbau principle -->
    <circle cx="400" cy="400" r="50" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="450" cy="400" r="3" fill="#ff00ff" opacity="0.7"/>
    <circle cx="400" cy="400" r="100" fill="none" stroke="#00ddff" stroke-width="1.5" opacity="0.5"/>
    <circle cx="500" cy="400" r="3" fill="#00ddff" opacity="0.7"/>
    <circle cx="300" cy="400" r="3" fill="#00ddff" opacity="0.7"/>
    <circle cx="400" cy="400" r="150" fill="none" stroke="#00ff88" stroke-width="1.5" opacity="0.5"/>
    <circle cx="550" cy="400" r="3" fill="#00ff88" opacity="0.7"/>
    <circle cx="325" cy="530" r="3" fill="#00ff88" opacity="0.7"/>
    <circle cx="325" cy="270" r="3" fill="#00ff88" opacity="0.7"/>
    
    <g opacity="0.6">
        <text x="50" y="620" fill="#00ff88" font-size="12" font-family="monospace" font-weight="bold">
            CARBON (Z=6)
        </text>
        <text x="50" y="640" fill="#ffff00" font-size="10" font-family="monospace">
            Config: 1s(1) 2s(2) 2p(3)
        </text>
        <text x="50" y="655" fill="#00ddff" font-size="10" font-family="monospace">
            1st Ionization: 489.6 eV (Rydberg formula)
        </text>
        <text x="50" y="670" fill="#ff8800" font-size="10" font-family="monospace">
            Atomic radius: 0.53 Ångströms (derived)
        </text>
        <text x="50" y="685" fill="#ff00ff" font-size="9" font-family="monospace">
            DETERMINISTIC: Bohr model + Aufbau principle
        </text>
    </g>
    
    <text x="400" y="750" text-anchor="middle" fill="#00ff88" font-size="11" font-family="monospace" font-weight="bold">
        Carbon: Deterministically derived from 6 protons + physics laws
    </text>
</svg>