<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Fundamental field gradient -->
        <radialGradient id="fundamentalField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.99" />
            <stop offset="50%" style="stop-color:#00ddff;stop-opacity:0.495" />
            <stop offset="100%" style="stop-color:#1a1a3f;stop-opacity:0.2" />
        </radialGradient>
        
        <!-- Aesthetic field gradient -->
        <radialGradient id="aestheticField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.3" />
            <stop offset="50%" style="stop-color:#88ff00;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0.1" />
        </radialGradient>
        
        <!-- Interaction zone filter -->
        <filter id="fieldInteraction">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.6"/>
            </feComponentTransfer>
        </filter>
        
        <!-- Fundamental boundary marker -->
        <marker id="boundaryMarker" markerWidth="10" markerHeight="10" refX="5" refY="5" markerUnits="strokeWidth">
            <circle cx="5" cy="5" r="3" fill="#ff8800" opacity="0.7"/>
        </marker>
    </defs>
    
    <!-- Background: Void/latent field -->
    <rect width="800" height="800" fill="#0a0a0a"/>
    
    <!-- FUNDAMENTAL FIELD LAYERS (bottom) -->
    <g id="fundamentalField">
        <text x="10" y="30" fill="#ff8800" font-size="12" font-family="monospace" opacity="0.5">
            FUNDAMENTAL FIELD (Binary Level)
        </text>
        <!-- Layer 1 (radius 180) -->
        <circle cx="400" cy="400" r="180.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.496"/>
        
        <!-- Convergence Centers (1) -->
        <circle cx="400" cy="400" r="8" fill="#00ff88" opacity="0.9"/>
        <circle cx="400" cy="400" r="15" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.6"/>
    </g>
    
    <!-- AESTHETIC FIELD (overlay) -->
    <g id="aestheticField" opacity="0.6">
        <text x="10" y="770" fill="#ff00ff" font-size="12" font-family="monospace" opacity="0.7">
            AESTHETIC FIELD (Representational)
        </text>
        <!-- Aesthetic Spiral 1 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 440.0,400.0 L 442.8,415.6 L 439.2,432.9 L 428.3,449.1 L 410.8,461.3 L 388.2,466.7 L 363.3,463.5 L 339.6,450.7 L 320.6,428.9 L 310.0,400.0 L 310.2,367.3 L 322.5,335.0 L 346.7,307.6 L 380.5,289.5 L 420.5,284.0 L 461.7,293.2 L 498.7,317.2 L 526.3,354.0" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 2 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 424.9,431.3 L 414.5,443.2 L 398.7,451.1 L 379.3,452.7 L 358.8,446.7 L 340.5,432.4 L 327.5,410.9 L 322.7,384.4 L 327.9,356.0 L 343.9,329.6 L 369.6,309.4 L 402.5,298.9 L 439.0,300.7 L 474.3,315.9 L 503.4,343.7 L 522.0,381.6 L 526.3,425.5 L 514.7,470.1" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 3 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 391.1,439.0 L 375.3,438.3 L 359.3,430.9 L 345.9,416.7 L 337.9,396.9 L 337.5,373.7 L 346.2,350.1 L 364.0,329.8 L 389.5,316.2 L 420.0,312.3 L 451.8,319.7 L 480.6,338.9 L 501.9,368.6 L 512.1,405.6 L 508.5,445.7 L 490.4,483.9 L 458.8,514.7 L 416.7,533.4" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 4 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 364.0,417.4 L 354.7,404.5 L 350.5,387.4 L 353.2,368.1 L 363.7,349.5 L 381.6,334.8 L 405.5,326.9 L 432.4,328.1 L 459.0,339.5 L 481.1,361.0 L 495.1,390.5 L 498.0,424.9 L 488.1,460.1 L 465.5,491.1 L 431.9,513.4 L 390.8,523.0 L 347.0,517.5 L 306.1,496.2" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 5 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 364.0,382.6 L 368.2,367.4 L 379.0,353.4 L 395.8,343.5 L 416.9,340.1 L 439.6,345.0 L 460.6,358.7 L 476.4,380.5 L 484.0,408.4 L 481.1,439.0 L 466.7,468.4 L 441.6,492.2 L 408.0,506.4 L 369.6,508.0 L 331.2,495.6 L 298.1,469.5 L 275.1,431.8 L 266.2,386.6" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 6 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 391.1,361.0 L 405.7,354.8 L 423.3,354.5 L 441.5,361.5 L 457.3,375.8 L 467.7,396.6 L 470.1,421.6 L 462.9,447.6 L 445.8,470.9 L 420.0,487.7 L 388.1,494.8 L 353.9,490.0 L 321.8,472.6 L 296.6,443.6 L 282.4,405.9 L 282.1,363.6 L 297.3,322.2 L 327.1,287.1" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 7 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 424.9,368.7 L 438.9,376.2 L 450.1,389.9 L 456.0,408.4 L 454.6,429.8 L 444.8,450.8 L 426.8,468.3 L 402.0,478.9 L 373.1,480.0 L 343.9,470.4 L 318.5,449.8 L 300.9,420.0 L 294.5,384.1 L 301.4,346.3 L 322.1,311.7 L 354.9,285.2 L 396.8,271.2 L 442.8,272.6" stroke-width="1"/>
        </g>
    </g>
    
    <!-- INTERACTION ZONE (where fields meet) -->
    <g id="interaction">
        <text x="10" y="50" fill="#88ff00" font-size="12" font-family="monospace" opacity="0.5">
            INTERACTION (Dual-Field Convergence)
        </text>
        
        <!-- Central coherence region -->
        <circle cx="400" cy="400" r="140.0" fill="url(#fundamentalField)" opacity="0.7"/>
        <circle cx="400" cy="400" r="140.0" fill="url(#aestheticField)" opacity="0.5"/>
    </g>
    
    <!-- BOUNDARY MARKER - Shows actual field edge -->
    <circle cx="400" cy="400" r="180.0" fill="none" stroke="#ff8800" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
    
    <!-- ENTITY INFORMATION -->
    <text x="400" y="730" text-anchor="middle" fill="#00ff88" font-size="14" font-family="monospace" font-weight="bold">
        Electron
    </text>
    <text x="400" y="750" text-anchor="middle" fill="#00ddff" font-size="11" font-family="monospace">
        Single-point field convergence
    </text>
    <text x="400" y="765" text-anchor="middle" fill="#88ff00" font-size="10" font-family="monospace">
        Centers: 1 | Layers: 1 | Coherence: 0.99
    </text>
    <text x="400" y="780" text-anchor="middle" fill="#ffff00" font-size="9" font-family="monospace">
        Boundary: point
    </text>
</svg>