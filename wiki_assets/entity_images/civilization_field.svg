<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Fundamental field gradient -->
        <radialGradient id="fundamentalField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#00ff88;stop-opacity:0.55" />
            <stop offset="50%" style="stop-color:#00ddff;stop-opacity:0.275" />
            <stop offset="100%" style="stop-color:#1a1a3f;stop-opacity:0.2" />
        </radialGradient>
        
        <!-- Aesthetic field gradient -->
        <radialGradient id="aestheticField" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#ff00ff;stop-opacity:0.3" />
            <stop offset="50%" style="stop-color:#88ff00;stop-opacity:0.2" />
            <stop offset="100%" style="stop-color:#ffff00;stop-opacity:0.1" />
        </radialGradient>
        
        <!-- Interaction zone filter -->
        <filter id="fieldInteraction">
            <feGaussianBlur in="SourceGraphic" stdDeviation="2" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.6"/>
            </feComponentTransfer>
        </filter>
        
        <!-- Fundamental boundary marker -->
        <marker id="boundaryMarker" markerWidth="10" markerHeight="10" refX="5" refY="5" markerUnits="strokeWidth">
            <circle cx="5" cy="5" r="3" fill="#ff8800" opacity="0.7"/>
        </marker>
    </defs>
    
    <!-- Background: Void/latent field -->
    <rect width="800" height="800" fill="#0a0a0a"/>
    
    <!-- FUNDAMENTAL FIELD LAYERS (bottom) -->
    <g id="fundamentalField">
        <text x="10" y="30" fill="#ff8800" font-size="12" font-family="monospace" opacity="0.5">
            FUNDAMENTAL FIELD (Binary Level)
        </text>
        <!-- Layer 9 (radius 260) -->
        <circle cx="400" cy="400" r="260.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.32000000000000006"/>
        <!-- Layer 8 (radius 240) -->
        <circle cx="400" cy="400" r="240.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.29555555555555557"/>
        <!-- Layer 7 (radius 220) -->
        <circle cx="400" cy="400" r="220.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.27111111111111114"/>
        <!-- Layer 6 (radius 200) -->
        <circle cx="400" cy="400" r="200.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.2466666666666667"/>
        <!-- Layer 5 (radius 180) -->
        <circle cx="400" cy="400" r="180.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.22222222222222224"/>
        <!-- Layer 4 (radius 160) -->
        <circle cx="400" cy="400" r="160.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.1977777777777778"/>
        <!-- Layer 3 (radius 140) -->
        <circle cx="400" cy="400" r="140.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.17333333333333334"/>
        <!-- Layer 2 (radius 120) -->
        <circle cx="400" cy="400" r="120.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.1488888888888889"/>
        <!-- Layer 1 (radius 100) -->
        <circle cx="400" cy="400" r="100.0" fill="none" stroke="#00ddff" stroke-width="1" opacity="0.12444444444444445"/>
        
        <!-- Convergence Centers (5) -->
        <circle cx="460.0" cy="400.0" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="418.5" cy="457.1" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="351.5" cy="435.3" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="351.5" cy="364.7" r="6" fill="#00ff88" opacity="0.7"/>
        <circle cx="418.5" cy="342.9" r="6" fill="#00ff88" opacity="0.7"/>
        <line x1="460.0" y1="400.0" x2="418.5" y2="457.1" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="418.5" y1="457.1" x2="351.5" y2="435.3" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="351.5" y1="435.3" x2="351.5" y2="364.7" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
        <line x1="351.5" y1="364.7" x2="418.5" y2="342.9" stroke="#ff8800" stroke-width="1" opacity="0.4"/>
    </g>
    
    <!-- AESTHETIC FIELD (overlay) -->
    <g id="aestheticField" opacity="0.6">
        <text x="10" y="770" fill="#ff00ff" font-size="12" font-family="monospace" opacity="0.7">
            AESTHETIC FIELD (Representational)
        </text>
        <!-- Aesthetic Spiral 1 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 440.0,400.0 L 442.8,415.6 L 439.2,432.9 L 428.3,449.1 L 410.8,461.3 L 388.2,466.7 L 363.3,463.5 L 339.6,450.7 L 320.6,428.9 L 310.0,400.0 L 310.2,367.3 L 322.5,335.0 L 346.7,307.6 L 380.5,289.5 L 420.5,284.0 L 461.7,293.2 L 498.7,317.2 L 526.3,354.0" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 2 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 400.0,440.0 L 384.4,442.8 L 367.1,439.2 L 350.9,428.3 L 338.7,410.8 L 333.3,388.2 L 336.5,363.3 L 349.3,339.6 L 371.1,320.6 L 400.0,310.0 L 432.7,310.2 L 465.0,322.5 L 492.4,346.7 L 510.5,380.5 L 516.0,420.5 L 506.8,461.7 L 482.8,498.7 L 446.0,526.3" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 3 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 360.0,400.0 L 357.2,384.4 L 360.8,367.1 L 371.7,350.9 L 389.2,338.7 L 411.8,333.3 L 436.7,336.5 L 460.4,349.3 L 479.4,371.1 L 490.0,400.0 L 489.8,432.7 L 477.5,465.0 L 453.3,492.4 L 419.5,510.5 L 379.5,516.0 L 338.3,506.8 L 301.3,482.8 L 273.7,446.0" stroke-width="1"/>
        </g>
        <!-- Aesthetic Spiral 4 -->
        <g stroke="#ff00ff" fill="none" opacity="0.4">
            <path d="M 400.0,360.0 L 415.6,357.2 L 432.9,360.8 L 449.1,371.7 L 461.3,389.2 L 466.7,411.8 L 463.5,436.7 L 450.7,460.4 L 428.9,479.4 L 400.0,490.0 L 367.3,489.8 L 335.0,477.5 L 307.6,453.3 L 289.5,419.5 L 284.0,379.5 L 293.2,338.3 L 317.2,301.3 L 354.0,273.7" stroke-width="1"/>
        </g>
    </g>
    
    <!-- INTERACTION ZONE (where fields meet) -->
    <g id="interaction">
        <text x="10" y="50" fill="#88ff00" font-size="12" font-family="monospace" opacity="0.5">
            INTERACTION (Dual-Field Convergence)
        </text>
        
        <!-- Central coherence region -->
        <circle cx="400" cy="400" r="188.0" fill="url(#fundamentalField)" opacity="0.7"/>
        <circle cx="400" cy="400" r="188.0" fill="url(#aestheticField)" opacity="0.5"/>
    </g>
    
    <!-- BOUNDARY MARKER - Shows actual field edge -->
    <circle cx="400" cy="400" r="260.0" fill="none" stroke="#ff8800" stroke-width="2" stroke-dasharray="5,5" opacity="0.6"/>
    
    <!-- ENTITY INFORMATION -->
    <text x="400" y="730" text-anchor="middle" fill="#00ff88" font-size="14" font-family="monospace" font-weight="bold">
        Civilization
    </text>
    <text x="400" y="750" text-anchor="middle" fill="#00ddff" font-size="11" font-family="monospace">
        Abstract information field convergence
    </text>
    <text x="400" y="765" text-anchor="middle" fill="#88ff00" font-size="10" font-family="monospace">
        Centers: 5 | Layers: 9 | Coherence: 0.55
    </text>
    <text x="400" y="780" text-anchor="middle" fill="#ffff00" font-size="9" font-family="monospace">
        Boundary: informational
    </text>
</svg>