<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Self-Mapping Causal Tree - Auto-Decomposition</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; color: #00d9ff; font-family: 'Courier New', monospace; overflow: hidden; }
    
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    
    #header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid #00d9ff;
    }
    
    #header h1 { font-size: 1.5rem; text-shadow: 0 0 20px rgba(0, 217, 255, 0.5); }
    #header p { font-size: 0.85rem; color: #00ff00; opacity: 0.8; margin-top: 0.3rem; }
    
    .controls { display: flex; gap: 0.5rem; float: right; margin-top: -2.5rem; }
    .btn { background: rgba(0, 217, 255, 0.1); border: 1px solid #00d9ff; color: #00d9ff; width: 40px; height: 40px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .btn:hover { background: rgba(0, 217, 255, 0.2); }
    
    #canvas { flex: 1; background: radial-gradient(circle at 50% 50%, #0f0f1e 0%, #0a0a0a 100%); cursor: grab; }
    #canvas:active { cursor: grabbing; }
    
    #breadcrumb { background: rgba(0, 217, 255, 0.05); padding: 0.75rem 1.5rem; border-bottom: 1px solid rgba(0, 217, 255, 0.1); font-size: 0.85rem; min-height: 40px; display: flex; align-items: center; gap: 0.5rem; }
    
    #detail {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 400px;
      background: rgba(26, 26, 26, 0.98);
      border-top: 2px solid #00d9ff;
      border-left: 1px solid #00d9ff;
      padding: 1.5rem;
      max-height: 50vh;
      overflow-y: auto;
      display: none;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    #detail.visible { display: block; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    
    #detail h3 { color: #00ff00; font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid #00d9ff; padding-bottom: 0.5rem; }
    
    .card { background: rgba(0, 217, 255, 0.05); border: 1px solid rgba(0, 217, 255, 0.2); padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 4px; }
    .label { color: #00d9ff; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; opacity: 0.7; margin-bottom: 0.3rem; }
    .value { color: #00ff00; font-size: 0.9rem; line-height: 1.4; word-break: break-word; }
    
    #footer { background: #1a1a1a; border-top: 1px solid #00d9ff; padding: 0.75rem 1.5rem; font-size: 0.8rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="controls">
        <button class="btn" onclick="app.reset()">↺</button>
        <button class="btn" onclick="app.fitAll()">⊡</button>
      </div>
      <h1>🧠 Self-Mapping Causal Tree</h1>
      <p>Select domain → auto-discovers decomposition by analyzing dependencies</p>
    </div>
    
    <div style="display: flex; height: calc(100% - 60px);">
      <div id="sidebar" style="width: 220px; background: rgba(26, 26, 46, 0.8); border-right: 2px solid #00d9ff; display: flex; flex-direction: column; overflow-y: auto;">
        <div style="padding: 1rem; border-bottom: 1px solid #00d9ff;">
          <div style="color: #00ff00; font-weight: bold; font-size: 0.9rem; margin-bottom: 1rem;">DOMAINS</div>
          <div id="domains" style="display: flex; flex-direction: column; gap: 0.5rem;"></div>
        </div>
        <div style="padding: 1rem; border-top: 1px solid #00d9ff; border-bottom: 1px solid #00d9ff; flex: 1; overflow-y: auto;">
          <div style="color: #00ff00; font-weight: bold; font-size: 0.9rem; margin-bottom: 1rem;">VIEW MODE</div>
          <button id="decomp-view" style="width: 100%; background: rgba(0, 217, 255, 0.2); border: 1px solid #00d9ff; color: #00d9ff; padding: 0.5rem; cursor: pointer; margin-bottom: 0.5rem; border-radius: 3px;">📊 Decomposition</button>
          <button id="combo-view" style="width: 100%; background: rgba(255, 105, 180, 0.1); border: 1px solid rgba(255, 105, 180, 0.5); color: #ff69b4; padding: 0.5rem; cursor: pointer; border-radius: 3px; opacity: 0.5;" disabled>🧬 Combinations</button>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column;">
    
    <div id="breadcrumb">
      <button style="background: none; border: none; color: #00d9ff; cursor: pointer;" onclick="app.deselect()">Root</button>
      <span id="path"></span>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="detail">
      <button style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #00d9ff; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('detail').classList.remove('visible')">✕</button>
      <h3 id="title"></h3>
      <div id="content"></div>
    </div>
      </div>
    </div>
    
    <div id="footer" style="background: #1a1a1a; border-top: 1px solid #00d9ff; padding: 0.75rem 1.5rem; font-size: 0.8rem; display: flex; justify-content: space-between;">
      <div>Click nodes to explore</div>
      <div id="stats">Select domain to begin...</div>
    </div>
  </div>

  <script>
    // SELF-MAPPING CAUSAL TREE
    // Principle: Define concepts + dependencies, system auto-discovers causal structure
    
    const DOMAINS = {
      'Binary (Compute)': {
        color: '#FF6B6B',
        root: 'COMPUTATION',
        desc: 'Digital logic & bit operations'
      },
      'Atomics': {
        color: '#4ECDC4',
        root: 'ELECTRON_SHELL',
        desc: 'Quantum orbitals & valence'
      },
      'Chemistry': {
        color: '#FFE66D',
        root: 'MOLECULAR_BOND',
        desc: 'Electronegativity & bonding'
      },
      'Physics': {
        color: '#95E1D3',
        root: 'FORCE_FIELD',
        desc: 'Forces & energy states'
      },
      'Biology': {
        color: '#B19CD9',
        root: 'CELL_DIVISION',
        desc: 'Genetic & metabolic processes'
      },
      'Ecology': {
        color: '#90EE90',
        root: 'ECOSYSTEM',
        desc: 'Population & energy flow'
      }
    }
    
    const PrimitiveLibrary = {
      // BINARY (COMPUTE) - Logic gates & bit ops
      'NOT': { requires: [], desc: 'Bit inversion', domain: 'Binary (Compute)', type: 'Primitive' },
      'AND': { requires: [], desc: 'Logical AND', domain: 'Binary (Compute)', type: 'Primitive' },
      'OR': { requires: [], desc: 'Logical OR', domain: 'Binary (Compute)', type: 'Primitive' },
      'XOR': { requires: [], desc: 'Exclusive OR', domain: 'Binary (Compute)', type: 'Primitive' },
      'MEMORY': { requires: ['AND', 'NOT'], desc: 'Bit state retention', domain: 'Binary (Compute)', type: 'Operation' },
      'COMPUTATION': { requires: ['AND', 'OR', 'XOR', 'MEMORY'], desc: 'Complex logic', domain: 'Binary (Compute)', type: 'Complex' },
      
      // ATOMICS - Electron shells & quantum
      'ELECTRON': { requires: [], desc: 'Fermi particle', domain: 'Atomics', type: 'Primitive' },
      'PAULI_EXCLUSION': { requires: ['ELECTRON'], desc: 'Quantum spin states', domain: 'Atomics', type: 'Operation' },
      'ORBITAL': { requires: ['PAULI_EXCLUSION'], desc: 'Energy level', domain: 'Atomics', type: 'Operation' },
      'ELECTRON_SHELL': { requires: ['ORBITAL'], desc: 'Valence configuration', domain: 'Atomics', type: 'Complex' },
      
      // CHEMISTRY - Molecular bonding
      'ELECTRONEGATIVITY': { requires: ['ELECTRON_SHELL'], desc: 'Electron affinity', domain: 'Chemistry', type: 'Operation' },
      'IONIC_BOND': { requires: ['ELECTRONEGATIVITY'], desc: 'Electron transfer', domain: 'Chemistry', type: 'Operation' },
      'COVALENT_BOND': { requires: ['ELECTRONEGATIVITY', 'ORBITAL'], desc: 'Electron sharing', domain: 'Chemistry', type: 'Operation' },
      'MOLECULAR_BOND': { requires: ['IONIC_BOND', 'COVALENT_BOND'], desc: 'Chemical compound', domain: 'Chemistry', type: 'Complex' },
      
      // PHYSICS - Forces & fields
      'MASS': { requires: [], desc: 'Inertia property', domain: 'Physics', type: 'Primitive' },
      'CHARGE': { requires: [], desc: 'EM property', domain: 'Physics', type: 'Primitive' },
      'FORCE': { requires: ['MASS', 'CHARGE'], desc: 'Acceleration vector', domain: 'Physics', type: 'Operation' },
      'ENERGY': { requires: ['MASS', 'FORCE'], desc: 'Work capacity', domain: 'Physics', type: 'Operation' },
      'FORCE_FIELD': { requires: ['FORCE', 'ENERGY'], desc: 'Potential landscape', domain: 'Physics', type: 'Complex' },
      
      // BIOLOGY - Genetic & metabolic
      'DNA_BASE': { requires: ['MOLECULAR_BOND'], desc: 'Nucleotide (ACGT)', domain: 'Biology', type: 'Operation' },
      'GENE': { requires: ['DNA_BASE'], desc: 'Protein blueprint', domain: 'Biology', type: 'Operation' },
      'PROTEIN': { requires: ['GENE'], desc: 'Functional molecule', domain: 'Biology', type: 'Operation' },
      'METABOLISM': { requires: ['PROTEIN', 'ENERGY'], desc: 'Chemical cascade', domain: 'Biology', type: 'Operation' },
      'CELL_DIVISION': { requires: ['GENE', 'METABOLISM'], desc: 'Mitosis cycle', domain: 'Biology', type: 'Complex' },
      
      // ECOLOGY - Population dynamics  
      'ORGANISM': { requires: ['CELL_DIVISION'], desc: 'Living individual', domain: 'Ecology', type: 'Operation' },
      'REPRODUCTION': { requires: ['ORGANISM', 'GENE'], desc: 'Generational propagation', domain: 'Ecology', type: 'Operation' },
      'PREDATION': { requires: ['METABOLISM', 'FORCE_FIELD'], desc: 'Energy transfer', domain: 'Ecology', type: 'Operation' },
      'ECOSYSTEM': { requires: ['ORGANISM', 'REPRODUCTION', 'PREDATION'], desc: 'Population dynamics', domain: 'Ecology', type: 'Complex' }
    }
    
    class Node {
      constructor(name, data) {
        this.name = name
        this.data = data
        this.x = 0
        this.y = 0
        this.level = 0
        this.children = []
        this.parents = []
        this.radius = 6
        this._visited = false
      }
      
      contains(px, py, zoom) {
        const dist = Math.sqrt((this.x - px) ** 2 + (this.y - py) ** 2)
        return dist <= this.radius * zoom + 4
      }
    }
    
    class CombinationTree {
      constructor(sourceNode) {
        this.nodes = []
        this.nodeMap = new Map()
        this.sourceNode = sourceNode
        this.buildCombinations()
        this.layout()
      }
      
      buildCombinations() {
        // Root is the source
        const rootNode = new Node(this.sourceNode.name, this.sourceNode.data)
        rootNode.level = 0
        this.nodes.push(rootNode)
        this.nodeMap.set(this.sourceNode.name, rootNode)
        
        // Find all items that combine with source from different domains
        const candidates = Object.values(PrimitiveLibrary).filter(item => 
          item.domain !== this.sourceNode.data.domain
        )
        
        candidates.forEach(candidate => {
          // Check if they share requirements (can combine)
          const shared = this.sourceNode.data.requires.filter(req => 
            candidate.requires.includes(req)
          )
          
          // If they require each other or share requirements
          if (shared.length > 0 || candidate.requires.includes(this.sourceNode.name)) {
            const combNode = new Node(candidate.name || 'unknown', candidate)
            combNode.level = 1
            this.nodes.push(combNode)
            rootNode.children.push(combNode)
            combNode.parents.push(rootNode)
          }
        })
      }
      
      layout() {
        const rootNode = this.nodes[0]
        rootNode.x = 0
        rootNode.y = 0
        
        const childCount = rootNode.children.length
        const angleStep = childCount > 0 ? (Math.PI * 2) / childCount : 0
        const radius = 120
        
        rootNode.children.forEach((child, idx) => {
          const angle = angleStep * idx
          child.x = Math.cos(angle) * radius
          child.y = Math.sin(angle) * radius
        })
      }
    }
    
    class Node {
      constructor(name, data) {
        this.name = name
        this.data = data
        this.x = 0
        this.y = 0
        this.level = 0
        this.children = []
        this.parents = []
        this.radius = 6
        this._visited = false
      }
      
      contains(px, py, zoom) {
        const dist = Math.sqrt((this.x - px) ** 2 + (this.y - py) ** 2)
        return dist <= this.radius * zoom + 4
      }
    }
    
    class AutoDecompositionTree {
      constructor(startConcept = 'DECISION_MAKING') {
        this.nodes = []
        this.nodeMap = new Map()
        this.discover(startConcept)
        this.layout()
      }
      
      discover(conceptName, level = 0) {
        // Prevent infinite recursion
        if (this.nodeMap.has(conceptName)) {
          return this.nodeMap.get(conceptName)
        }
        
        const data = PrimitiveLibrary[conceptName]
        if (!data) return null
        
        const node = new Node(conceptName, data)
        node.level = level
        this.nodes.push(node)
        this.nodeMap.set(conceptName, node)
        
        // Recursively discover dependencies
        if (data.requires && data.requires.length > 0) {
          data.requires.forEach(dep => {
            const depNode = this.discover(dep, level + 1)
            if (depNode) {
              node.children.push(depNode)
              depNode.parents.push(node)
            }
          })
        }
        
        return node
      }
      
      layout() {
        // Group by level
        const levels = {}
        this.nodes.forEach(n => {
          if (!levels[n.level]) levels[n.level] = []
          levels[n.level].push(n)
        })
        
        // Position hierarchically
        const levelHeight = 100
        const startY = -200
        
        Object.entries(levels).forEach(([levelStr, nodes]) => {
          const level = parseInt(levelStr)
          const y = startY + level * levelHeight
          const width = Math.max(300, nodes.length * 70)
          const startX = -width / 2
          
          nodes.forEach((node, idx) => {
            node.x = startX + (idx / Math.max(1, nodes.length - 1)) * width
            node.y = y
          })
        })
      }
    }
    
    class App {
      constructor() {
        this.canvas = document.getElementById('canvas')
        this.ctx = this.canvas.getContext('2d')
        this.tree = null
        this.currentDomain = null
        this.viewMode = 'decomposition' // 'decomposition' or 'combinations'
        this.selectedNode = null // for combo tree
        
        this.cameraX = 0
        this.cameraY = 0
        this.zoom = 1
        this.selected = null
        this.panning = false
        this.panStart = { x: 0, y: 0 }
        
        this.canvas.width = this.canvas.offsetWidth
        this.canvas.height = this.canvas.offsetHeight
        
        this.canvas.addEventListener('click', (e) => this.handleClick(e))
        this.canvas.addEventListener('mousemove', (e) => this.handleMove(e))
        this.canvas.addEventListener('wheel', (e) => this.handleZoom(e))
        this.canvas.addEventListener('mousedown', (e) => this.handlePanStart(e))
        this.canvas.addEventListener('mouseup', (e) => this.handlePanEnd(e))
        document.addEventListener('mousemove', (e) => this.handlePanMove(e))
        
        window.addEventListener('resize', () => {
          this.canvas.width = this.canvas.offsetWidth
          this.canvas.height = this.canvas.offsetHeight
        })
        
        this.initDomainButtons()
        this.initViewModeButtons()
      }
      
      initViewModeButtons() {
        document.getElementById('decomp-view').onclick = () => this.setViewMode('decomposition')
        document.getElementById('combo-view').onclick = () => this.setViewMode('combinations')
      }
      
      setViewMode(mode) {
        this.viewMode = mode
        const decompBtn = document.getElementById('decomp-view')
        const comboBtn = document.getElementById('combo-view')
        
        if (mode === 'decomposition') {
          decompBtn.style.background = 'rgba(0, 217, 255, 0.2)'
          decompBtn.style.opacity = '1'
          comboBtn.style.background = 'rgba(255, 105, 180, 0.1)'
          comboBtn.style.opacity = '0.5'
          comboBtn.disabled = true
          this.selected = null
          this.selectedNode = null
          this.tree = new AutoDecompositionTree(DOMAINS[this.currentDomain].root)
          this.reset()
        } else if (this.selectedNode) {
          // Already have a selected node for combo view
          comboBtn.style.background = 'rgba(255, 105, 180, 0.3)'
          comboBtn.style.opacity = '1'
          decompBtn.style.background = 'rgba(0, 217, 255, 0.1)'
          decompBtn.style.opacity = '0.5'
          decompBtn.disabled = true
        }
      }
      
      initDomainButtons() {
        const domainDiv = document.getElementById('domains')
        Object.entries(DOMAINS).forEach(([name, data]) => {
          const btn = document.createElement('button')
          btn.textContent = `◆ ${name}`
          btn.style.cssText = `
            background: rgba(${this.hexToRgb(data.color)}, 0.1);
            border: 1px solid ${data.color};
            color: ${data.color};
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s;
          `
          btn.onmouseover = () => {
            btn.style.background = `rgba(${this.hexToRgb(data.color)}, 0.25)`
          }
          btn.onmouseout = () => {
            btn.style.background = `rgba(${this.hexToRgb(data.color)}, 0.1)`
          }
          btn.onclick = () => this.loadDomain(name)
          domainDiv.appendChild(btn)
        })
      }
      
      hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex)
        return result ? `${parseInt(result[1], 16)},${parseInt(result[2], 16)},${parseInt(result[3], 16)}` : '0,217,255'
      }
      
      loadDomain(domainName) {
        this.currentDomain = domainName
        const domainData = DOMAINS[domainName]
        
        // Load from root concept for this domain
        const rootConcept = domainData.root
        this.tree = new AutoDecompositionTree(rootConcept)
        this.reset()
        document.getElementById('stats').textContent = `Domain: ${domainName} | Nodes: ${this.tree.nodes.length}`
      }
      
      screenToWorld(ex, ey) {
        const rect = this.canvas.getBoundingClientRect()
        const sx = (ex - rect.left - this.canvas.width / 2) / this.zoom - this.cameraX
        const sy = (ey - rect.top - this.canvas.height / 2) / this.zoom - this.cameraY
        return [sx, sy]
      }
      
      handleClick(e) {
        if (this.panning || !this.tree) return
        const [wx, wy] = this.screenToWorld(e.clientX, e.clientY)
        
        for (const node of this.tree.nodes) {
          if (node.contains(wx, wy, this.zoom)) {
            if (this.viewMode === 'combinations') {
              this.buildCombinationTree(node)
            } else {
              this.select(node)
            }
            return
          }
        }
        
        this.deselect()
      }
      
      handleMove(e) {
        if (!this.tree) return
        const [wx, wy] = this.screenToWorld(e.clientX, e.clientY)
        let hover = false
        for (const node of this.tree.nodes) {
          if (node.contains(wx, wy, this.zoom)) {
            hover = true
            break
          }
        }
        this.canvas.style.cursor = hover ? 'pointer' : (this.panning ? 'grabbing' : 'grab')
      }
      
      handleZoom(e) {
        e.preventDefault()
        this.zoom *= e.deltaY > 0 ? 0.9 : 1.1
        this.zoom = Math.max(0.3, Math.min(3, this.zoom))
      }
      
      handlePanStart(e) {
        this.panning = true
        this.panStart = { x: e.clientX, y: e.clientY }
      }
      
      handlePanEnd(e) {
        this.panning = false
      }
      
      handlePanMove(e) {
        if (!this.panning) return
        this.cameraX -= (e.clientX - this.panStart.x) / this.zoom
        this.cameraY -= (e.clientY - this.panStart.y) / this.zoom
        this.panStart = { x: e.clientX, y: e.clientY }
      }
      
      select(node) {
        this.selected = node
        this.showDetail(node)
        this.updateBreadcrumb(node)
      }
      
      buildCombinationTree(sourceNode) {
        this.selectedNode = sourceNode
        this.tree = new CombinationTree(sourceNode)
        this.reset()
        document.getElementById('stats').textContent = `Combinations: ${sourceNode.name} | Nodes: ${this.tree.nodes.length}`
      }
      
      deselect() {
        this.selected = null
        document.getElementById('detail').classList.remove('visible')
        document.getElementById('path').textContent = ''
      }
      
      showDetail(node) {
        const det = document.getElementById('detail')
        document.getElementById('title').textContent = node.name
        
        let html = `
          <div class="card">
            <div class="label">Type</div>
            <div class="value">${node.data.type}</div>
          </div>
          
          <div class="card">
            <div class="label">Domain</div>
            <div class="value">${node.data.domain}</div>
          </div>
          
          <div class="card">
            <div class="label">Description</div>
            <div class="value">${node.data.desc}</div>
          </div>
          
          <div class="card">
            <div class="label">Decomposition Level</div>
            <div class="value">${node.level}</div>
          </div>
          
          <div class="card">
            <div class="label">Requires (Breakdown)</div>
            <div class="value">${node.data.requires.length > 0 ? node.data.requires.join(', ') : 'None (primitive)'}</div>
          </div>
        `
        
        if (node.children.length > 0) {
          html += `
            <div class="card">
              <div class="label">📍 Decomposition To</div>
              <div class="value">${node.children.map(c => `${c.name}`).join(', ')}</div>
            </div>
          `
        }
        
        if (node.parents.length > 0) {
          html += `
            <div class="card">
              <div class="label">⬆️ Combines Into</div>
              <div class="value">${node.parents.map(p => `${p.name} (${p.data.domain})`).join(', ')}</div>
            </div>
          `
        }
        
        // Find all cross-domain combinations
        const crossDomainCombos = this.findCrossDomainCombinations(node)
        if (crossDomainCombos.length > 0) {
          html += `
            <div class="card">
              <div class="label">🧬 Cross-Domain Combinations</div>
              <div class="value">${crossDomainCombos.map(combo => `${combo}`).join('; ')}</div>
            </div>
          `
        }
        
        document.getElementById('content').innerHTML = html
        det.classList.add('visible')
      }
      
      findCrossDomainCombinations(node) {
        const combos = []
        
        // For each parent (what uses this), check if it's cross-domain
        node.parents.forEach(parent => {
          if (parent.data.domain !== node.data.domain) {
            combos.push(`${node.name} + [${parent.data.domain}] → ${parent.name}`)
          }
        })
        
        // For each child (what this requires), check cross-domain
        node.children.forEach(child => {
          if (child.data.domain !== node.data.domain) {
            combos.push(`[${child.data.domain}] ${child.name} + ${node.name}`)
          }
        })
        
        // Find siblings that could combine
        const sameLevelNodes = this.tree.nodes.filter(n => 
          n.level === node.level && 
          n.data.domain !== node.data.domain
        )
        
        sameLevelNodes.forEach(sibling => {
          // Check if they share requirements (could combine)
          const sharedReqs = node.data.requires.filter(req => 
            sibling.data.requires.includes(req)
          )
          if (sharedReqs.length > 0) {
            combos.push(`${node.name} ↔ ${sibling.name} (via ${sharedReqs.join(', ')})`)
          }
        })
        
        return [...new Set(combos)] // Remove duplicates
      }
      
      updateBreadcrumb(node) {
        let path = node.name
        const stack = [node]
        
        while (stack[stack.length - 1].parents.length > 0) {
          const parent = stack[stack.length - 1].parents[0]
          stack.push(parent)
          path = `${parent.name} → ${path}`
        }
        
        document.getElementById('path').textContent = path.length > 70 ? '...' + path.slice(-67) : path
      }
      
      render() {
        this.ctx.fillStyle = '#0a0a0a'
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height)
        
        if (!this.tree) {
          this.ctx.fillStyle = '#00d9ff'
          this.ctx.font = '14px monospace'
          this.ctx.textAlign = 'center'
          this.ctx.fillText('Select domain from left panel →', this.canvas.width / 2, this.canvas.height / 2)
          return
        }
        
        this.ctx.save()
        this.ctx.translate(this.canvas.width / 2, this.canvas.height / 2)
        this.ctx.scale(this.zoom, this.zoom)
        this.ctx.translate(-this.cameraX, -this.cameraY)
        
        const typeColors = {
          'Primitive': '#00FF00',
          'Operation': '#FFFF00',
          'Function': '#00D9FF',
          'Complex': '#FF00FF'
        }
        
        if (this.viewMode === 'combinations') {
          // Draw combo tree (radial from center)
          const rootNode = this.tree.nodes[0]
          
          // Draw edges from center to combinations
          for (const child of rootNode.children) {
            this.ctx.strokeStyle = 'rgba(255, 105, 180, 0.4)'
            this.ctx.lineWidth = 2
            this.ctx.setLineDash([5, 5])
            this.ctx.beginPath()
            this.ctx.moveTo(rootNode.x, rootNode.y)
            this.ctx.lineTo(child.x, child.y)
            this.ctx.stroke()
            this.ctx.setLineDash([])
          }
          
          // Draw all nodes
          for (const node of this.tree.nodes) {
            const color = typeColors[node.data.type] || '#00D9FF'
            const isBright = node === rootNode
            
            // Node
            this.ctx.fillStyle = color
            this.ctx.beginPath()
            this.ctx.arc(node.x, node.y, node.radius * (isBright ? 1.5 : 1), 0, Math.PI * 2)
            this.ctx.fill()
            
            // Border
            this.ctx.strokeStyle = color
            this.ctx.lineWidth = isBright ? 3 : 1
            this.ctx.stroke()
          }
        } else {
          // Draw decomposition tree (hierarchical)
          // Draw intra-domain edges
          for (const node of this.tree.nodes) {
            for (const child of node.children) {
              if (node.data.domain === child.data.domain) {
                this.ctx.strokeStyle = 'rgba(0, 217, 255, 0.3)'
                this.ctx.lineWidth = 1.5
                this.ctx.beginPath()
                this.ctx.moveTo(node.x, node.y)
                this.ctx.lineTo(child.x, child.y)
                this.ctx.stroke()
              }
            }
          }
          
          // Draw cross-domain edges
          for (const node of this.tree.nodes) {
            for (const child of node.children) {
              if (node.data.domain !== child.data.domain) {
                this.ctx.strokeStyle = 'rgba(255, 105, 180, 0.4)'
                this.ctx.lineWidth = 2
                this.ctx.setLineDash([5, 5])
                this.ctx.beginPath()
                this.ctx.moveTo(node.x, node.y)
                this.ctx.lineTo(child.x, child.y)
                this.ctx.stroke()
                this.ctx.setLineDash([])
              }
            }
          }
          
          // Draw nodes
          for (const node of this.tree.nodes) {
            const color = typeColors[node.data.type] || '#00D9FF'
            const isSelected = node === this.selected
            
            // Glow
            if (isSelected) {
              this.ctx.fillStyle = color + '30'
              this.ctx.beginPath()
              this.ctx.arc(node.x, node.y, node.radius * 2.5, 0, Math.PI * 2)
              this.ctx.fill()
            }
            
            // Node
            this.ctx.fillStyle = color
            this.ctx.beginPath()
            this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2)
            this.ctx.fill()
            
            // Border
            this.ctx.strokeStyle = color
            this.ctx.lineWidth = isSelected ? 2 : 1
            this.ctx.stroke()
          }
        }
        
        this.ctx.restore()
        
        if (this.tree) {
          if (this.viewMode === 'combinations' && this.selectedNode) {
            document.getElementById('stats').textContent = `${this.selectedNode.name} combines with: ${this.tree.nodes.length - 1} items | Zoom: ${this.zoom.toFixed(1)}x`
          } else {
            document.getElementById('stats').textContent = `${this.currentDomain} | Nodes: ${this.tree.nodes.length} | Zoom: ${this.zoom.toFixed(1)}x`
          }
        }
      }
      
      animate() {
        this.render()
        requestAnimationFrame(() => this.animate())
      }
      
      start() {
        this.animate()
      }
      
      reset() {
        this.cameraX = 0
        this.cameraY = 0
        this.zoom = 1
        this.deselect()
      }
      
      fitAll() {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity
        this.tree.nodes.forEach(n => {
          minX = Math.min(minX, n.x)
          maxX = Math.max(maxX, n.x)
          minY = Math.min(minY, n.y)
          maxY = Math.max(maxY, n.y)
        })
        
        const w = maxX - minX + 100
        const h = maxY - minY + 100
        this.zoom = Math.min(this.canvas.width / w, this.canvas.height / h, 1.5)
        this.cameraX = (minX + maxX) / 2
        this.cameraY = (minY + maxY) / 2
      }
    }
    
    window.app = new App()
    window.app.start()
  </script>
</body>
</html>
