<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Causal Decomposition Tree - Complexity → Primitives</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a0a0a; color: #00d9ff; font-family: 'Courier New', monospace; overflow: hidden; }
    
    #app { width: 100%; height: 100%; display: flex; flex-direction: column; }
    
    #header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid #00d9ff;
    }
    
    #header h1 { font-size: 1.5rem; text-shadow: 0 0 20px rgba(0, 217, 255, 0.5); }
    #header p { font-size: 0.85rem; color: #00ff00; opacity: 0.8; margin-top: 0.3rem; }
    
    .controls { display: flex; gap: 0.5rem; float: right; margin-top: -2.5rem; }
    .btn { background: rgba(0, 217, 255, 0.1); border: 1px solid #00d9ff; color: #00d9ff; width: 40px; height: 40px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    .btn:hover { background: rgba(0, 217, 255, 0.2); }
    
    #canvas { flex: 1; background: radial-gradient(circle at 50% 50%, #0f0f1e 0%, #0a0a0a 100%); cursor: grab; }
    #canvas:active { cursor: grabbing; }
    
    #breadcrumb { background: rgba(0, 217, 255, 0.05); padding: 0.75rem 1.5rem; border-bottom: 1px solid rgba(0, 217, 255, 0.1); font-size: 0.85rem; min-height: 40px; display: flex; align-items: center; gap: 0.5rem; }
    
    #detail {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 400px;
      background: rgba(26, 26, 26, 0.98);
      border-top: 2px solid #00d9ff;
      border-left: 1px solid #00d9ff;
      padding: 1.5rem;
      max-height: 50vh;
      overflow-y: auto;
      display: none;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }
    
    #detail.visible { display: block; }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    
    #detail h3 { color: #00ff00; font-size: 1.1rem; margin-bottom: 1rem; border-bottom: 1px solid #00d9ff; padding-bottom: 0.5rem; }
    
    .card { background: rgba(0, 217, 255, 0.05); border: 1px solid rgba(0, 217, 255, 0.2); padding: 0.75rem; margin-bottom: 0.75rem; border-radius: 4px; }
    .label { color: #00d9ff; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; opacity: 0.7; margin-bottom: 0.3rem; }
    .value { color: #00ff00; font-size: 0.9rem; line-height: 1.4; }
    
    #footer { background: #1a1a1a; border-top: 1px solid #00d9ff; padding: 0.75rem 1.5rem; font-size: 0.8rem; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <div class="controls">
        <button class="btn" onclick="app.reset()">↺</button>
        <button class="btn" onclick="app.fitAll()">⊡</button>
      </div>
      <h1>🌳 Causal Decomposition</h1>
      <p>Any complex system strips down to primitives via causal chains that naturally branch</p>
    </div>
    
    <div id="breadcrumb">
      <button style="background: none; border: none; color: #00d9ff; cursor: pointer;" onclick="app.deselect()">Root</button>
      <span id="path"></span>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div id="detail">
      <button style="position: absolute; top: 1rem; right: 1rem; background: none; border: none; color: #00d9ff; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('detail').classList.remove('visible')">✕</button>
      <h3 id="title"></h3>
      <div id="content"></div>
    </div>
    
    <div id="footer">
      <div>Click any node to explore • Tree shows causal dependencies</div>
      <div id="stats">Loading...</div>
    </div>
  </div>

  <script>
    // CAUSAL DECOMPOSITION TREE
    // Principle: Complex systems decompose into causal chains that branch via primitives
    
    class Node {
      constructor(name, level, type, desc, complexity) {
        this.name = name
        this.level = level // 0 = root (complex), higher = more primitive
        this.type = type // category
        this.desc = desc
        this.complexity = complexity // how many primitives it requires
        this.x = 0
        this.y = 0
        this.children = []
        this.parents = []
        this.radius = Math.max(4, 10 - (level * 0.8))
      }
      
      contains(px, py, zoom) {
        const dist = Math.sqrt((this.x - px) ** 2 + (this.y - py) ** 2)
        return dist <= this.radius * zoom + 4
      }
    }
    
    class DecompositionTree {
      constructor() {
        this.nodes = []
        this.root = null
        this.build()
      }
      
      build() {
        // Example: "Decision Making" complex system decomposes to primitives
        // Each level removes one abstraction layer, revealing lower-level causal dependencies
        
        // ROOT: The complex behavior
        this.root = new Node('Decision Making', 0, 'Complex', 'Choose action from possibilities', 5)
        this.nodes.push(this.root)
        
        // LEVEL 1: What does decision making REQUIRE?
        // It requires: sensing, evaluation, selection
        const sense = new Node('Sensory Input', 1, 'Function', 'Perceive environment', 4)
        const eval = new Node('Evaluate Options', 1, 'Function', 'Compare possibilities', 3)
        const select = new Node('Selection', 1, 'Function', 'Pick best option', 2)
        
        this.root.children.push(sense, eval, select)
        sense.parents.push(this.root)
        eval.parents.push(this.root)
        select.parents.push(this.root)
        this.nodes.push(sense, eval, select)
        
        // LEVEL 2: What do THOSE require?
        const measure = new Node('Measurement', 2, 'Operation', 'Quantify observations', 2)
        const compare = new Node('Comparison', 2, 'Operation', 'Relative analysis', 2)
        const weight = new Node('Weighting', 2, 'Operation', 'Apply probability', 1)
        const threshold = new Node('Threshold', 2, 'Operation', 'Decision boundary', 1)
        
        sense.children.push(measure)
        measure.parents.push(sense)
        eval.children.push(compare, weight)
        compare.parents.push(eval)
        weight.parents.push(eval)
        select.children.push(threshold)
        threshold.parents.push(select)
        this.nodes.push(measure, compare, weight, threshold)
        
        // LEVEL 3: Lower abstractions - Getting into primitives
        const distance = new Node('Distance', 3, 'Primitive', 'Euclidean metric', 1)
        const threshold2 = new Node('LT (Less Than)', 3, 'Primitive', 'Boolean comparison', 1)
        const randomness = new Node('Random', 3, 'Primitive', 'Sampling', 1)
        const and = new Node('AND', 3, 'Primitive', 'Logical conjunction', 1)
        const or = new Node('OR', 3, 'Primitive', 'Logical disjunction', 1)
        
        measure.children.push(distance)
        distance.parents.push(measure)
        compare.children.push(threshold2)
        threshold2.parents.push(compare)
        weight.children.push(randomness)
        randomness.parents.push(weight)
        threshold.children.push(and, or)
        and.parents.push(threshold)
        or.parents.push(threshold)
        this.nodes.push(distance, threshold2, randomness, and, or)
        
        // LEVEL 4: Pure primitives - Cannot decompose further
        const vector = new Node('Vector', 4, 'Primitive', 'Direction + magnitude', 1)
        const not = new Node('NOT', 4, 'Primitive', 'Logical negation', 1)
        const xor = new Node('XOR', 4, 'Primitive', 'Exclusive or', 1)
        const gaussian = new Node('Gaussian', 4, 'Primitive', 'Normal distribution', 1)
        
        distance.children.push(vector)
        vector.parents.push(distance)
        threshold2.children.push(not)
        not.parents.push(threshold2)
        randomness.children.push(gaussian)
        gaussian.parents.push(randomness)
        and.children.push(xor)
        xor.parents.push(and)
        this.nodes.push(vector, not, gaussian, xor)
        
        this.layout()
      }
      
      layout() {
        const levels = [0, 1, 2, 3, 4]
        const levelNodes = {}
        
        levels.forEach(l => {
          levelNodes[l] = this.nodes.filter(n => n.level === l)
        })
        
        // Position by level vertically, then spread horizontally
        const levelHeight = 120
        const startY = -240
        
        for (const [level, nodes] of Object.entries(levelNodes)) {
          const y = startY + parseInt(level) * levelHeight
          const width = Math.max(400, nodes.length * 80)
          const startX = -width / 2
          
          nodes.forEach((node, idx) => {
            node.x = startX + (idx / Math.max(1, nodes.length - 1)) * width
            node.y = y
          })
        }
      }
    }
    
    class App {
      constructor() {
        this.canvas = document.getElementById('canvas')
        this.ctx = this.canvas.getContext('2d')
        this.tree = new DecompositionTree()
        
        this.cameraX = 0
        this.cameraY = 0
        this.zoom = 1
        this.selected = null
        this.panning = false
        this.panStart = { x: 0, y: 0 }
        
        this.canvas.width = this.canvas.offsetWidth
        this.canvas.height = this.canvas.offsetHeight
        
        // Events
        this.canvas.addEventListener('click', (e) => this.handleClick(e))
        this.canvas.addEventListener('mousemove', (e) => this.handleMove(e))
        this.canvas.addEventListener('wheel', (e) => this.handleZoom(e))
        this.canvas.addEventListener('mousedown', (e) => this.handlePanStart(e))
        this.canvas.addEventListener('mouseup', (e) => this.handlePanEnd(e))
        document.addEventListener('mousemove', (e) => this.handlePanMove(e))
        
        window.addEventListener('resize', () => {
          this.canvas.width = this.canvas.offsetWidth
          this.canvas.height = this.canvas.offsetHeight
        })
      }
      
      screenToWorld(ex, ey) {
        const rect = this.canvas.getBoundingClientRect()
        const sx = (ex - rect.left - this.canvas.width / 2) / this.zoom - this.cameraX
        const sy = (ey - rect.top - this.canvas.height / 2) / this.zoom - this.cameraY
        return [sx, sy]
      }
      
      handleClick(e) {
        if (this.panning) return
        const [wx, wy] = this.screenToWorld(e.clientX, e.clientY)
        
        for (const node of this.tree.nodes) {
          if (node.contains(wx, wy, this.zoom)) {
            this.select(node)
            return
          }
        }
        
        this.deselect()
      }
      
      handleMove(e) {
        const [wx, wy] = this.screenToWorld(e.clientX, e.clientY)
        let hover = false
        for (const node of this.tree.nodes) {
          if (node.contains(wx, wy, this.zoom)) {
            hover = true
            break
          }
        }
        this.canvas.style.cursor = hover ? 'pointer' : (this.panning ? 'grabbing' : 'grab')
      }
      
      handleZoom(e) {
        e.preventDefault()
        this.zoom *= e.deltaY > 0 ? 0.9 : 1.1
        this.zoom = Math.max(0.3, Math.min(3, this.zoom))
      }
      
      handlePanStart(e) {
        this.panning = true
        this.panStart = { x: e.clientX, y: e.clientY }
      }
      
      handlePanEnd(e) {
        this.panning = false
      }
      
      handlePanMove(e) {
        if (!this.panning) return
        this.cameraX -= (e.clientX - this.panStart.x) / this.zoom
        this.cameraY -= (e.clientY - this.panStart.y) / this.zoom
        this.panStart = { x: e.clientX, y: e.clientY }
      }
      
      select(node) {
        this.selected = node
        this.showDetail(node)
        this.updateBreadcrumb(node)
      }
      
      deselect() {
        this.selected = null
        document.getElementById('detail').classList.remove('visible')
        document.getElementById('path').textContent = ''
      }
      
      showDetail(node) {
        const det = document.getElementById('detail')
        document.getElementById('title').textContent = `${node.name}`
        
        let html = `
          <div class="card">
            <div class="label">Type</div>
            <div class="value">${node.type}</div>
          </div>
          
          <div class="card">
            <div class="label">Description</div>
            <div class="value">${node.desc}</div>
          </div>
          
          <div class="card">
            <div class="label">Decomposition Level</div>
            <div class="value">${node.level} (0=Complex, 4=Primitive)</div>
          </div>
          
          <div class="card">
            <div class="label">Causal Dependencies</div>
            <div class="value">${node.children.length} children</div>
          </div>
        `
        
        if (node.children.length > 0) {
          html += `
            <div class="card">
              <div class="label">📍 Requires (Dependencies)</div>
              <div class="value">${node.children.map(c => c.name).join(', ')}</div>
            </div>
          `
        }
        
        if (node.parents.length > 0) {
          html += `
            <div class="card">
              <div class="label">⬆️ Required By</div>
              <div class="value">${node.parents.map(p => p.name).join(', ')}</div>
            </div>
          `
        }
        
        document.getElementById('content').innerHTML = html
        det.classList.add('visible')
      }
      
      updateBreadcrumb(node) {
        let path = node.name
        const stack = [node]
        
        while (stack[stack.length - 1].parents.length > 0) {
          const parent = stack[stack.length - 1].parents[0]
          stack.push(parent)
          path = `${parent.name} → ${path}`
        }
        
        document.getElementById('path').textContent = path.length > 70 ? '...' + path.slice(-67) : path
      }
      
      render() {
        this.ctx.fillStyle = '#0a0a0a'
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height)
        
        this.ctx.save()
        this.ctx.translate(this.canvas.width / 2, this.canvas.height / 2)
        this.ctx.scale(this.zoom, this.zoom)
        this.ctx.translate(-this.cameraX, -this.cameraY)
        
        // Draw edges
        const typeColors = {
          'Complex': '#FF00FF',
          'Function': '#00D9FF',
          'Operation': '#FFFF00',
          'Primitive': '#00FF00'
        }
        
        for (const node of this.tree.nodes) {
          for (const child of node.children) {
            this.ctx.strokeStyle = 'rgba(0, 217, 255, 0.2)'
            this.ctx.lineWidth = 1
            this.ctx.beginPath()
            this.ctx.moveTo(node.x, node.y)
            this.ctx.lineTo(child.x, child.y)
            this.ctx.stroke()
          }
        }
        
        // Draw nodes
        for (const node of this.tree.nodes) {
          const color = typeColors[node.type] || '#00D9FF'
          const isSelected = node === this.selected
          
          // Glow
          if (isSelected) {
            this.ctx.fillStyle = color + '30'
            this.ctx.beginPath()
            this.ctx.arc(node.x, node.y, node.radius * 2.5, 0, Math.PI * 2)
            this.ctx.fill()
          }
          
          // Node
          this.ctx.fillStyle = color
          this.ctx.beginPath()
          this.ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2)
          this.ctx.fill()
          
          // Border
          this.ctx.strokeStyle = color
          this.ctx.lineWidth = isSelected ? 2 : 1
          this.ctx.stroke()
        }
        
        this.ctx.restore()
        
        document.getElementById('stats').textContent = `Nodes: ${this.tree.nodes.length} | Zoom: ${this.zoom.toFixed(1)}x`
      }
      
      animate() {
        this.render()
        requestAnimationFrame(() => this.animate())
      }
      
      start() {
        this.animate()
      }
      
      reset() {
        this.cameraX = 0
        this.cameraY = 0
        this.zoom = 1
        this.deselect()
      }
      
      fitAll() {
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity
        this.tree.nodes.forEach(n => {
          minX = Math.min(minX, n.x)
          maxX = Math.max(maxX, n.x)
          minY = Math.min(minY, n.y)
          maxY = Math.max(maxY, n.y)
        })
        
        const w = maxX - minX + 100
        const h = maxY - minY + 100
        this.zoom = Math.min(this.canvas.width / w, this.canvas.height / h, 1.5)
        this.cameraX = (minX + maxX) / 2
        this.cameraY = (minY + maxY) / 2
      }
    }
    
    window.app = new App()
    window.app.start()
  </script>
</body>
</html>
