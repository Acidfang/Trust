<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DETERMINED Discovery - Unified Interface</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      color: #00d9ff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #app {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    /* HEADER */
    #header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 1rem 1.5rem;
      border-bottom: 2px solid #00d9ff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #header h1 {
      font-size: 1.3rem;
      text-shadow: 0 0 20px rgba(0, 217, 255, 0.5);
    }

    .header-controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .domain-selector {
      display: flex;
      gap: 0.5rem;
    }

    .domain-btn {
      padding: 0.5rem 1rem;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      transition: all 0.2s ease;
    }

    .domain-btn:hover {
      background: rgba(0, 217, 255, 0.1);
      border-color: #00d9ff;
    }

    .domain-btn.active {
      background: rgba(0, 217, 255, 0.2);
      border-color: #00ff00;
      color: #00ff00;
      box-shadow: 0 0 8px rgba(0, 217, 255, 0.4);
    }

    /* TAB NAVIGATION */
    #tab-nav {
      background: #1a1a1a;
      border-bottom: 1px solid #00d9ff;
      display: flex;
      padding: 0.5rem 1.5rem;
      gap: 0.5rem;
    }

    .tab-btn {
      padding: 0.75rem 1.5rem;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      cursor: pointer;
      border-radius: 4px 4px 0 0;
      font-size: 0.9rem;
      font-family: 'Courier New', monospace;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      background: rgba(0, 217, 255, 0.1);
    }

    .tab-btn.active {
      background: rgba(0, 217, 255, 0.15);
      border-color: #00ff00;
      color: #00ff00;
      border-bottom: 2px solid #00ff00;
    }

    /* CONTENT AREA */
    #content {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .tab-content.active {
      display: flex;
    }

    /* LEFT SIDEBAR (for explorer tab) */
    #sidebar {
      width: 280px;
      background: #1a1a1a;
      border-right: 1px solid #00d9ff;
      overflow-y: auto;
      padding: 1rem;
      display: none;
    }

    #sidebar.visible {
      display: block;
    }

    #sidebar h2 {
      font-size: 1.1rem;
      color: #00ff00;
      margin-bottom: 1rem;
      border-bottom: 1px solid #00d9ff;
      padding-bottom: 0.5rem;
    }

    #primitive-search {
      width: 100%;
      padding: 0.75rem;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      margin-bottom: 1rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
    }

    #primitive-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-height: calc(100vh - 350px);
      overflow-y: auto;
    }

    .primitive-item {
      padding: 0.75rem;
      background: rgba(0, 217, 255, 0.05);
      border: 1px solid rgba(0, 217, 255, 0.2);
      color: #00d9ff;
      cursor: pointer;
      border-radius: 4px;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }

    .primitive-item:hover {
      background: rgba(0, 217, 255, 0.1);
      border-color: #00d9ff;
    }

    .primitive-item.selected {
      background: rgba(0, 255, 0, 0.1);
      border-color: #00ff00;
      color: #00ff00;
    }

    /* CANVAS AREA */
    .canvas-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at 50% 50%, #0f0f1e 0%, #0a0a0a 100%);
      overflow: hidden;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* BREADCRUMB */
    #breadcrumb {
      background: rgba(0, 217, 255, 0.05);
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid rgba(0, 217, 255, 0.1);
      font-size: 0.85rem;
      color: #00d9ff;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .breadcrumb-item {
      background: transparent;
      border: none;
      color: #00d9ff;
      cursor: pointer;
      text-decoration: underline;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }

    .breadcrumb-item:hover {
      color: #00ff00;
    }

    /* INFO PANELS */
    #info-panel {
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 380px;
      background: rgba(26, 26, 26, 0.98);
      border: 2px solid #00d9ff;
      padding: 1.5rem;
      max-height: 50vh;
      overflow-y: auto;
      border-radius: 4px;
      display: none;
      z-index: 1000;
      animation: slideIn 0.3s ease;
    }

    #info-panel.visible {
      display: block;
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    #info-panel h3 {
      color: #00ff00;
      font-size: 1.1rem;
      margin-bottom: 1rem;
      border-bottom: 1px solid #00d9ff;
      padding-bottom: 0.5rem;
    }

    .info-field {
      margin-bottom: 0.75rem;
      font-size: 0.85rem;
    }

    .info-label {
      color: #00d9ff;
      font-weight: bold;
      display: inline;
    }

    .info-value {
      color: #00ff00;
      display: inline;
    }

    /* REASONING TRACE PANEL */
    #reasoning-panel {
      position: fixed;
      bottom: 10px;
      left: 10px;
      width: 380px;
      background: rgba(26, 26, 26, 0.98);
      border: 2px solid #00d9ff;
      padding: 1.5rem;
      max-height: 50vh;
      overflow-y: auto;
      border-radius: 4px;
      display: none;
      z-index: 1000;
      animation: slideInLeft 0.3s ease;
    }

    #reasoning-panel.visible {
      display: block;
    }

    @keyframes slideInLeft {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    #reasoning-panel h3 {
      color: #00ff00;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #00d9ff;
      padding-bottom: 0.5rem;
    }

    .reasoning-item {
      margin-bottom: 0.5rem;
      font-size: 0.8rem;
      color: #00d9ff;
      padding: 0.5rem;
      background: rgba(0, 217, 255, 0.05);
      border-left: 2px solid #00d9ff;
    }

    .reasoning-item.high {
      background: rgba(0, 255, 0, 0.05);
      border-left-color: #00ff00;
      color: #00ff00;
    }

    /* FOOTER */
    #footer {
      background: #1a1a1a;
      border-top: 1px solid #00d9ff;
      padding: 0.75rem 1.5rem;
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .coherence-meter {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .coherence-bar {
      width: 150px;
      height: 8px;
      background: rgba(0, 217, 255, 0.1);
      border: 1px solid #00d9ff;
      border-radius: 4px;
      overflow: hidden;
    }

    .coherence-fill {
      height: 100%;
      background: linear-gradient(90deg, #00d9ff, #00ff00);
      width: 0%;
      transition: width 0.5s ease;
    }

    /* SCROLLBAR STYLING */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(0, 217, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 217, 255, 0.3);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 217, 255, 0.5);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- HEADER -->
    <div id="header">
      <div>
        <h1>⊙ DETERMINED Discovery - Unified Interface</h1>
      </div>
      <div class="header-controls">
        <div class="domain-selector">
          <button class="domain-btn active" data-domain="Binary">Binary</button>
          <button class="domain-btn" data-domain="Topological">Topological</button>
          <button class="domain-btn" data-domain="Probability">Probability</button>
          <button class="domain-btn" data-domain="Interaction">Interaction</button>
          <button class="domain-btn" data-domain="Compositions">Compositions</button>
        </div>
      </div>
    </div>

    <!-- TAB NAVIGATION -->
    <div id="tab-nav">
      <button class="tab-btn active" data-tab="explorer">🔍 Explorer</button>
      <button class="tab-btn" data-tab="causal">⛓️ Causal Chains</button>
      <button class="tab-btn" data-tab="tree">🌳 UFM Tree</button>
      <button class="tab-btn" data-tab="decomposition">📊 Decomposition</button>
      <button class="tab-btn" data-tab="mapping">🗺️ Self-Mapping</button>
    </div>

    <!-- CONTENT AREA -->
    <div id="content">
      <!-- EXPLORER TAB -->
      <div id="tab-explorer" class="tab-content active">
        <div id="sidebar" class="visible">
          <h2>Primitives</h2>
          <input type="text" id="primitive-search" placeholder="Search..." />
          <div id="primitive-list"></div>
        </div>
        <div class="canvas-container">
          <canvas id="canvas-explorer"></canvas>
        </div>
      </div>

      <!-- CAUSAL CHAINS TAB -->
      <div id="tab-causal" class="tab-content">
        <div class="canvas-container" style="flex: 1;">
          <canvas id="canvas-causal"></canvas>
        </div>
        <div id="breadcrumb"></div>
      </div>

      <!-- UFM TREE TAB -->
      <div id="tab-tree" class="tab-content">
        <div class="canvas-container" style="flex: 1;">
          <canvas id="canvas-tree"></canvas>
        </div>
        <div id="breadcrumb"></div>
      </div>

      <!-- DECOMPOSITION TAB -->
      <div id="tab-decomposition" class="tab-content">
        <div class="canvas-container" style="flex: 1;">
          <canvas id="canvas-decomposition"></canvas>
        </div>
        <div id="breadcrumb"></div>
      </div>

      <!-- SELF-MAPPING TAB -->
      <div id="tab-mapping" class="tab-content">
        <div class="canvas-container" style="flex: 1;">
          <canvas id="canvas-mapping"></canvas>
        </div>
        <div id="breadcrumb"></div>
      </div>
    </div>

    <!-- INFO PANEL -->
    <div id="info-panel"></div>

    <!-- REASONING PANEL -->
    <div id="reasoning-panel">
      <h3>🧠 Reasoning Trace</h3>
      <div id="reasoning-trace"></div>
    </div>

    <!-- FOOTER -->
    <div id="footer">
      <div>Unified Discovery Interface • 313 Primitives • Zero Dependencies</div>
      <div class="coherence-meter">
        <span>Coherence:</span>
        <div class="coherence-bar">
          <div class="coherence-fill" id="coherence-fill" style="width: 50%;"></div>
        </div>
        <span id="coherence-value">50%</span>
      </div>
    </div>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════════════════
    // UNIFIED DISCOVERY INTERFACE
    // ═══════════════════════════════════════════════════════════════════════════

    class DiscoveryInterface {
      constructor() {
        this.currentTab = 'explorer'
        this.currentDomain = 'Binary'
        this.reasoningServer = 'http://localhost:5555'
        this.coherence = 50
        this.lastReasoning = null

        this.initializeUI()
        this.initializeData()
        this.attachEventListeners()
        this.renderTab('explorer')
      }

      // ─────────────────────────────────────────────────────────────────────────
      // UI INITIALIZATION
      // ─────────────────────────────────────────────────────────────────────────

      initializeUI() {
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const tab = btn.dataset.tab
            this.switchTab(tab)
          })
        })

        // Domain filtering
        document.querySelectorAll('.domain-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'))
            btn.classList.add('active')
            this.currentDomain = btn.dataset.domain
            this.onDomainChange()
          })
        })

        // Search
        const search = document.getElementById('primitive-search')
        if (search) {
          search.addEventListener('input', (e) => this.filterPrimitives(e.target.value))
        }
      }

      initializeData() {
        // Minimal primitive data structure - will expand to 313
        // For now, representative samples from each domain
        this.primitives = {
          Binary: [
            { id: 'AND', name: 'AND', desc: 'Logical conjunction', type: 'Gate' },
            { id: 'OR', name: 'OR', desc: 'Logical disjunction', type: 'Gate' },
            { id: 'NOT', name: 'NOT', desc: 'Negation', type: 'Gate' },
            { id: 'XOR', name: 'XOR', desc: 'Exclusive OR', type: 'Gate' },
          ],
          Topological: [
            { id: 'POINT', name: 'Point', desc: 'Location in space', type: 'Spatial' },
            { id: 'DISTANCE', name: 'Distance', desc: 'Spatial separation', type: 'Metric' },
            { id: 'BEFORE', name: 'Before', desc: 'Temporal ordering', type: 'Temporal' },
            { id: 'AFTER', name: 'After', desc: 'Reverse temporal', type: 'Temporal' },
          ],
          Probability: [
            { id: 'PRIOR', name: 'Prior', desc: 'Initial belief', type: 'Bayesian' },
            { id: 'POSTERIOR', name: 'Posterior', desc: 'Updated belief', type: 'Bayesian' },
            { id: 'LIKELIHOOD', name: 'Likelihood', desc: 'Probability of observation', type: 'Bayesian' },
          ],
          Interaction: [
            { id: 'AGENT', name: 'Agent', desc: 'Active entity', type: 'Actor' },
            { id: 'CAUSE', name: 'Cause', desc: 'Causal force', type: 'Relation' },
            { id: 'EFFECT', name: 'Effect', desc: 'Resulting change', type: 'Relation' },
          ],
          Compositions: [
            { id: 'COHERENCE', name: 'Coherence', desc: 'Field unification', type: 'Meta' },
            { id: 'INTEGRATION', name: 'Integration', desc: 'System binding', type: 'Meta' },
            { id: 'SENTIENCE', name: 'Sentience', desc: 'Unified awareness', type: 'Meta' },
          ],
        }
      }

      attachEventListeners() {
        // Will attach canvas and interaction listeners per tab
      }

      // ─────────────────────────────────────────────────────────────────────────
      // TAB MANAGEMENT
      // ─────────────────────────────────────────────────────────────────────────

      switchTab(tab) {
        // Hide all tabs
        document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'))
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'))

        // Show new tab
        document.getElementById(`tab-${tab}`).classList.add('active')
        document.querySelector(`[data-tab="${tab}"]`).classList.add('active')

        this.currentTab = tab

        // Show/hide sidebar
        const sidebar = document.getElementById('sidebar')
        if (tab === 'explorer') {
          sidebar.classList.add('visible')
        } else {
          sidebar.classList.remove('visible')
        }

        this.renderTab(tab)
      }

      renderTab(tab) {
        switch (tab) {
          case 'explorer':
            this.renderExplorer()
            break
          case 'causal':
            this.renderCausalChains()
            break
          case 'tree':
            this.renderUFMTree()
            break
          case 'decomposition':
            this.renderDecomposition()
            break
          case 'mapping':
            this.renderSelfMapping()
            break
        }
      }

      // ─────────────────────────────────────────────────────────────────────────
      // TAB RENDERERS
      // ─────────────────────────────────────────────────────────────────────────

      renderExplorer() {
        const canvas = document.getElementById('canvas-explorer')
        if (!canvas || !canvas.getContext) return

        const ctx = canvas.getContext('2d')
        canvas.width = canvas.offsetWidth
        canvas.height = canvas.offsetHeight

        // Clear canvas
        ctx.fillStyle = '#0a0a0a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw domain visualization
        this.drawDomainVisualization(ctx, canvas)

        // Populate primitive list
        this.updatePrimitiveList()
      }

      renderCausalChains() {
        const canvas = document.getElementById('canvas-causal')
        if (!canvas) return

        const ctx = canvas.getContext('2d')
        canvas.width = canvas.offsetWidth
        canvas.height = canvas.offsetHeight

        // Clear canvas
        ctx.fillStyle = '#0a0a0a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw causal graph
        ctx.fillStyle = '#00d9ff'
        ctx.font = '12px Courier New'
        ctx.fillText('Causal chains will render here', 20, 30)
      }

      renderUFMTree() {
        const canvas = document.getElementById('canvas-tree')
        if (!canvas) return

        const ctx = canvas.getContext('2d')
        canvas.width = canvas.offsetWidth
        canvas.height = canvas.offsetHeight

        // Clear canvas
        ctx.fillStyle = '#0a0a0a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw tree
        ctx.fillStyle = '#00d9ff'
        ctx.font = '12px Courier New'
        ctx.fillText('UFM tree will render here', 20, 30)
      }

      renderDecomposition() {
        const canvas = document.getElementById('canvas-decomposition')
        if (!canvas) return

        const ctx = canvas.getContext('2d')
        canvas.width = canvas.offsetWidth
        canvas.height = canvas.offsetHeight

        // Clear canvas
        ctx.fillStyle = '#0a0a0a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw decomposition
        ctx.fillStyle = '#00d9ff'
        ctx.font = '12px Courier New'
        ctx.fillText('Decomposition will render here', 20, 30)
      }

      renderSelfMapping() {
        const canvas = document.getElementById('canvas-mapping')
        if (!canvas) return

        const ctx = canvas.getContext('2d')
        canvas.width = canvas.offsetWidth
        canvas.height = canvas.offsetHeight

        // Clear canvas
        ctx.fillStyle = '#0a0a0a'
        ctx.fillRect(0, 0, canvas.width, canvas.height)

        // Draw self-mapping
        ctx.fillStyle = '#00d9ff'
        ctx.font = '12px Courier New'
        ctx.fillText('Self-mapping will render here', 20, 30)
      }

      drawDomainVisualization(ctx, canvas) {
        const domainCount = Object.keys(this.primitives).length
        const w = canvas.width / domainCount
        const h = canvas.height

        const domains = Object.entries(this.primitives)
        const colors = {
          Binary: '#ff0080',
          Topological: '#00ffff',
          Probability: '#ffff00',
          Interaction: '#00ff00',
          Compositions: '#ff00ff',
        }

        domains.forEach(([domain, prims], idx) => {
          const x = idx * w
          const count = prims.length
          const height = (count / 313) * h // 313 total primitives

          ctx.fillStyle = colors[domain]
          ctx.globalAlpha = this.currentDomain === domain ? 0.3 : 0.1
          ctx.fillRect(x, h - height, w - 2, height)

          ctx.globalAlpha = 1
          ctx.fillStyle = colors[domain]
          ctx.font = 'bold 12px Courier New'
          ctx.fillText(domain, x + 10, 30)
          ctx.font = '10px Courier New'
          ctx.fillText(`${count} prims`, x + 10, 45)
        })
      }

      updatePrimitiveList() {
        const list = document.getElementById('primitive-list')
        if (!list) return

        const prims = this.primitives[this.currentDomain] || []

        list.innerHTML = prims.map(p => `
          <div class="primitive-item" onclick="app.selectPrimitive('${p.id}')">
            <div style="font-weight: bold; color: #00ff00;">${p.name}</div>
            <div style="font-size: 0.75rem; color: #00d9ff; opacity: 0.8;">${p.desc}</div>
          </div>
        `).join('')
      }

      filterPrimitives(query) {
        const list = document.getElementById('primitive-list')
        const prims = this.primitives[this.currentDomain] || []

        const filtered = prims.filter(p =>
          p.name.toLowerCase().includes(query.toLowerCase()) ||
          p.desc.toLowerCase().includes(query.toLowerCase())
        )

        list.innerHTML = filtered.map(p => `
          <div class="primitive-item" onclick="app.selectPrimitive('${p.id}')">
            <div style="font-weight: bold; color: #00ff00;">${p.name}</div>
            <div style="font-size: 0.75rem; color: #00d9ff; opacity: 0.8;">${p.desc}</div>
          </div>
        `).join('')
      }

      selectPrimitive(id) {
        this.showInfoPanel(id)
        this.queryReasoningServer(id)
      }

      // ─────────────────────────────────────────────────────────────────────────
      // REASONING SERVER INTEGRATION
      // ─────────────────────────────────────────────────────────────────────────

      async queryReasoningServer(query) {
        try {
          const response = await fetch(`${this.reasoningServer}/query`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query })
          })

          const data = await response.json()
          this.updateReasoning(data)
        } catch (err) {
          console.log('Reasoning server not available:', err.message)
        }
      }

      updateReasoning(data) {
        this.lastReasoning = data

        // Update coherence
        if (data.coherence) {
          this.coherence = Math.round(data.coherence * 100)
          document.getElementById('coherence-fill').style.width = `${this.coherence}%`
          document.getElementById('coherence-value').textContent = `${this.coherence}%`
        }

        // Show reasoning trace
        const trace = document.getElementById('reasoning-trace')
        trace.innerHTML = (data.primitives || []).slice(0, 5).map((p, idx) => `
          <div class="reasoning-item ${idx === 0 ? 'high' : ''}">
            <strong>${p}</strong>
          </div>
        `).join('')

        if (data.primitives && data.primitives.length > 0) {
          document.getElementById('reasoning-panel').classList.add('visible')
        }
      }

      showInfoPanel(id) {
        // Find primitive
        for (const domain in this.primitives) {
          const prim = this.primitives[domain].find(p => p.id === id)
          if (prim) {
            const panel = document.getElementById('info-panel')
            panel.innerHTML = `
              <button style="position: absolute; top: 0.5rem; right: 0.5rem; background: none; border: none; color: #00d9ff; cursor: pointer; font-size: 1.2rem;" onclick="document.getElementById('info-panel').classList.remove('visible')">✕</button>
              <h3>${prim.name}</h3>
              <div class="info-field">
                <span class="info-label">Domain:</span>
                <span class="info-value"> ${domain}</span>
              </div>
              <div class="info-field">
                <span class="info-label">Description:</span>
                <span class="info-value"> ${prim.desc}</span>
              </div>
              <div class="info-field">
                <span class="info-label">Type:</span>
                <span class="info-value"> ${prim.type}</span>
              </div>
            `
            panel.classList.add('visible')
            return
          }
        }
      }

      // ─────────────────────────────────────────────────────────────────────────
      // EVENT HANDLERS
      // ─────────────────────────────────────────────────────────────────────────

      onDomainChange() {
        this.updatePrimitiveList()
        this.renderExplorer()
      }
    }

    // Initialize application
    const app = new DiscoveryInterface()
    window.app = app

    console.log('⊙ DETERMINED Discovery Interface loaded')
    console.log('Reasoning Server:', app.reasoningServer)
  </script>
</body>
</html>
