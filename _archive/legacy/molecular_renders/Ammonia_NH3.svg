<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <rect width="400" height="400" fill="white" />
  
  <!-- Rasterized molecular visualization (all weighted primitives applied) -->
  <image href="data:image/png;base64," width="400" height="400" />
  
  <!-- Vector enhancement layer - fields rendered as scalable elements -->
  <g id="quantum-fields" opacity="0.6">
    <!-- Electron density rings (from glow_strength weighting) -->
    <circle cx="200.0" cy="200.0" r="152.0" fill="none" stroke="#4466ff" stroke-width="2" opacity="0.4" />
    <circle cx="200.0" cy="200.0" r="112.00000000000001" fill="none" stroke="#4466ff" stroke-width="1.5" opacity="0.5" />
    <circle cx="200.0" cy="200.0" r="72.0" fill="none" stroke="#4466ff" stroke-width="1" opacity="0.6" />
  </g>
  
  <!-- Metadata -->
  <text x="12" y="22" font-family="monospace" font-size="14" font-weight="bold" fill="#333">
    Ammonia_NH3
  </text>
  <text x="12" y="388" font-family="monospace" font-size="10" fill="#999">
    SVG Vector • Unlimited Resolution • All Fields Preserved
  </text>
</svg>