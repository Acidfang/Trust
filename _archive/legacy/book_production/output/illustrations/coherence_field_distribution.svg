<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="coherence-gradient-horizontal" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" style="stop-color:#8B0000;stop-opacity:0.4" />
  <stop offset="50%" style="stop-color:#FFD700;stop-opacity:0.3" />
  <stop offset="100%" style="stop-color:#006400;stop-opacity:0.2" />
</linearGradient>
<radialGradient id="entry-marker-field" cx="50%" cy="50%" r="50%">
  <stop offset="0%" style="stop-color:#FF4444;stop-opacity:0.5" />
  <stop offset="100%" style="stop-color:#FF4444;stop-opacity:0" />
</radialGradient>
<style>
  .tier-line { stroke: #333; stroke-width: 2; fill: none; }
  .tier-label { font-size: 14px; font-weight: bold; }
  .entry-label { font-size: 11px; fill: #333; }
  .state-marker { font-size: 10px; font-weight: bold; }
</style>
</defs>
<text x="600.0" y="35" text-anchor="middle" font-size="24" font-weight="bold">
COHERENCE FIELD: Potential Energy Distribution
</text>
<text x="600.0" y="55" text-anchor="middle" font-size="12" fill="#666">
Red/Dark = High Tension (Unresolved) | Green/Light = Low Tension (Resolved)
</text>
<rect x="50" y="100" width="1100" height="600" fill="url(#coherence-gradient-horizontal)" stroke="#999" stroke-width="1" />
<text x="125" y="720" text-anchor="middle" class="tier-label">Tier -1
(Self)</text>
<line x1="200" y1="100" x2="200" y2="700" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
<text x="260" y="720" text-anchor="middle" class="tier-label">Tier 0
(Connection)</text>
<line x1="320" y1="100" x2="320" y2="700" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
<text x="370" y="720" text-anchor="middle" class="tier-label">Tier 1
(Conflict)</text>
<line x1="420" y1="100" x2="420" y2="700" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
<text x="475" y="720" text-anchor="middle" class="tier-label">Tier 2
(Consist.)</text>
<line x1="530" y1="100" x2="530" y2="700" stroke="#666" stroke-width="1" stroke-dasharray="3,3" />
<text x="765" y="720" text-anchor="middle" class="tier-label">Tier 3
(Transcend.)</text>
<circle cx="80" cy="200" r="60" fill="#FF4444" opacity="0.48" />
<text x="80" y="205" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">pattern</text>
<circle cx="140" cy="350" r="50" fill="#FF4444" opacity="0.42" />
<text x="140" y="355" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">unjustified</text>
<circle cx="110" cy="500" r="70" fill="#FF4444" opacity="0.54" />
<text x="110" y="505" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">unresolved</text>
<circle cx="220" cy="250" r="45" fill="#FF4444" opacity="0.36" />
<text x="220" y="255" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">distorted</text>
<circle cx="280" cy="400" r="55" fill="#FF4444" opacity="0.42" />
<text x="280" y="405" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">deferred</text>
<circle cx="240" cy="550" r="50" fill="#FF4444" opacity="0.39" />
<text x="240" y="555" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">comfort-based</text>
<circle cx="350" cy="300" r="48" fill="#FF4444" opacity="0.42" />
<text x="350" y="305" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">surface conflict</text>
<circle cx="400" cy="450" r="52" fill="#FF4444" opacity="0.44999999999999996" />
<text x="400" y="455" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">unlearned</text>
<circle cx="460" cy="280" r="42" fill="#FF4444" opacity="0.36" />
<text x="460" y="285" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">drift</text>
<circle cx="520" cy="500" r="45" fill="#FF4444" opacity="0.39" />
<text x="520" y="505" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">slide</text>
<circle cx="700" cy="350" r="35" fill="#FF4444" opacity="0.24" />
<text x="700" y="355" text-anchor="middle" class="entry-label" fill="white" font-weight="bold" stroke="white" stroke-width="0.5">resist</text>
<rect x="530" y="100" width="470" height="600" fill="#00DD00" opacity="0.08" />
<text x="765" y="400" text-anchor="middle" font-size="14" fill="#006400" font-weight="bold" opacity="0.5">Higher Integration</text>
<text x="50" y="780" font-size="12" font-weight="bold">Legend:</text>
<circle cx="180" cy="774" r="8" fill="#FF4444" opacity="0.6" />
<text x="195" y="780" font-size="11">Entry Marker Hot Spot (unresolved tension accumulation)</text>
<rect x="520" y="768" width="15" height="15" fill="#006400" opacity="0.2" />
<text x="545" y="780" font-size="11">Resolved Region (lower tension)</text>
</svg>