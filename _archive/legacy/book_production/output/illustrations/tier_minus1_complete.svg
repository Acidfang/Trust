<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1200" xmlns="http://www.w3.org/2000/svg">
<defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333" />
    </marker>
    <marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#cc6666" />
    </marker>
    <marker id="arrow-escalate" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9999" />
    </marker>
  </defs>
<style>
      /* State type encoding */
      .decision-point { fill: #8B0000; }  /* Dark red - decision required */
      .work-state { fill: #006400; }      /* Dark green - work required */
      .prerequisite { fill: #4169E1; }    /* Royal blue */
      
      /* Path encoding */
      .primary-path { stroke: #333; stroke-width: 2; fill: none; }
      .loop-back { stroke: #cc6666; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
      .escalate-path { stroke: #ff9999; stroke-width: 2.5; stroke-dasharray: 3,3; fill: none; }
      
      /* Text */
      text { font-family: Arial, sans-serif; }
      .state-label { font-size: 12px; font-weight: bold; }
      .note { font-size: 10px; fill: #666; }
      .annotation { font-size: 11px; }
      
      /* Boxes */
      .info-box { fill: #f9f9f9; stroke: #ccc; stroke-width: 1; }
      .gate-box { fill: #E8F0FF; stroke: #4169E1; stroke-width: 2; }
    </style>
<text x="500.0" y="30" text-anchor="middle" font-size="24" font-weight="bold">TIER -1 State Progression: Self (Coherence)</text>
<text x="500.0" y="50" text-anchor="middle" font-size="12" fill="#666">Awareness → Distinction → Causality → Regulation → Consistency → Correction → Alignment → Persistence → Adaptability → Integrity</text>
<!-- T-1.1: Awareness -->
<g transform="translate(500.0, 100)">
<circle r="30" class="decision-point" opacity="0.8" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.1</text>
<text x="0" y="50" text-anchor="middle" class="note">Awareness</text>
</g>
<!-- T-1.2: Distinction -->
<g transform="translate(500.0, 200)">
<circle r="30" class="work-state" opacity="0.81" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.2</text>
<text x="0" y="50" text-anchor="middle" class="note">Distinction</text>
</g>
<!-- T-1.3: Causality -->
<g transform="translate(500.0, 300)">
<circle r="35" class="work-state" opacity="0.8200000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.3</text>
<text x="0" y="55" text-anchor="middle" class="note">Causality</text>
</g>
<!-- T-1.4: Regulation -->
<g transform="translate(500.0, 420)">
<circle r="32" class="decision-point" opacity="0.8300000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.4</text>
<text x="0" y="52" text-anchor="middle" class="note">Regulation</text>
</g>
<!-- T-1.5: Consistency -->
<g transform="translate(500.0, 530)">
<circle r="30" class="work-state" opacity="0.8400000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.5</text>
<text x="0" y="50" text-anchor="middle" class="note">Consistency</text>
</g>
<!-- T-1.6: Correction -->
<g transform="translate(500.0, 630)">
<circle r="33" class="work-state" opacity="0.8500000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.6</text>
<text x="0" y="53" text-anchor="middle" class="note">Correction</text>
</g>
<!-- T-1.7: Alignment -->
<g transform="translate(500.0, 740)">
<circle r="34" class="work-state" opacity="0.8600000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.7</text>
<text x="0" y="54" text-anchor="middle" class="note">Alignment</text>
</g>
<!-- T-1.8: Persistence -->
<g transform="translate(500.0, 860)">
<circle r="32" class="decision-point" opacity="0.8700000000000001" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.8</text>
<text x="0" y="52" text-anchor="middle" class="note">Persistence</text>
</g>
<!-- T-1.9: Adaptability -->
<g transform="translate(500.0, 970)">
<circle r="35" class="decision-point" opacity="0.88" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.9</text>
<text x="0" y="55" text-anchor="middle" class="note">Adaptability</text>
</g>
<!-- T-1.10: Integrity -->
<g transform="translate(500.0, 1070)">
<circle r="36" class="work-state" opacity="0.89" />
<text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" class="state-label">T-1.10</text>
<text x="0" y="56" text-anchor="middle" class="note">Integrity</text>
</g>
<!-- Primary progression paths -->
<path d="M 500.0,135 L 500.0,165" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,235 L 500.0,260" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,340 L 500.0,383" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,457 L 500.0,495" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,565 L 500.0,592" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,668 L 500.0,701" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,779 L 500.0,823" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,897 L 500.0,930" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,1010 L 500.0,1029" class="primary-path" marker-end="url(#arrow)" />
<!-- Loop-back paths (entry markers) -->
<!-- Loop from T-3 back to T-2 (entry: pattern) -->
<path d="M 555.0,300 Q 650.0,250.0 555.0,200" class="loop-back" marker-end="url(#arrow-loop)" />
<text x="680.0" y="240.0" class="note">[entry: pattern]</text>
<!-- Loop from T-6 back to T-4 (entry: unjustified) -->
<path d="M 553.0,630 Q 650.0,525.0 553.0,420" class="loop-back" marker-end="url(#arrow-loop)" />
<text x="680.0" y="515.0" class="note">[entry: unjustified]</text>
<!-- Loop from T-9 back to T-1 (entry: unresolved) -->
<path d="M 555.0,970 Q 650.0,535.0 555.0,100" class="escalate-path" marker-end="url(#arrow-escalate)" />
<text x="680.0" y="525.0" class="note">[entry: unresolved]</text>
<!-- Prerequisite Sheet as Gate -->
<g transform="translate(400, 1120)">
<rect x="0" y="0" width="200" height="60" rx="5" class="gate-box" />
<text x="100" y="20" text-anchor="middle" font-weight="bold">PREREQUISITE SHEET</text>
<text x="100" y="40" text-anchor="middle" font-size="11">Required to enter Tier 0</text>
<text x="100" y="55" text-anchor="middle" font-size="10" fill="#666">(All entry markers resolved)</text>
</g>
<!-- Legend -->
<g transform="translate(50, 1100)">
<text font-weight="bold" font-size="12">Legend:</text>
<circle cx="120" cy="0" r="8" class="decision-point" />
<text x="135" y="4" font-size="11">Decision Point</text>
<circle cx="320" cy="0" r="8" class="work-state" />
<text x="335" y="4" font-size="11">Work State</text>
</g>
<g transform="translate(50, 1130)">
<line x1="0" y1="0" x2="30" y1="0" class="primary-path" marker-end="url(#arrow)" />
<text x="40" y="4" font-size="11">Primary Path</text>
<line x1="200" y1="0" x2="230" y1="0" class="loop-back" marker-end="url(#arrow-loop)" />
<text x="240" y="4" font-size="11">Loop Back (entry marker)</text>
<line x1="500" y1="0" x2="530" y1="0" class="escalate-path" marker-end="url(#arrow-escalate)" />
<text x="540" y="4" font-size="11">Full Reset</text>
</g>
<!-- Teaching annotations -->
<g transform="translate(700, 300)">
<rect x="0" y="0" width="280" height="140" rx="5" class="info-box" />
<text x="10" y="20" font-weight="bold" font-size="12">What This Teaches:</text>
<text x="10" y="40" font-size="11" class="annotation">1. Clear progression (top→bottom)</text>
<text x="10" y="57" font-size="11" class="annotation">2. Loops back are NECESSARY</text>
<text x="10" y="74" font-size="11" class="annotation">3. Entry markers trigger loops</text>
<text x="10" y="91" font-size="11" class="annotation">4. Full reset at T-1.9 possible</text>
<text x="10" y="108" font-size="11" class="annotation">5. Complete Prerequisite gate</text>
<text x="10" y="125" font-size="11" class="annotation">(Linear journey never happens)</text>
</g>
</svg>