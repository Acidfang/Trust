<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Field Encyclopedia — 3D Field Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000a0a;
        }

        #canvas-3d {
            width: 100vw;
            height: 100vh;
            display: block;
            background: radial-gradient(ellipse at center, #1a1a4a 0%, #000a0a 100%);
        }

        /* Info panel */
        #info-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(10, 10, 30, 0.98), rgba(5, 5, 15, 0.98));
            border-left: 2px solid #00ddff;
            overflow-y: auto;
            padding: 30px;
            transition: right 0.4s ease;
            z-index: 1000;
        }

        #info-panel.open {
            right: 0;
        }

        #info-panel h2 {
            color: #00ddff;
            margin-bottom: 15px;
            font-size: 1.6em;
            border-bottom: 1px solid #00ddff;
            padding-bottom: 10px;
        }

        #info-panel p {
            color: #88ff00;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        #info-panel .attribute {
            background: rgba(0, 221, 255, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00ddff;
            color: #00ff88;
            font-size: 0.9em;
        }

        #close-panel {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            color: #00ddff;
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.2s ease;
        }

        #close-panel:hover {
            color: #ff0088;
            transform: scale(1.2);
        }

        .breadcrumb {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #88ff00;
            font-size: 12px;
            text-shadow: 0 0 5px #00ddff;
            z-index: 100;
            max-width: 60%;
        }

        .breadcrumb a {
            color: #00ddff;
            cursor: pointer;
            text-decoration: underline;
            margin: 0 5px;
        }

        .breadcrumb a:hover {
            color: #ff00ff;
        }

        .controls-hint {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #00ddff;
            font-size: 11px;
            opacity: 0.6;
            z-index: 100;
            line-height: 1.5;
        }

        .controls-hint span {
            color: #88ff00;
            font-weight: bold;
        }

        #info-panel::-webkit-scrollbar {
            width: 8px;
        }

        #info-panel::-webkit-scrollbar-track {
            background: rgba(0, 221, 255, 0.1);
        }

        #info-panel::-webkit-scrollbar-thumb {
            background: #00ddff;
            border-radius: 4px;
        }

        #info-panel::-webkit-scrollbar-thumb:hover {
            background: #00ff88;
        }

        .loading {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #00ff88;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .loading.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- 3D Canvas -->
    <canvas id="canvas-3d"></canvas>

    <!-- Info Panel -->
    <div id="info-panel">
        <button id="close-panel">✕</button>
        <div id="panel-content">
            <p>🕸️ Field loaded. Click any node to explore.</p>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb" id="breadcrumb">Encyclopedia</div>

    <!-- Controls Hint -->
    <div class="controls-hint">
        <span>🎮 CONTROLS:</span><br>
        <span>LMB</span> drag = rotate | <span>RMB</span> drag = pan<br>
        <span>Scroll</span> = zoom | <span>ESC</span> = close panel
    </div>

    <!-- Loading -->
    <div class="loading" id="loading">⚡ Loading...</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const CONFIG = {
            API_BASE: 'http://localhost:5000',
            INITIAL_ENTITY: 'Water Molecule',
            PANEL_WIDTH: 400,
            CAMERA_DISTANCE: 100,
            NODE_SIZE: 2,
        };

        class Field3DEncyclopedia {
            constructor() {
                this.currentEntity = null;
                this.navigationHistory = [];
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.nodes = [];
                this.fieldLines = [];
                this.particle = null;
                
                this.infoPanel = document.getElementById('info-panel');
                this.panelContent = document.getElementById('panel-content');
                this.breadcrumb = document.getElementById('breadcrumb');
                this.loading = document.getElementById('loading');
                this.canvas = document.getElementById('canvas-3d');
                
                this.initThreeJS();
                this.setupEventListeners();
                this.animate();
                
                // Load initial entity
                setTimeout(() => this.navigateTo(CONFIG.INITIAL_ENTITY), 500);
            }

            initThreeJS() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x000a0a);
                this.scene.fog = new THREE.Fog(0x000a0a, 300, 500);

                // Camera
                const width = window.innerWidth;
                const height = window.innerHeight;
                this.camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                this.camera.position.set(0, 30, 80);
                this.camera.lookAt(0, 0, 0);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({ 
                    canvas: this.canvas, 
                    antialias: true, 
                    alpha: true 
                });
                this.renderer.setSize(width, height);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.shadowMap.enabled = true;

                // Lighting
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
                this.scene.add(ambientLight);

                const pointLight = new THREE.PointLight(0x00ddff, 1.5);
                pointLight.position.set(50, 50, 50);
                pointLight.castShadow = true;
                this.scene.add(pointLight);

                const pointLight2 = new THREE.PointLight(0xff00ff, 0.8);
                pointLight2.position.set(-50, -50, 50);
                this.scene.add(pointLight2);

                // Particle field background
                this.createParticleField();

                // Mouse controls
                this.setupMouseControls();

                // Handle window resize
                window.addEventListener('resize', () => this.onWindowResize());
            }

            createParticleField() {
                const particleCount = 200;
                const positions = new Float32Array(particleCount * 3);
                
                for (let i = 0; i < particleCount * 3; i++) {
                    positions[i] = (Math.random() - 0.5) * 400;
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: 0x00ddff,
                    size: 0.3,
                    sizeAttenuation: true,
                    opacity: 0.3,
                    transparent: true,
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
            }

            setupMouseControls() {
                let isDragging = false;
                let previousMousePosition = { x: 0, y: 0 };
                let isRightClick = false;

                this.canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    isRightClick = e.button === 2;
                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                this.canvas.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;

                    const deltaX = e.clientX - previousMousePosition.x;
                    const deltaY = e.clientY - previousMousePosition.y;

                    if (isRightClick) {
                        // Pan
                        const panSpeed = 0.1;
                        this.camera.position.x -= deltaX * panSpeed;
                        this.camera.position.y += deltaY * panSpeed;
                    } else {
                        // Rotate
                        const rotSpeed = 0.01;
                        const theta = Math.atan2(this.camera.position.z, this.camera.position.x);
                        const phi = Math.acos(this.camera.position.y / this.camera.position.length());
                        
                        const newTheta = theta - deltaX * rotSpeed;
                        const newPhi = Math.max(0.1, Math.min(Math.PI - 0.1, phi + deltaY * rotSpeed));
                        const radius = this.camera.position.length();

                        this.camera.position.x = radius * Math.sin(newPhi) * Math.cos(newTheta);
                        this.camera.position.y = radius * Math.cos(newPhi);
                        this.camera.position.z = radius * Math.sin(newPhi) * Math.sin(newTheta);
                        this.camera.lookAt(0, 0, 0);
                    }

                    previousMousePosition = { x: e.clientX, y: e.clientY };
                });

                this.canvas.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                this.canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomSpeed = 2;
                    const currentDistance = this.camera.position.length();
                    const newDistance = Math.max(20, Math.min(200, currentDistance + e.deltaY * zoomSpeed / 1000));
                    const scale = newDistance / currentDistance;
                    
                    this.camera.position.multiplyScalar(scale);
                    this.camera.lookAt(0, 0, 0);
                }, false);

                this.canvas.addEventListener('contextmenu', (e) => e.preventDefault());
            }

            async navigateTo(entityName) {
                this.showLoading(true);
                
                try {
                    window.location.hash = `entity/${encodeURIComponent(entityName)}`;

                    const [cascadeResponse, entityResponse] = await Promise.all([
                        fetch(`${CONFIG.API_BASE}/api/cascade/${encodeURIComponent(entityName)}`),
                        fetch(`${CONFIG.API_BASE}/api/entity/${encodeURIComponent(entityName)}`)
                    ]);

                    if (!cascadeResponse.ok || !entityResponse.ok) {
                        throw new Error('Failed to fetch data');
                    }

                    const cascade = await cascadeResponse.json();
                    const entityData = await entityResponse.json();

                    this.currentEntity = entityName;
                    this.navigationHistory.push(entityName);

                    // Clear previous nodes
                    this.clearScene();

                    // Render 3D field from cascade data
                    this.render3DField(cascade);

                    // Update UI
                    this.updateBreadcrumb();
                    this.updateInfoPanel(entityData);

                } catch (error) {
                    console.error('Navigation error:', error);
                    this.showError(entityName, error);
                }

                this.showLoading(false);
            }

            render3DField(cascade) {
                const center = cascade.center;
                const branches = cascade.branches;

                // Create center node (golden/yellow)
                const centerNode = this.createNode(0, 0, 0, CONFIG.NODE_SIZE * 2, 0xffff00, center);
                this.nodes.push(centerNode);

                // Create branches radiating outward
                const numBranches = branches.length;
                const branchRadius = 40;

                branches.forEach((branch, idx) => {
                    const angle = (idx / numBranches) * Math.PI * 2;
                    const branchX = branchRadius * Math.cos(angle);
                    const branchY = branchRadius * Math.sin(angle) * 0.3;
                    const branchZ = branchRadius * Math.sin(angle);

                    // Branch label node
                    const branchColor = this.getComplexityColor(branch.complexity);
                    const branchNode = this.createNode(branchX, branchY, branchZ, CONFIG.NODE_SIZE * 1.5, branchColor, branch.name);
                    this.nodes.push(branchNode);

                    // Create field line from center to branch
                    this.createFieldLine(0, 0, 0, branchX, branchY, branchZ, 0x00ddff);

                    // Create items in branch
                    branch.items.forEach((item, itemIdx) => {
                        const itemAngle = angle + (itemIdx - branch.items.length / 2) * 0.3;
                        const itemRadius = branchRadius + 30;
                        const itemX = itemRadius * Math.cos(itemAngle);
                        const itemY = Math.sin(itemAngle) * 15;
                        const itemZ = itemRadius * Math.sin(itemAngle);

                        const itemColor = parseInt(item.color.replace('#', '0x'), 16);
                        const itemNode = this.createNode(itemX, itemY, itemZ, CONFIG.NODE_SIZE, itemColor, item.label);
                        this.nodes.push(itemNode);

                        // Field line from branch to item
                        this.createFieldLine(branchX, branchY, branchZ, itemX, itemY, itemZ, itemColor);
                    });
                });
            }

            createNode(x, y, z, size, color, label) {
                const geometry = new THREE.IcosahedronGeometry(size, 4);
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.3,
                    wireframe: false,
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(x, y, z);
                mesh.userData = { label, originalColor: color };

                // Add glow effect
                const glowGeometry = new THREE.IcosahedronGeometry(size * 1.3, 4);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.2,
                });
                const glowMesh = new THREE.Mesh(glowGeometry, glowMaterial);
                glowMesh.position.copy(mesh.position);
                this.scene.add(glowMesh);

                // Animation
                mesh.userData.glowMesh = glowMesh;
                mesh.userData.targetScale = 1;

                // Store original geometry for hover effects
                mesh.userData.originalSize = size;

                this.scene.add(mesh);

                // Click handler
                mesh.userData.clickable = true;

                return mesh;
            }

            createFieldLine(x1, y1, z1, x2, y2, z2, color) {
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array([x1, y1, z1, x2, y2, z2]);
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.LineBasicMaterial({ color, linewidth: 2 });
                const line = new THREE.Line(geometry, material);

                this.scene.add(line);
                this.fieldLines.push(line);

                return line;
            }

            getComplexityColor(level) {
                const colors = {
                    0: 0xffff00,
                    1: 0x88ff00,
                    2: 0x00ff88,
                    3: 0x00ffff,
                    4: 0x0088ff,
                    5: 0x8800ff,
                };
                return colors[level] || 0xffffff;
            }

            clearScene() {
                this.nodes.forEach(node => {
                    if (node.userData.glowMesh) {
                        this.scene.remove(node.userData.glowMesh);
                    }
                    this.scene.remove(node);
                });
                this.fieldLines.forEach(line => this.scene.remove(line));
                this.nodes = [];
                this.fieldLines = [];
            }

            updateInfoPanel(entityData) {
                const html = `
                    <h2>${entityData.name}</h2>
                    <p>${entityData.description || 'Field entity loaded'}</p>
                    
                    ${entityData.attributes ? `
                        <div style="margin-top: 20px;">
                            <h3 style="color: #00ff88; margin-bottom: 10px;">⚛️ Properties</h3>
                            ${Object.entries(entityData.attributes)
                                .map(([key, value]) => `
                                    <div class="attribute">
                                        <strong>${key}:</strong> ${value}
                                    </div>
                                `)
                                .join('')}
                        </div>
                    ` : ''}

                    <div style="margin-top: 20px;">
                        <p style="font-size: 0.85em; color: #00ddff; font-style: italic;">
                            💡 Rotate: click-drag | Pan: right-click-drag | Zoom: scroll
                        </p>
                    </div>
                `;

                this.panelContent.innerHTML = html;
                this.infoPanel.classList.add('open');
            }

            updateBreadcrumb() {
                const history = this.navigationHistory.slice(-3);
                const breadcrumbHTML = history.map((entity, idx) => {
                    const isLast = idx === history.length - 1;
                    return isLast 
                        ? entity 
                        : `<a onclick="encyclopedia.navigateTo('${entity}')">${entity}</a>`;
                }).join(' > ');

                this.breadcrumb.innerHTML = breadcrumbHTML;
            }

            showLoading(show) {
                if (show) {
                    this.loading.classList.add('active');
                } else {
                    this.loading.classList.remove('active');
                }
            }

            showError(entityName, error) {
                this.panelContent.innerHTML = `
                    <h2 style="color: #ff0088;">⚠️ Error</h2>
                    <p>Could not load: <strong>${entityName}</strong></p>
                    <p style="color: #ff6666; font-size: 0.9em;">${error.message}</p>
                `;
                this.infoPanel.classList.add('open');
            }

            getEntityFromURL() {
                const hash = window.location.hash;
                const match = hash.match(/entity\/(.+)/);
                return match ? decodeURIComponent(match[1]) : null;
            }

            setupEventListeners() {
                document.getElementById('close-panel').addEventListener('click', () => {
                    this.infoPanel.classList.remove('open');
                });

                window.addEventListener('hashchange', () => {
                    const entityName = this.getEntityFromURL();
                    if (entityName) {
                        this.navigateTo(entityName);
                    }
                });

                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        this.infoPanel.classList.remove('open');
                    }
                });

                // Node click detection via raycasting
                this.canvas.addEventListener('click', (event) => {
                    if (event.button !== 0) return; // Left click only
                    if (this.infoPanel.classList.contains('open') && event.clientX > window.innerWidth - CONFIG.PANEL_WIDTH) return;

                    const rect = this.canvas.getBoundingClientRect();
                    const x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    const y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

                    const raycaster = new THREE.Raycaster();
                    raycaster.setFromCamera(new THREE.Vector2(x, y), this.camera);

                    const intersects = raycaster.intersectObjects(this.nodes);
                    if (intersects.length > 0) {
                        const clicked = intersects[0].object;
                        if (clicked.userData.label) {
                            this.navigateTo(clicked.userData.label);
                        }
                    }
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Animate nodes
                this.nodes.forEach(node => {
                    node.rotation.x += 0.001;
                    node.rotation.y += 0.002;

                    if (node.userData.glowMesh) {
                        node.userData.glowMesh.rotation.copy(node.rotation);
                        // Pulse glow
                        const scale = 1.3 + Math.sin(Date.now() * 0.003) * 0.1;
                        node.userData.glowMesh.scale.setScalar(scale);
                    }
                });

                // Animate particles
                if (this.particles) {
                    this.particles.rotation.x += 0.0001;
                    this.particles.rotation.y += 0.0002;
                }

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                const width = window.innerWidth;
                const height = window.innerHeight;
                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }
        }

        // Initialize
        const encyclopedia = new Field3DEncyclopedia();
        window.encyclopedia = encyclopedia;
    </script>
</body>
</html>
