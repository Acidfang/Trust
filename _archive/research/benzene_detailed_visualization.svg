<text x="35" y="636" class="info-text">Hybridization: All carbons sp² (σ + π framework)</text>
<text x="35" y="658" class="info-text">Aromaticity: 6π electrons, Hückel (4n+2) rule</text>
<text x="35" y="680" class="info-text">Resonance: ↔ structures → 1.5 bond order</text>
