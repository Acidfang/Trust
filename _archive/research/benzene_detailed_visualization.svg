<text x="690" y="592" class="info-text">Resonance Structures: Two equivalent forms</text>
<text x="690" y="614" class="info-text">Electron Density: Uniform around ring</text>
<text x="690" y="636" class="info-text">Charge Distribution: Negative charge on C ring</text>
<text x="690" y="658" class="info-text">Reactivity: Electrophilic aromatic substitution</text>
<text x="690" y="680" class="info-text">Nucleophilicity: High π-electron density</text>
<text x="690" y="702" class="info-text">Polarizability: High (extended conjugation)</text>
<text x="690" y="724" class="info-text">Stability: Aromatic (Kekule stabilization)</text>
