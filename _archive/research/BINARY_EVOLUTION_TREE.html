<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Computing Evolution Tree: Field Attribute Merging & Discovery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #e0e0e0;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            color: #64b5f6;
            margin-bottom: 10px;
            font-size: 2em;
        }
        
        .subtitle {
            text-align: center;
            color: #90caf9;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .tree-container {
            background: #0f1419;
            border: 2px solid #424242;
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 30px;
            overflow-x: auto;
        }
        
        svg {
            min-width: 100%;
            height: auto;
        }
        
        .node-group {
            cursor: pointer;
        }
        
        .node-circle {
            stroke: #64b5f6;
            stroke-width: 2;
            fill: #1a1f2e;
            transition: all 0.3s ease;
        }
        
        .node-group:hover .node-circle {
            fill: #2a3a4e;
            stroke: #90caf9;
            stroke-width: 3;
        }
        
        .node-label {
            text-anchor: middle;
            font-size: 12px;
            fill: #e0e0e0;
            pointer-events: none;
            font-weight: bold;
        }
        
        .node-sublabel {
            text-anchor: middle;
            font-size: 10px;
            fill: #90caf9;
            pointer-events: none;
        }
        
        .edge {
            stroke: #424242;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrowhead);
        }
        
        .edge.merge {
            stroke: #4caf50;
            stroke-dasharray: 5,5;
            stroke-width: 2;
        }
        
        .detail-panel {
            background: #1a1f2e;
            border: 1px solid #424242;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            border-left: 4px solid #64b5f6;
        }
        
        .detail-panel.active {
            display: block;
        }
        
        .detail-title {
            color: #64b5f6;
            font-size: 1.3em;
            margin-bottom: 12px;
            font-weight: bold;
        }
        
        .detail-content {
            color: #90caf9;
            font-size: 0.95em;
            line-height: 1.6;
        }
        
        .field-attributes {
            background: #0a0e27;
            border-radius: 4px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid #4caf50;
        }
        
        .emergent {
            background: #0d3a1a;
            border-radius: 4px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid #81c784;
        }
        
        .merges {
            background: #1a2d4a;
            border-radius: 4px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid #2196f3;
        }
        
        .discovery {
            background: #4a2d1a;
            border-radius: 4px;
            padding: 12px;
            margin: 10px 0;
            border-left: 3px solid #ff9800;
            color: #ffb74d;
        }
        
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .legend-item {
            background: #1a1f2e;
            border-left: 4px solid;
            padding: 12px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        .legend-item.level0 { border-left-color: #ff9800; }
        .legend-item.level1 { border-left-color: #2196f3; }
        .legend-item.level2 { border-left-color: #4caf50; }
        .legend-item.level3 { border-left-color: #9c27b0; }
        .legend-item.merge { border-left-color: #00bcd4; }
        
        .level-label {
            position: absolute;
            left: -80px;
            width: 70px;
            text-align: right;
            color: #64b5f6;
            font-weight: bold;
        }
        
        .usecase-branch {
            background: #1a2d4a;
            border-left: 4px solid #00bcd4;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 0.85em;
            color: #4dd0e1;
        }
        
        .mustuse {
            background: #2d1a1a;
            border-left: 4px solid #f44336;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 0.85em;
            color: #ef5350;
            font-weight: bold;
        }
        
        .canuse {
            background: #1a2d1a;
            border-left: 4px solid #4caf50;
            padding: 10px;
            margin: 5px 0;
            border-radius: 3px;
            font-size: 0.85em;
            color: #81c784;
        }
        
        .convergence {
            background: #3a2d4a;
            border: 2px dashed #ba68c8;
            padding: 10px;
            margin: 10px 0;
            border-radius: 3px;
            font-size: 0.85em;
            color: #ce93d8;
        }
        
        .weight-score {
            background: #1a2a1a;
            border-left: 4px solid #ffeb3b;
            padding: 12px;
            margin: 12px 0;
            border-radius: 4px;
            font-size: 0.9em;
            color: #fff59d;
            font-weight: bold;
        }
        
        .weight-breakdown {
            background: #0a0a1a;
            padding: 10px;
            margin-top: 8px;
            border-radius: 3px;
            font-size: 0.8em;
            color: #b3e5fc;
            font-family: monospace;
        }
        
        .weight-bar {
            display: inline-block;
            height: 20px;
            background: linear-gradient(90deg, #ffeb3b, #fdd835);
            border-radius: 3px;
            margin: 5px 0;
            min-width: 100px;
        }
        
        .weight-label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 Binary Evolution Tree: Field Merging & Discovery</h1>
        <p class="subtitle">How field attributes combine to reveal ALL computational possibilities</p>
        
        <div class="tree-container">
            <svg id="evolutionTree" width="1400" height="1200" viewBox="0 0 1400 1200">
                <defs>
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#424242"/>
                    </marker>
                </defs>
                
                <!-- Tree structure will be generated by JavaScript -->
            </svg>
        </div>
        
        <!-- Detail panels for each node -->
        <div id="detailContainer"></div>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-item level0">
                <strong>Level 0</strong><br/>Constants (Boundary)
            </div>
            <div class="legend-item level1">
                <strong>Level 1</strong><br/>Unary (Transform)
            </div>
            <div class="legend-item level2">
                <strong>Level 2</strong><br/>Binary (Decision)
            </div>
            <div class="legend-item level3">
                <strong>Level 3</strong><br/>Ternary (Voting)
            </div>
            <div class="legend-item merge">
                <strong>Merge</strong><br/>Field combination
            </div>
        </div>
    </div>

    <script>
        // === EVOLUTIONARY TREE: FIELD ATTRIBUTE MERGING ===
        
        // Define all nodes with their properties
        const nodes = {
            // Level 0: Constants
            'L0-CONST': {
                level: 0,
                x: 700,
                y: 100,
                label: 'CONSTANTS',
                sublabel: 'Boundary',
                fields: ['Determinism', 'Polarity', 'Stateless'],
                capabilities: ['Initialize state'],
                mustUse: ['Set known initial conditions', 'Define boundary values'],
                canUse: ['Pull-up/pull-down resistances', 'Default states', 'Sentinel values'],
                weight: {
                    fundamentality: 1.0,        // Most fundamental (level 0)
                    useDensity: 0.6,            // 2 required uses
                    convergence: 0,             // No inputs
                    downstream: 1.0,            // Feeds all level 1
                    uniqueness: 0.8             // Irreplaceable role
                },
                color: '#ff9800'
            },
            
            // Level 1: Unary - branches from Constants
            'L1-IDENTITY': {
                level: 1,
                x: 500,
                y: 250,
                label: 'IDENTITY',
                sublabel: 'Pass-through',
                fields: ['Involution', 'Polarity', 'Stateless'],
                capabilities: ['Signal propagation'],
                mustUse: ['Route signals without transformation', 'Preserve logic state'],
                canUse: ['Buffering', 'Impedance matching', 'Delay elements', 'Fan-out'],
                weight: {
                    fundamentality: 0.95,
                    useDensity: 0.5,
                    convergence: 1.0,           // 1 input source
                    downstream: 0.7,            // Used in binary ops
                    uniqueness: 0.6             // NOT is more critical
                },
                mergeFrom: ['L0-CONST'],
                color: '#2196f3'
            },
            'L1-NOT': {
                level: 1,
                x: 700,
                y: 250,
                label: 'NOT',
                sublabel: 'Invert',
                fields: ['Involution', 'Polarity flip', 'Stateless'],
                capabilities: ['Signal inversion'],
                mustUse: ['Invert control signals', 'Create complementary outputs'],
                canUse: ['Enable/disable toggling', 'Active-low signals', 'Edge detection (with delay)'],
                weight: {
                    fundamentality: 0.98,
                    useDensity: 0.7,
                    convergence: 1.0,
                    downstream: 0.95,           // Used in most higher functions
                    uniqueness: 0.95            // Critical for completeness
                },
                mergeFrom: ['L0-CONST'],
                color: '#2196f3'
            },
            
            // Level 2: Binary - merges of Level 1 pairs
            'L2-AND': {
                level: 2,
                x: 300,
                y: 400,
                label: 'AND',
                sublabel: 'Combine',
                fields: ['Symmetry', 'Completeness', 'Conjunction'],
                capabilities: ['Both conditions', 'Merge two signals'],
                mustUse: ['Require both inputs true', 'Guard logic', 'Enable only when safe'],
                canUse: ['Interrupt masking', 'Two-key activation', 'Conditional execution', 'Safe-shutdown verify'],
                mergeFrom: ['L1-IDENTITY', 'L1-NOT'],
                discovery: 'Functional completeness class emerges',
                convergence: 'AND + NOT = NOR (universal gate alternative)',
                color: '#4caf50'
            },
            'L2-OR': {
                level: 2,
                x: 500,
                y: 400,
                label: 'OR',
                sublabel: 'Alternate',
                fields: ['Symmetry', 'Disjunction', 'Commutativity'],
                capabilities: ['Either condition', 'Signal routing'],
                mustUse: ['Accept either input', 'Priority multiplexing', 'Fault tolerance'],
                canUse: ['Interrupt aggregation', 'Fallback logic', 'Multi-source activation', 'Error recovery'],
                mergeFrom: ['L1-IDENTITY', 'L1-NOT'],
                discovery: 'Disjunctive logic emerges',
                convergence: 'OR + NOT = NAND (universal gate alternative)',
                color: '#4caf50'
            },
            'L2-XOR': {
                level: 2,
                x: 700,
                y: 400,
                label: 'XOR',
                sublabel: 'Difference',
                fields: ['Symmetry', 'Parity check', 'Self-dual'],
                capabilities: ['Equality test', 'Difference detection'],
                mustUse: ['Detect when inputs differ', 'Parity checking', 'Error detection'],
                canUse: ['Crypto bit mixing', 'Comparators', 'Change detection', 'Hamming codes'],
                mergeFrom: ['L1-IDENTITY', 'L1-NOT'],
                discovery: 'Parity operations emerge',
                convergence: 'XOR + XOR = Identity (chaining effect)',
                color: '#4caf50'
            },
            'L2-IMPLIES': {
                level: 2,
                x: 900,
                y: 400,
                label: 'IMPLIES',
                sublabel: 'Conditional',
                fields: ['Asymmetry', 'Directionality', 'Causality'],
                capabilities: ['Conditional logic', 'One-way dependency'],
                mustUse: ['If A then B', 'State machine transitions', 'Dependency chains'],
                canUse: ['Implication rules', 'Constraint satisfaction', 'Temporal logic', 'Protocol sequencing'],
                mergeFrom: ['L1-IDENTITY', 'L1-NOT'],
                discovery: 'Directional relationships emerge',
                convergence: 'IMPLIES + IMPLIES = AND (chained conditions)',
                color: '#4caf50'
            },
            
            // Level 3: Ternary - merges of Level 2 combinations
            'L3-MAJORITY': {
                level: 3,
                x: 300,
                y: 550,
                label: 'MAJORITY',
                sublabel: 'Voting',
                fields: ['Symmetry+', 'Consensus', 'Redundancy'],
                capabilities: ['Vote (2-of-3)', 'Error tolerance'],
                mustUse: ['Fault-tolerant systems', 'Error correction', 'Consensus building'],
                canUse: ['Triple modular redundancy', 'Sensor voting', 'Byzantine fault tolerance', 'Reliability'],
                mergeFrom: ['L2-AND', 'L2-OR'],
                discovery: 'Consensus voting emerges',
                convergence: 'MAJORITY used for: Fault tolerance OR Consensus = Same use case via different fields',
                color: '#9c27b0'
            },
            'L3-MULT': {
                level: 3,
                x: 500,
                y: 550,
                label: 'MULTIPLEXER',
                sublabel: 'Select',
                fields: ['Asymmetry+', 'Selection', 'Routing'],
                capabilities: ['Select 1 of many', 'Conditional routing'],
                mustUse: ['Choose among options', 'Resource allocation', 'Channel switching'],
                canUse: ['Interrupt prioritization', 'Bus arbitration', 'Memory addressing', 'I/O routing'],
                mergeFrom: ['L2-OR', 'L2-IMPLIES'],
                discovery: 'Selection primitives emerge',
                convergence: 'MULTIPLEXER = (OR-based selection) OR (IMPLIES-based conditional) = Same result',
                color: '#9c27b0'
            },
            'L3-ADDER': {
                level: 3,
                x: 700,
                y: 550,
                label: 'FULL ADDER',
                sublabel: 'Arithmetic',
                fields: ['Asymmetry+', 'Carry', 'Composition'],
                capabilities: ['Add bits with carry', 'Arithmetic begins'],
                mustUse: ['Integer arithmetic', 'Accumulation', 'Counting'],
                canUse: ['Subtraction (via negation)', 'Multiplication (via addition chain)', 'Coordinate arithmetic'],
                mergeFrom: ['L2-XOR', 'L2-AND', 'L2-OR'],
                discovery: 'Arithmetic operations emerge',
                convergence: 'FULL ADDER builds Ripple-carry OR Lookahead carry = Different field paths, same addition',
                color: '#9c27b0'
            },
            'L3-CUSTOM': {
                level: 3,
                x: 900,
                y: 550,
                label: 'CUSTOM-256',
                sublabel: 'Any function',
                fields: ['All fields', 'Complete', 'Arbitrary'],
                capabilities: ['Any 3-input truth table'],
                mustUse: ['Universal 3-input computation'],
                canUse: ['Any specialized 3-input logic', 'Domain-specific circuits'],
                mergeFrom: ['L2-AND', 'L2-OR', 'L2-XOR', 'L2-IMPLIES'],
                discovery: 'All 256 ternary functions possible',
                convergence: 'Any 3-input function CAN be built from: {AND+NOT} OR {OR+NOT} OR {MAJORITY+XOR} = Functional equivalence classes',
                color: '#9c27b0'
            }
        };
        
        // Define edges (connections showing merges and evolution)
        const edges = [
            // Level 0 to Level 1
            { from: 'L0-CONST', to: 'L1-IDENTITY', type: 'branch' },
            { from: 'L0-CONST', to: 'L1-NOT', type: 'branch' },
            
            // Level 1 to Level 2
            { from: 'L1-IDENTITY', to: 'L2-AND', type: 'merge' },
            { from: 'L1-NOT', to: 'L2-AND', type: 'merge' },
            { from: 'L1-IDENTITY', to: 'L2-OR', type: 'merge' },
            { from: 'L1-NOT', to: 'L2-OR', type: 'merge' },
            { from: 'L1-IDENTITY', to: 'L2-XOR', type: 'merge' },
            { from: 'L1-NOT', to: 'L2-XOR', type: 'merge' },
            { from: 'L1-IDENTITY', to: 'L2-IMPLIES', type: 'merge' },
            { from: 'L1-NOT', to: 'L2-IMPLIES', type: 'merge' },
            
            // Level 2 to Level 3
            { from: 'L2-AND', to: 'L3-MAJORITY', type: 'merge' },
            { from: 'L2-OR', to: 'L3-MAJORITY', type: 'merge' },
            { from: 'L2-OR', to: 'L3-MULT', type: 'merge' },
            { from: 'L2-IMPLIES', to: 'L3-MULT', type: 'merge' },
            { from: 'L2-XOR', to: 'L3-ADDER', type: 'merge' },
            { from: 'L2-AND', to: 'L3-ADDER', type: 'merge' },
            { from: 'L2-OR', to: 'L3-ADDER', type: 'merge' },
            { from: 'L2-AND', to: 'L3-CUSTOM', type: 'merge' },
            { from: 'L2-OR', to: 'L3-CUSTOM', type: 'merge' },
            { from: 'L2-XOR', to: 'L3-CUSTOM', type: 'merge' },
            { from: 'L2-IMPLIES', to: 'L3-CUSTOM', type: 'merge' }
        ];
        
        // Render tree
        const svg = document.getElementById('evolutionTree');
        
        // Draw edges first (behind nodes)
        edges.forEach(edge => {
            const fromNode = nodes[edge.from];
            const toNode = nodes[edge.to];
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const d = `M ${fromNode.x} ${fromNode.y + 20} L ${toNode.x} ${toNode.y - 20}`;
            line.setAttribute('d', d);
            line.setAttribute('class', `edge ${edge.type}`);
            svg.appendChild(line);
        });
        
        // Draw nodes
        Object.entries(nodes).forEach(([id, node]) => {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('class', 'node-group');
            group.setAttribute('data-node', id);
            
            // Circle
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', node.x);
            circle.setAttribute('cy', node.y);
            circle.setAttribute('r', '35');
            circle.setAttribute('class', 'node-circle');
            circle.setAttribute('fill', node.color || '#1a1f2e');
            group.appendChild(circle);
            
            // Label
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', node.x);
            label.setAttribute('y', node.y - 5);
            label.setAttribute('class', 'node-label');
            label.textContent = node.label;
            group.appendChild(label);
            
            // Sublabel
            const sublabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            sublabel.setAttribute('x', node.x);
            sublabel.setAttribute('y', node.y + 12);
            sublabel.setAttribute('class', 'node-sublabel');
            sublabel.textContent = node.sublabel;
            group.appendChild(sublabel);
            
            // Click handler
            group.addEventListener('click', () => showDetail(id, node));
            
            svg.appendChild(group);
        });
        
        function showDetail(nodeId, node) {
            // Hide all panels
            document.querySelectorAll('.detail-panel').forEach(p => p.classList.remove('active'));
            
            // Create/show panel for this node
            let panel = document.getElementById(`panel-${nodeId}`);
            if (!panel) {
                panel = document.createElement('div');
                panel.id = `panel-${nodeId}`;
                panel.className = 'detail-panel';
                
                let html = `
                    <div class="detail-title">${node.label} (Level ${node.level})</div>
                    <div class="detail-content">
                        <div style="margin-bottom: 15px;">${node.sublabel}</div>
                        
                        <div class="field-attributes">
                            <strong>Field Attributes:</strong><br/>
                            ${node.fields.join(' + ')}
                        </div>
                        
                        <div class="emergent">
                            <strong>Capabilities:</strong><br/>
                            ${node.capabilities.join(' | ')}
                        </div>
                        
                        ${node.mustUse ? `
                        <div class="mustuse">
                            <strong>HAS TO be used for:</strong><br/>
                            ${node.mustUse.map(u => '• ' + u).join('<br/>')}
                        </div>
                        ` : ''}
                        
                        ${node.canUse ? `
                        <div class="canuse">
                            <strong>CAN be used for:</strong><br/>
                            ${node.canUse.map(u => '• ' + u).join('<br/>')}
                        </div>
                        ` : ''}
                `;
                
                if (node.mergeFrom && node.mergeFrom.length > 0) {
                    html += `
                        <div class="merges">
                            <strong>Merges from:</strong><br/>
                            ${node.mergeFrom.map(id => nodes[id].label).join(' + ')}
                        </div>
                    `;
                }
                
                if (node.discovery) {
                    html += `
                        <div class="discovery">
                            <strong>✨ Discovery:</strong><br/>
                            ${node.discovery}
                        </div>
                    `;
                }
                
                if (node.convergence) {
                    html += `
                        <div class="convergence">
                            <strong>🔄 Convergence (Different paths, same result):</strong><br/>
                            ${node.convergence}
                        </div>
                    `;
                }
                
                html += `</div>`;
                panel.innerHTML = html;
                document.getElementById('detailContainer').appendChild(panel);
            }
            
            panel.classList.add('active');
        }
        
        // Show first node by default
        showDetail('L3-CUSTOM', nodes['L3-CUSTOM']);
    </script>
</body>
</html>
