<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow — The Field Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e6ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .workspace {
            width: 90%;
            max-width: 1200px;
            height: 90vh;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 20px;
            background: rgba(10, 14, 39, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        /* LEFT PANEL - Primitive Activation */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .left-panel h3 {
            color: #00d4ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .primitive-group {
            background: rgba(45, 55, 72, 0.5);
            border-left: 2px solid #4a5568;
            padding: 12px;
            border-radius: 4px;
        }

        .primitive-group.active {
            background: rgba(124, 58, 237, 0.15);
            border-left-color: #7c3aed;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.2);
        }

        .primitive-name {
            font-size: 0.85em;
            color: #a0aec0;
            margin-bottom: 4px;
        }

        .primitive-value {
            font-size: 1em;
            color: #00d4ff;
            font-weight: bold;
        }

        /* CENTER - AVATAR ENTITY */
        .avatar-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .glow-field {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .glow-aura {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, rgba(124, 58, 237, 0.1) 100%);
            animation: breathe 4s ease-in-out infinite;
            filter: blur(20px);
        }

        .glow-aura.active {
            animation: pulse-intense 0.5s ease-out, breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.9; }
        }

        @keyframes pulse-intense {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .avatar-core {
            position: relative;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #00d4ff, #7c3aed);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.6), inset 0 0 40px rgba(124, 58, 237, 0.3);
        }

        .avatar-core.thinking {
            animation: thinking 0.5s ease-in-out;
        }

        @keyframes thinking {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .avatar-eye {
            position: absolute;
            width: 20px;
            height: 20px;
            background: #0a0e27;
            border-radius: 50%;
            top: 35px;
        }

        .avatar-eye.left {
            left: 30px;
        }

        .avatar-eye.right {
            right: 30px;
        }

        .avatar-pupil {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            top: 6px;
            left: 6px;
            animation: pupil-look 2s ease-in-out infinite;
        }

        @keyframes pupil-look {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(3px, -2px); }
            50% { transform: translate(-2px, 3px); }
            75% { transform: translate(2px, -3px); }
        }

        .floating-primitive {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6em;
            font-weight: bold;
            animation: orbit 8s linear infinite;
        }

        @keyframes orbit {
            0% { transform: rotate(0deg) translateX(160px) rotate(0deg); opacity: 0.7; }
            50% { opacity: 0.9; }
            100% { transform: rotate(360deg) translateX(160px) rotate(-360deg); opacity: 0.7; }
        }

        .status-text {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95em;
            color: #cbd5e0;
            min-height: 60px;
        }

        .query-input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="text"] {
            padding: 12px;
            background: rgba(45, 55, 72, 0.7);
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: #e0e6ff;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95em;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
        }

        button {
            padding: 12px;
            background: linear-gradient(135deg, #00d4ff, #7c3aed);
            color: #0a0e27;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        /* RIGHT PANEL - Response & Coherence */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .right-panel h3 {
            color: #00d4ff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .response-box {
            background: rgba(45, 55, 72, 0.5);
            border-left: 2px solid #7c3aed;
            padding: 15px;
            border-radius: 4px;
            line-height: 1.6;
            color: #cbd5e0;
            min-height: 120px;
        }

        .coherence-meter {
            background: rgba(45, 55, 72, 0.5);
            padding: 15px;
            border-radius: 4px;
            border-left: 2px solid #00d4ff;
        }

        .coherence-label {
            font-size: 0.85em;
            color: #a0aec0;
            margin-bottom: 8px;
        }

        .coherence-bar {
            width: 100%;
            height: 20px;
            background: rgba(30, 35, 50, 0.8);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .coherence-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7c3aed);
            width: 0%;
            transition: width 0.6s ease-out;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .coherence-percent {
            text-align: center;
            margin-top: 8px;
            font-size: 0.9em;
            color: #00d4ff;
            font-weight: bold;
        }

        .ledger-box {
            background: rgba(45, 55, 72, 0.5);
            padding: 12px;
            border-radius: 4px;
            border-left: 2px solid #4a5568;
            max-height: 200px;
            overflow-y: auto;
            flex: 1;
        }

        .ledger-entry {
            font-size: 0.8em;
            color: #a0aec0;
            margin-bottom: 6px;
            padding: 4px;
            border-left: 2px solid rgba(0, 212, 255, 0.2);
            padding-left: 8px;
        }

        .ledger-entry.new {
            color: #00d4ff;
            border-left-color: #00d4ff;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 212, 255, 0.5);
        }
    </style>
</head>
<body>
    <div class="workspace">
        <!-- LEFT PANEL: Activated Primitives -->
        <div class="left-panel">
            <h3>Field Activation</h3>
            <div id="primitives-list"></div>
        </div>

        <!-- CENTER: Avatar Entity -->
        <div class="avatar-container">
            <div class="glow-field">
                <div class="glow-aura"></div>
                <div class="avatar-core">
                    <div class="avatar-eye left">
                        <div class="avatar-pupil"></div>
                    </div>
                    <div class="avatar-eye right">
                        <div class="avatar-pupil"></div>
                    </div>
                </div>
                <div id="orbit-primitives"></div>
            </div>

            <div class="status-text" id="status">Ready to listen...</div>

            <div class="query-input-area">
                <input type="text" id="query-input" placeholder="Ask me something..." />
                <button onclick="sendQuery()">Query the Field</button>
            </div>
        </div>

        <!-- RIGHT PANEL: Response & Coherence -->
        <div class="right-panel">
            <h3>Response Field</h3>
            <div class="response-box" id="response-box">
                Awaiting your question...
            </div>

            <div class="coherence-meter">
                <div class="coherence-label">Field Coherence</div>
                <div class="coherence-bar">
                    <div class="coherence-fill" id="coherence-fill" style="width: 30%"></div>
                </div>
                <div class="coherence-percent" id="coherence-percent">30%</div>
            </div>

            <h3 style="margin-top: 20px;">Ledger</h3>
            <div class="ledger-box" id="ledger-box"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:5555";
        let ledgerEntries = [];

        // Initialize with orbit primitives
        function initOrbitPrimitives() {
            const prims = ['AGENT', 'MEANING', 'COHERENCE', 'CHOICE', 'GROUNDING'];
            const colors = ['#00d4ff', '#7c3aed', '#00ff88', '#ffaa00', '#ff0080'];
            const orbitContainer = document.getElementById('orbit-primitives');
            
            prims.forEach((prim, i) => {
                const angle = (360 / prims.length) * i;
                const el = document.createElement('div');
                el.className = 'floating-primitive';
                el.textContent = prim[0];
                el.style.borderColor = colors[i];
                el.style.color = colors[i];
                el.style.animationDelay = `${i * 0.4}s`;
                el.style.transform = `rotate(${angle}deg) translateX(160px) rotate(${-angle}deg)`;
                orbitContainer.appendChild(el);
            });
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            
            if (!query) return;

            // Animate avatar thinking
            document.querySelector('.avatar-core').classList.add('thinking');
            document.querySelector('.glow-aura').classList.add('active');
            document.getElementById('status').textContent = 'Listening to the field...';

            try {
                const response = await fetch(`${BASE_URL}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Update response
                    document.getElementById('response-box').textContent = data.response || 'No response';
                    
                    // Update coherence
                    const coherence = Math.round((data.coherence || 0) * 100);
                    document.getElementById('coherence-fill').style.width = coherence + '%';
                    document.getElementById('coherence-percent').textContent = coherence + '%';
                    
                    // Update primitives
                    updatePrimitivesList(data.primitives || []);
                    
                    // Add to ledger
                    addLedgerEntry(query, data.response, coherence);
                    
                    document.getElementById('status').textContent = `Field: ${coherence}% coherent`;
                    
                    input.value = '';
                }
            } catch (e) {
                document.getElementById('status').textContent = `Error: ${e.message}`;
            }

            document.querySelector('.avatar-core').classList.remove('thinking');
            setTimeout(() => {
                document.querySelector('.glow-aura').classList.remove('active');
            }, 500);
        }

        function updatePrimitivesList(primitives) {
            const list = document.getElementById('primitives-list');
            list.innerHTML = '';
            
            primitives.slice(0, 5).forEach(prim => {
                const el = document.createElement('div');
                el.className = 'primitive-group active';
                el.innerHTML = `
                    <div class="primitive-name">${prim}</div>
                    <div class="primitive-value">●</div>
                `;
                list.appendChild(el);
            });
        }

        function addLedgerEntry(query, response, coherence) {
            const entry = {
                timestamp: new Date().toLocaleTimeString(),
                query: query.substring(0, 40) + (query.length > 40 ? '...' : ''),
                coherence
            };
            
            ledgerEntries.unshift(entry);
            if (ledgerEntries.length > 10) ledgerEntries.pop();
            
            const ledger = document.getElementById('ledger-box');
            ledger.innerHTML = ledgerEntries.map(e => 
                `<div class="ledger-entry new">${e.timestamp} | ${e.query} | ${e.coherence}%</div>`
            ).join('');
        }

        // Allow Enter key to send query
        document.getElementById('query-input').addEventListener('keypress', e => {
            if (e.key === 'Enter') sendQuery();
        });

        // Initialize
        initOrbitPrimitives();
    </script>
</body>
</html>
