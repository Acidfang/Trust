<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Field Encyclopedia — Field Navigation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            background: #000a0a;
        }

        #svg-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Info panel that appears on click */
        #info-panel {
            position: fixed;
            right: -400px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: linear-gradient(to bottom, rgba(10, 10, 30, 0.98), rgba(5, 5, 15, 0.98));
            border-left: 2px solid #00ddff;
            overflow-y: auto;
            padding: 30px;
            transition: right 0.4s ease;
            z-index: 1000;
        }

        #info-panel.open {
            right: 0;
        }

        #info-panel h2 {
            color: #00ddff;
            margin-bottom: 15px;
            font-size: 1.6em;
            border-bottom: 1px solid #00ddff;
            padding-bottom: 10px;
        }

        #info-panel p {
            color: #88ff00;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        #info-panel .attribute {
            background: rgba(0, 221, 255, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #00ddff;
            color: #00ff88;
            font-size: 0.9em;
        }

        #close-panel {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 28px;
            color: #00ddff;
            cursor: pointer;
            background: none;
            border: none;
            transition: all 0.2s ease;
        }

        #close-panel:hover {
            color: #ff0088;
            transform: scale(1.2);
        }

        .breadcrumb {
            position: fixed;
            top: 10px;
            left: 10px;
            color: #88ff00;
            font-size: 12px;
            text-shadow: 0 0 5px #00ddff;
            z-index: 100;
            max-width: 60%;
        }

        .breadcrumb a {
            color: #00ddff;
            cursor: pointer;
            text-decoration: underline;
            margin: 0 5px;
        }

        .breadcrumb a:hover {
            color: #ff00ff;
        }

        /* Scroll bar for info panel */
        #info-panel::-webkit-scrollbar {
            width: 8px;
        }

        #info-panel::-webkit-scrollbar-track {
            background: rgba(0, 221, 255, 0.1);
        }

        #info-panel::-webkit-scrollbar-thumb {
            background: #00ddff;
            border-radius: 4px;
        }

        #info-panel::-webkit-scrollbar-thumb:hover {
            background: #00ff88;
        }

        .loading {
            position: fixed;
            bottom: 20px;
            right: 20px;
            color: #00ff88;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .loading.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Main SVG Canvas -->
    <svg id="svg-canvas"></svg>

    <!-- Info Panel for Entity Details -->
    <div id="info-panel">
        <button id="close-panel">✕</button>
        <div id="panel-content">
            <p>Click any node to explore</p>
        </div>
    </div>

    <!-- Breadcrumb Navigation -->
    <div class="breadcrumb" id="breadcrumb">
        Encyclopedia
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loading">⚡ Loading...</div>

    <script>
        const CONFIG = {
            API_BASE: 'http://localhost:5000',
            INITIAL_ENTITY: 'Water Molecule',
            PANEL_WIDTH: 400,
        };

        class FieldEncyclopedia {
            constructor() {
                this.currentEntity = null;
                this.navigationHistory = [];
                this.svgContainer = document.getElementById('svg-canvas');
                this.infoPanel = document.getElementById('info-panel');
                this.panelContent = document.getElementById('panel-content');
                this.breadcrumb = document.getElementById('breadcrumb');
                this.loading = document.getElementById('loading');
                
                this.init();
                this.setupEventListeners();
            }

            init() {
                // Load initial entity
                this.navigateTo(CONFIG.INITIAL_ENTITY);
            }

            setupEventListeners() {
                // Close panel button
                document.getElementById('close-panel').addEventListener('click', () => {
                    this.infoPanel.classList.remove('open');
                });

                // Handle hash changes
                window.addEventListener('hashchange', () => {
                    const entityName = this.getEntityFromURL();
                    if (entityName) {
                        this.navigateTo(entityName);
                    }
                });

                // Spider node click delegation
                document.addEventListener('click', (event) => {
                    const node = event.target.closest('[data-entity]');
                    if (node && document.getElementById('svg-canvas').contains(node)) {
                        const entityName = node.getAttribute('data-entity');
                        this.navigateTo(entityName);
                    }
                });

                // Escape key to close panel
                document.addEventListener('keydown', (event) => {
                    if (event.key === 'Escape') {
                        this.infoPanel.classList.remove('open');
                    }
                });
            }

            async navigateTo(entityName) {
                this.showLoading(true);
                
                try {
                    // Update URL
                    window.location.hash = `entity/${encodeURIComponent(entityName)}`;

                    // Fetch spider SVG and entity data in parallel
                    const [spiderResponse, entityResponse] = await Promise.all([
                        fetch(`${CONFIG.API_BASE}/api/spider/${encodeURIComponent(entityName)}`),
                        fetch(`${CONFIG.API_BASE}/api/entity/${encodeURIComponent(entityName)}`)
                    ]);

                    if (!spiderResponse.ok || !entityResponse.ok) {
                        throw new Error('Failed to fetch data');
                    }

                    const spiderSVG = await spiderResponse.text();
                    const entityData = await entityResponse.json();

                    // Update current entity
                    this.currentEntity = entityName;
                    this.navigationHistory.push(entityName);

                    // Render spider in canvas
                    this.renderSpider(spiderSVG);

                    // Update breadcrumb
                    this.updateBreadcrumb();

                    // Update info panel with entity details
                    this.updateInfoPanel(entityData);

                } catch (error) {
                    console.error('Navigation error:', error);
                    this.showError(entityName, error);
                }

                this.showLoading(false);
            }

            renderSpider(svgContent) {
                // Extract SVG content and inject into canvas
                const parser = new DOMParser();
                const svgDoc = parser.parseFromString(svgContent, 'image/svg+xml');
                
                // Get the SVG element
                const newSVG = svgDoc.documentElement;

                // Clear container and append new SVG
                this.svgContainer.innerHTML = '';
                
                // Copy SVG content
                const allChildren = Array.from(newSVG.childNodes);
                allChildren.forEach(child => {
                    this.svgContainer.appendChild(child.cloneNode(true));
                });

                // Update SVG to fill viewport
                this.svgContainer.setAttribute('viewBox', '0 0 1000 1000');
                this.svgContainer.setAttribute('preserveAspectRatio', 'xMidYMid slice');

                // Re-attach event listeners after SVG update
                this.attachSpiderListeners();
            }

            attachSpiderListeners() {
                // Event delegation for spider nodes in SVG
                this.svgContainer.addEventListener('click', (event) => {
                    const node = event.target.closest('[data-entity]');
                    if (node) {
                        const entityName = node.getAttribute('data-entity');
                        this.navigateTo(entityName);
                    }
                });
            }

            updateInfoPanel(entityData) {
                const html = `
                    <h2>${entityData.name}</h2>
                    <p>${entityData.description || 'No description available'}</p>
                    
                    ${entityData.attributes ? `
                        <div style="margin-top: 20px;">
                            <h3 style="color: #00ff88; margin-bottom: 10px;">Properties</h3>
                            ${Object.entries(entityData.attributes)
                                .map(([key, value]) => `
                                    <div class="attribute">
                                        <strong>${key}:</strong> ${value}
                                    </div>
                                `)
                                .join('')}
                        </div>
                    ` : ''}

                    ${entityData.cascade ? `
                        <div style="margin-top: 20px;">
                            <h3 style="color: #88ff00; margin-bottom: 10px;">🕸️ Cascades</h3>
                            <p style="font-size: 0.85em; color: #00ddff;">Click colored nodes to explore cascades</p>
                        </div>
                    ` : ''}
                `;

                this.panelContent.innerHTML = html;
                this.infoPanel.classList.add('open');
            }

            updateBreadcrumb() {
                const history = this.navigationHistory.slice(-3); // Show last 3
                const breadcrumbHTML = history.map((entity, idx) => {
                    const isLast = idx === history.length - 1;
                    return isLast 
                        ? entity 
                        : `<a onclick="encyclopedia.navigateTo('${entity}')">${entity}</a>`;
                }).join(' > ');

                this.breadcrumb.innerHTML = breadcrumbHTML;
            }

            getEntityFromURL() {
                const hash = window.location.hash;
                const match = hash.match(/entity\/(.+)/);
                return match ? decodeURIComponent(match[1]) : null;
            }

            showLoading(show) {
                if (show) {
                    this.loading.classList.add('active');
                } else {
                    this.loading.classList.remove('active');
                }
            }

            showError(entityName, error) {
                this.panelContent.innerHTML = `
                    <h2 style="color: #ff0088;">⚠️ Error</h2>
                    <p>Could not load entity: <strong>${entityName}</strong></p>
                    <p style="color: #ff6666; font-size: 0.9em;">${error.message}</p>
                    <p style="margin-top: 20px; color: #88ff00;">Try clicking another node on the field.</p>
                `;
                this.infoPanel.classList.add('open');
            }
        }

        // Initialize Encyclopedia
        const encyclopedia = new FieldEncyclopedia();

        // Make accessible globally
        window.encyclopedia = encyclopedia;
    </script>
</body>
</html>
