<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Tracker - Multi-Platform Analysis Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --success: #16a34a;
            --warning: #ea580c;
            --danger: #dc2626;
            --bg: #0f172a;
            --bg-secondary: #1e293b;
            --text: #f1f5f9;
            --text-muted: #cbd5e1;
            --border: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1f3a 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid var(--border);
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #60a5fa, #93c5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1em;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* === CONTROL PANEL === */

        .control-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .control-panel h2 {
            font-size: 1.3em;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text);
            font-size: 0.95em;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            width: 100%;
            padding: 10px 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .platform-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .platform-checkbox {
            display: flex;
            align-items: center;
        }

        .platform-checkbox input[type="checkbox"] {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .platform-checkbox label {
            margin: 0;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95em;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
            flex: 0.5;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .status-display {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            margin-right: 10px;
            font-size: 0.85em;
        }

        .status-queued {
            background: rgba(234, 88, 12, 0.2);
            color: #fbbf24;
        }

        .status-scraping {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
        }

        .status-analyzing {
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
        }

        .status-complete {
            background: rgba(22, 163, 74, 0.2);
            color: #86efac;
        }

        .status-error {
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
        }

        /* === RESULTS SECTION === */

        .results-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
        }

        .results-section h2 {
            font-size: 1.3em;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar-wrapper {
            background: var(--bg);
            border-radius: 10px;
            height: 30px;
            border: 1px solid var(--border);
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.9em;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .result-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            border-color: var(--primary);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.1);
        }

        .result-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .platform-name {
            font-size: 1.3em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #60a5fa;
        }

        .result-status {
            font-size: 0.9em;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .result-status.success {
            background: rgba(22, 163, 74, 0.2);
            color: #86efac;
        }

        .result-status.error {
            background: rgba(220, 38, 38, 0.2);
            color: #fca5a5;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.95em;
        }

        .metric:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--text-muted);
        }

        .metric-value {
            font-weight: 600;
            color: var(--text);
        }

        .variations-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }

        .variations-section h4 {
            color: #60a5fa;
            margin-bottom: 10px;
            font-size: 0.95em;
            text-transform: uppercase;
        }

        .variation-chip {
            display: inline-block;
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 6px 12px;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 0.85em;
        }

        .summary-section {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .summary-stat {
            text-align: center;
        }

        .summary-stat-value {
            font-size: 2em;
            font-weight: 700;
            color: #60a5fa;
        }

        .summary-stat-label {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .export-section {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-export {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-export:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        /* === LOADING SPINNER === */

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(37, 99, 235, 0.3);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === TOOLTIPS === */

        [data-tooltip] {
            position: relative;
            cursor: help;
        }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            white-space: nowrap;
            font-size: 0.85em;
            border: 1px solid var(--border);
            z-index: 1000;
        }

        /* === RESPONSIVE === */

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            .main-grid {
                gap: 20px;
            }

            .control-panel {
                position: relative;
                top: 0;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .platform-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⊙ Universal Tracker</h1>
            <p class="subtitle">Multi-Platform Post & Comment Analysis</p>
        </header>

        <div class="main-grid">
            <!-- Control Panel -->
            <div class="control-panel">
                <h2>Search Configuration</h2>

                <div class="form-group">
                    <label>Query / Topic</label>
                    <input 
                        type="text" 
                        id="queryInput" 
                        placeholder="e.g., 'AI ethics', 'climate change'"
                        value=""
                    >
                </div>

                <div class="form-group">
                    <label>Results Limit per Platform</label>
                    <input 
                        type="number" 
                        id="limitInput" 
                        min="1" 
                        max="500" 
                        value="100"
                    >
                </div>

                <div class="form-group">
                    <label>Platforms to Scrape</label>
                    <div class="platform-list" id="platformList"></div>
                </div>

                <div class="button-group">
                    <button class="btn-primary" id="startButton" onclick="startScrape()">
                        ▶ Start Analysis
                    </button>
                </div>

                <div class="status-display" id="statusDisplay" style="display: none;">
                    <div id="statusContent"></div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2>Results & Analysis</h2>
                <div id="resultsContainer">
                    <div class="empty-state">
                        <p>👇 Select platforms and start scraping to see results</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:5000";
        let currentJobId = null;
        let pollInterval = null;

        // ============================================================
        // INITIALIZATION
        // ============================================================

        async function initializeDashboard() {
            await loadPlatforms();
            setupEventListeners();
        }

        async function loadPlatforms() {
            try {
                const response = await fetch(`${API_BASE}/api/platforms`);
                const data = await response.json();
                
                const platformList = document.getElementById("platformList");
                const ready = data.ready || [];
                
                ready.forEach(platform => {
                    const div = document.createElement("div");
                    div.className = "platform-checkbox";
                    div.innerHTML = `
                        <input type="checkbox" id="platform_${platform}" value="${platform}">
                        <label for="platform_${platform}">${platform.toUpperCase()}</label>
                    `;
                    platformList.appendChild(div);
                });
                
                // Check first 2 by default
                document.getElementById("platform_twitter")?.click?.();
                document.getElementById("platform_reddit")?.click?.();
                
            } catch (error) {
                console.error("Error loading platforms:", error);
            }
        }

        function setupEventListeners() {
            document.getElementById("startButton").addEventListener("click", startScrape);
        }

        // ============================================================
        // SCRAPING
        // ============================================================

        async function startScrape() {
            const query = document.getElementById("queryInput").value.trim();
            const limit = parseInt(document.getElementById("limitInput").value);
            
            // Get selected platforms
            const platformCheckboxes = document.querySelectorAll("#platformList input[type='checkbox']:checked");
            const platforms = Array.from(platformCheckboxes).map(cb => cb.value);
            
            // Validation
            if (!query) {
                alert("Please enter a query");
                return;
            }
            
            if (platforms.length === 0) {
                alert("Please select at least one platform");
                return;
            }
            
            // Disable button
            const startButton = document.getElementById("startButton");
            startButton.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE}/api/scrape`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ platforms, query, limit })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentJobId = data.job_id;
                    startPolling();
                    showStatus("Scraping started...", "scraping");
                } else {
                    alert("Error: " + data.error);
                    startButton.disabled = false;
                }
            } catch (error) {
                console.error("Error starting scrape:", error);
                alert("Error: " + error.message);
                startButton.disabled = false;
            }
        }

        // ============================================================
        // POLLING
        // ============================================================

        function startPolling() {
            // Poll every 2 seconds
            pollInterval = setInterval(async () => {
                try {
                    const statusResponse = await fetch(`${API_BASE}/api/status/${currentJobId}`);
                    const statusData = await statusResponse.json();
                    
                    updateStatus(statusData);
                    
                    if (statusData.status === "complete") {
                        clearInterval(pollInterval);
                        await loadResults(currentJobId);
                        document.getElementById("startButton").disabled = false;
                    } else if (statusData.status === "error") {
                        clearInterval(pollInterval);
                        showStatus("Error: " + statusData.error, "error");
                        document.getElementById("startButton").disabled = false;
                    }
                } catch (error) {
                    console.error("Polling error:", error);
                }
            }, 2000);
        }

        function updateStatus(statusData) {
            const statusDisplay = document.getElementById("statusDisplay");
            const statusContent = document.getElementById("statusContent");
            
            statusDisplay.style.display = "block";
            
            const statusBadge = document.createElement("span");
            statusBadge.className = `status-badge status-${statusData.status}`;
            statusBadge.textContent = statusData.status.toUpperCase();
            
            const progressText = document.createElement("div");
            progressText.style.marginTop = "10px";
            progressText.style.color = "var(--text-muted)";
            progressText.style.fontSize = "0.9em";
            progressText.textContent = `Progress: ${statusData.progress}%`;
            
            statusContent.innerHTML = "";
            statusContent.appendChild(statusBadge);
            statusContent.appendChild(progressText);
        }

        function showStatus(message, status) {
            const statusDisplay = document.getElementById("statusDisplay");
            const statusContent = document.getElementById("statusContent");
            
            statusDisplay.style.display = "block";
            
            const badgeClass = `status-badge status-${status}`;
            statusContent.innerHTML = `
                <span class="${badgeClass}">${status.toUpperCase()}</span>
                <div style="margin-top: 10px; color: var(--text-muted);">${message}</div>
            `;
        }

        // ============================================================
        // RESULTS DISPLAY
        // ============================================================

        async function loadResults(jobId) {
            try {
                // Load scraping results
                const resultsResponse = await fetch(`${API_BASE}/api/results/${jobId}`);
                const resultsData = await resultsResponse.json();
                
                // Load analysis
                const analysisResponse = await fetch(`${API_BASE}/api/analysis/${jobId}`);
                const analysisData = await analysisResponse.json();
                
                displayResults(resultsData, analysisData);
            } catch (error) {
                console.error("Error loading results:", error);
            }
        }

        function displayResults(resultsData, analysisData) {
            const resultsContainer = document.getElementById("resultsContainer");
            
            let html = "";
            
            // Summary
            html += `
                <div class="summary-section">
                    <div class="summary-stat">
                        <div class="summary-stat-value">${resultsData.total_posts}</div>
                        <div class="summary-stat-label">Posts Found</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${resultsData.total_comments}</div>
                        <div class="summary-stat-label">Comments</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${analysisData.platforms_analyzed}</div>
                        <div class="summary-stat-label">Platforms</div>
                    </div>
                </div>
            `;
            
            // Platform results
            html += `<div class="results-grid">`;
            
            for (const platform of resultsData.results || []) {
                const platformAnalysis = analysisData.platforms[platform.platform] || {};
                const coherenceScore = (platformAnalysis.metrics?.coherence_score || 0).toFixed(3);
                const variations = platformAnalysis.variations || {};
                
                html += `
                    <div class="result-card">
                        <div class="result-card-header">
                            <div class="platform-name">${platform.platform}</div>
                            <span class="result-status ${platform.status === 'success' ? 'success' : 'error'}">
                                ${platform.status}
                            </span>
                        </div>
                        
                        <div class="metric">
                            <span class="metric-label">Posts</span>
                            <span class="metric-value">${platform.posts}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Comments</span>
                            <span class="metric-value">${platform.comments}</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Compression</span>
                            <span class="metric-value">${(platformAnalysis.metrics?.compression_ratio || 0).toFixed(1)}:1</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Coverage</span>
                            <span class="metric-value">${((platformAnalysis.metrics?.coverage || 0) * 100).toFixed(1)}%</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">Coherence</span>
                            <span class="metric-value">${coherenceScore}</span>
                        </div>
                        
                        ${Object.keys(variations).length > 0 ? `
                            <div class="variations-section">
                                <h4>Response Patterns</h4>
                                <div>
                                    ${Object.values(variations).map(v => 
                                        `<span class="variation-chip">${v}</span>`
                                    ).join("")}
                                </div>
                            </div>
                        ` : ""}
                    </div>
                `;
            }
            
            html += `</div>`;
            
            // Export button
            html += `
                <div class="export-section">
                    <button class="btn-export" onclick="exportResults('${currentJobId}')">
                        ⬇ Export JSON
                    </button>
                </div>
            `;
            
            resultsContainer.innerHTML = html;
        }

        function exportResults(jobId) {
            window.location.href = `${API_BASE}/api/export/${jobId}`;
        }

        // ============================================================
        // STARTUP
        // ============================================================

        window.addEventListener("load", initializeDashboard);
    </script>
</body>
</html>
