name: Generate UPFM Wiki Images

on:
  push:
    branches:
      - main
    paths:
      - 'upfm_*.py'
      - 'generate_all_images.py'
      - '.github/workflows/generate-upfm-images.yml'
  workflow_dispatch:  # Allow manual trigger

jobs:
  generate-images:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pillow
      
      - name: Generate UPFM images
        run: |
          python generate_all_images.py
      
      - name: Check if images changed
        id: check-changes
        run: |
          if git diff --quiet wiki/images/upfm/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit generated images
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --global user.name "UPFM Image Generator"
          git config --global user.email "upfm-generator@github.local"
          git add wiki/images/upfm/*.png
          git commit -m "chore(images): Regenerate UPFM wiki images

Generated by GitHub Actions workflow.
All 20 images solved via ∂i/∂t = -∇Φ(x,y)

Images:
- 4 Foundation & Theory (electron, photon, proton, generic)
- 4 Forces (gravity scales and variations)
- 4 Cosmic Structures (galaxies, black holes, entropy)
- 4 Consciousness (different node counts and coupling)
- 4 Special Cases (resonances, convergence/propagation)

All images irreducibly native to UPFM, generated via gradient descent."
      
      - name: Push changes
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git push origin main
      
      - name: Print summary
        run: |
          echo "✓ Image generation complete"
          echo "  Images location: wiki/images/upfm/"
          echo "  Total images: 20"
          echo "  Status: $(if [ '${{ steps.check-changes.outputs.changed }}' = 'true' ]; then echo 'Updated & Committed'; else echo 'No changes'; fi)"
