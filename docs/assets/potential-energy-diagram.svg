<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="600" fill="#1a1a1a"/>
  
  <!-- Grid lines -->
  <g stroke="#333" stroke-width="1" stroke-dasharray="5,5">
    <line x1="100" y1="100" x2="100" y2="500"/>
    <line x1="900" y1="100" x2="900" y2="500"/>
    <line x1="100" y1="500" x2="900" y2="500"/>
  </g>
  
  <!-- Axes -->
  <line x1="80" y1="500" x2="900" y2="500" stroke="#666" stroke-width="2"/>
  <line x1="100" y1="520" x2="100" y2="80" stroke="#666" stroke-width="2"/>
  
  <!-- Arrow heads -->
  <polygon points="900,500 890,495 890,505" fill="#666"/>
  <polygon points="100,80 95,90 105,90" fill="#666"/>
  
  <!-- Labels -->
  <text x="920" y="510" font-size="16" fill="#aaa" font-family="Arial">Time / Complexity</text>
  <text x="20" y="100" font-size="16" fill="#aaa" font-family="Arial">Φ (Potential Energy)</text>
  
  <!-- Scaffolding Path (red line going up) -->
  <path d="M 150 480 Q 300 450 450 350 Q 600 250 750 100" 
        stroke="#ff4444" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="480" r="8" fill="#ff4444"/>
  <circle cx="750" cy="100" r="8" fill="#ff4444"/>
  
  <!-- Foundation Path (green line staying low) -->
  <path d="M 150 480 Q 300 470 450 450 Q 600 430 750 420" 
        stroke="#44ff44" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="480" r="8" fill="#44ff44"/>
  <circle cx="750" cy="420" r="8" fill="#44ff44"/>
  
  <!-- Collapse point indicator -->
  <circle cx="750" cy="100" r="20" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="760" y="70" font-size="14" fill="#ff4444" font-family="Arial" font-weight="bold">COLLAPSE</text>
  
  <!-- Stability indicator -->
  <circle cx="750" cy="420" r="20" fill="none" stroke="#44ff44" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="755" y="455" font-size="14" fill="#44ff44" font-family="Arial" font-weight="bold">STABLE</text>
  
  <!-- Labels on curves -->
  <text x="200" y="450" font-size="14" fill="#ff6666" font-family="Arial">Scaffolding</text>
  <text x="200" y="495" font-size="14" fill="#66ff66" font-family="Arial">Foundation</text>
  
  <!-- Legend box -->
  <rect x="50" y="20" width="300" height="80" fill="#222" stroke="#666" stroke-width="1" rx="5"/>
  <text x="70" y="45" font-size="14" fill="#aaa" font-family="Arial">Path 1: Help Systems</text>
  <line x1="60" y1="55" x2="90" y2="55" stroke="#ff4444" stroke-width="3"/>
  <text x="70" y="75" font-size="14" fill="#aaa" font-family="Arial">Path 2: Gate Passage</text>
  <line x1="60" y1="85" x2="90" y2="85" stroke="#44ff44" stroke-width="3"/>
</svg>