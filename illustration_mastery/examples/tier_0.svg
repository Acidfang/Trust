<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="1000" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .decision-point { fill: #8B0000; }
  .work-state { fill: #006400; }
  .primary-path { stroke: #333; stroke-width: 2; fill: none; }
  .loop-back { stroke: #cc6666; stroke-width: 2; stroke-dasharray: 5,5; fill: none; }
  text { font-family: Arial, sans-serif; }
</style>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
  <path d="M0,0 L0,6 L9,3 z" fill="#333" />
</marker>
<marker id="arrow-loop" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
  <path d="M0,0 L0,6 L9,3 z" fill="#cc6666" />
</marker>
</defs>
<text x="500.0" y="30" text-anchor="middle" font-size="22" font-weight="bold">
TIER 0 — Formation (Connection)
</text>
<g transform="translate(500.0, 100)">
  <circle r="30" class="decision-point" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.1</text>
  <text x="0" y="52" text-anchor="middle" font-size="10">Existence</text>
</g>
<g transform="translate(500.0, 200)">
  <circle r="31" class="work-state" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.2</text>
  <text x="0" y="53" text-anchor="middle" font-size="10">Difference</text>
</g>
<g transform="translate(500.0, 300)">
  <circle r="32" class="work-state" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.3</text>
  <text x="0" y="54" text-anchor="middle" font-size="10">Interaction</text>
</g>
<g transform="translate(500.0, 430)">
  <circle r="33" class="decision-point" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.4</text>
  <text x="0" y="55" text-anchor="middle" font-size="10">Recognition</text>
</g>
<g transform="translate(500.0, 560)">
  <circle r="32" class="decision-point" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.5</text>
  <text x="0" y="54" text-anchor="middle" font-size="10">Selection</text>
</g>
<g transform="translate(500.0, 690)">
  <circle r="34" class="work-state" />
  <text x="0" y="0" text-anchor="middle" dy="0.3em" fill="white" font-weight="bold">T0.6</text>
  <text x="0" y="56" text-anchor="middle" font-size="10">Initial Alignment</text>
</g>
<path d="M 500.0,135 L 500.0,164" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,236 L 500.0,263" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,337 L 500.0,392" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,468 L 500.0,523" class="primary-path" marker-end="url(#arrow)" />
<path d="M 500.0,597 L 500.0,651" class="primary-path" marker-end="url(#arrow)" />
</svg>