<svg viewBox="0 0 1400 1600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="pyramidGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1400" height="1600" fill="url(#pyramidGrad1)"/>
  
  <!-- Title -->
  <text x="700" y="50" font-size="32" fill="#ffffff" font-family="Arial" text-anchor="middle" font-weight="bold">The Comprehension Pyramid</text>
  <text x="700" y="80" font-size="13" fill="#888" font-family="Arial" text-anchor="middle">Tiered understanding: What you need to know at each level to succeed</text>
  
  <!-- TIER 1: FOUNDATION (Bottom - Widest) -->
  <polygon points="200,300 1200,300 1050,500 350,500" fill="#1a3a1a" stroke="#44ff44" stroke-width="3"/>
  
  <!-- Tier 1 Content -->
  <text x="700" y="330" font-size="16" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 1: FOUNDATION — What Help Systems Are and Why They Fail</text>
  
  <text x="250" y="365" font-size="12" fill="#66ff66" font-family="Arial" font-weight="bold">5 Help Systems:</text>
  <circle cx="260" cy="383" r="3" fill="#66ff66"/>
  <text x="275" y="387" font-size="10" fill="#aaa" font-family="Arial">Therapy, Coaching, Education, Parenting, Professional</text>
  
  <text x="250" y="410" font-size="12" fill="#66ff66" font-family="Arial" font-weight="bold">Core Pattern:</text>
  <circle cx="260" cy="428" r="3" fill="#66ff66"/>
  <text x="275" y="432" font-size="10" fill="#aaa" font-family="Arial">Help → Gate Skip → Dependency → Collapse</text>
  
  <text x="250" y="455" font-size="12" fill="#66ff66" font-family="Arial" font-weight="bold">Real Examples:</text>
  <circle cx="260" cy="473" r="3" fill="#66ff66"/>
  <text x="275" y="477" font-size="10" fill="#aaa" font-family="Arial">Wells Fargo, Therac-25, Fukushima (36+ historical cases)</text>
  
  <!-- Time to understand: ~2 hours -->
  <text x="1000" y="385" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Time: 2 hours</text>
  <text x="1000" y="405" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Goal: See the problem</text>
  
  <!-- TIER 2: UNDERSTANDING (Middle) -->
  <polygon points="350,500 1050,500 900,750 500,750" fill="#1a2a3a" stroke="#44ddff" stroke-width="3"/>
  
  <text x="700" y="535" font-size="16" fill="#44ddff" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 2: UNDERSTANDING — The 10 Gates & How They Develop</text>
  
  <text x="500" y="570" font-size="12" fill="#66ddff" font-family="Arial" font-weight="bold">What gates are:</text>
  <circle cx="510" cy="588" r="3" fill="#66ddff"/>
  <text x="525" y="592" font-size="10" fill="#aaa" font-family="Arial">Non-transferable thresholds you must pass yourself</text>
  
  <text x="500" y="615" font-size="12" fill="#66ddff" font-family="Arial" font-weight="bold">The 10 gates:</text>
  <circle cx="510" cy="633" r="3" fill="#66ddff"/>
  <text x="525" y="637" font-size="10" fill="#aaa" font-family="Arial">1=Consequences, 2=Responsibility, 3=Iteration, 5=Consequence Mgmt, 7=Continuity, etc.</text>
  
  <text x="500" y="660" font-size="12" fill="#66ddff" font-family="Arial" font-weight="bold">The spiral model:</text>
  <circle cx="510" cy="678" r="3" fill="#66ddff"/>
  <text x="525" y="682" font-size="10" fill="#aaa" font-family="Arial">Gates spiral through Tier -1 at increasing depth, not linear progression</text>
  
  <text x="900" y="570" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Time: 3-4 hours</text>
  <text x="900" y="590" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Goal: Understand framework</text>
  
  <!-- TIER 3: APPLICATION (Higher) -->
  <polygon points="500,750 900,750 750,950 650,950" fill="#2a1a3a" stroke="#aa44ff" stroke-width="3"/>
  
  <text x="700" y="785" font-size="16" fill="#aa44ff" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 3: APPLICATION — Diagnose & Design</text>
  
  <text x="550" y="820" font-size="12" fill="#dd88ff" font-family="Arial" font-weight="bold">Self-diagnosis:</text>
  <circle cx="560" cy="838" r="3" fill="#dd88ff"/>
  <text x="575" y="842" font-size="10" fill="#aaa" font-family="Arial">Take assessment. Identify YOUR skipped gates.</text>
  
  <text x="550" y="865" font-size="12" fill="#dd88ff" font-family="Arial" font-weight="bold">Environment design:</text>
  <circle cx="560" cy="883" r="3" fill="#dd88ff"/>
  <text x="575" y="887" font-size="10" fill="#aaa" font-family="Arial">Create conditions where gates can be discovered (templates)</text>
  
  <text x="850" y="820" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Time: 2-3 weeks</text>
  <text x="850" y="840" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Goal: Know yourself</text>
  <text x="850" y="860" font-size="11" fill="#888" font-family="Arial" text-anchor="end" font-style="italic">Design experiments</text>
  
  <!-- TIER 4: EXECUTION (Peak) -->
  <polygon points="650,950 750,950 700,1150 700,1150" fill="#3a1a1a" stroke="#ff6666" stroke-width="3"/>
  
  <text x="700" y="1010" font-size="16" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 4: EXECUTION — Live It</text>
  
  <text x="700" y="1055" font-size="12" fill="#ff8888" font-family="Arial" text-anchor="middle" font-weight="bold">Run gate-discovery experiments</text>
  <text x="700" y="1075" font-size="12" fill="#ff8888" font-family="Arial" text-anchor="middle" font-weight="bold">with yourself or others</text>
  
  <text x="700" y="1105" font-size="11" fill="#888" font-family="Arial" text-anchor="middle" font-style="italic">Time: 12+ weeks</text>
  <text x="700" y="1125" font-size="11" fill="#888" font-family="Arial" text-anchor="middle" font-style="italic">Until gates actually pass</text>
  
  <!-- Right side pathway labels -->
  <text x="1150" y="150" font-size="13" fill="#66ff66" font-family="Arial" font-weight="bold">Comprehension Pathway:</text>
  
  <line x1="1150" y1="165" x2="1150" y2="1100" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
  
  <circle cx="1150" cy="195" r="5" fill="#44ff44"/>
  <text x="1180" y="200" font-size="11" fill="#aaa" font-family="Arial">Week 1: Learn problem</text>
  
  <circle cx="1150" cy="280" r="5" fill="#44ddff"/>
  <text x="1180" y="285" font-size="11" fill="#aaa" font-family="Arial">Week 1-2: Understand gates</text>
  
  <circle cx="1150" cy="400" r="5" fill="#aa44ff"/>
  <text x="1180" y="405" font-size="11" fill="#aaa" font-family="Arial">Week 2-4: Diagnose self</text>
  
  <circle cx="1150" cy="600" r="5" fill="#ff6666"/>
  <text x="1180" y="605" font-size="11" fill="#aaa" font-family="Arial">Week 5-16: Live changes</text>
  
  <!-- Bottom: Integration section -->
  <rect x="50" y="1200" width="1300" height="350" fill="#222" stroke="#666" stroke-width="2" rx="8"/>
  
  <text x="700" y="1240" font-size="18" fill="#ffffff" font-family="Arial" text-anchor="middle" font-weight="bold">What Success Looks Like at Each Tier</text>
  
  <!-- Tier 1 Success -->
  <rect x="70" y="1270" width="280" height="150" fill="#1a2a1a" stroke="#44ff44" stroke-width="1" rx="4"/>
  <text x="210" y="1290" font-size="12" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 1 Success</text>
  <text x="80" y="1310" font-size="10" fill="#aaa" font-family="Arial">✓ See why help systems</text>
  <text x="80" y="1325" font-size="10" fill="#aaa" font-family="Arial">fail to develop people</text>
  <text x="80" y="1340" font-size="10" fill="#aaa" font-family="Arial">✓ Recognize 36+ real</text>
  <text x="80" y="1355" font-size="10" fill="#aaa" font-family="Arial">examples in your life</text>
  <text x="80" y="1370" font-size="10" fill="#aaa" font-family="Arial">✓ Feel urgency about</text>
  <text x="80" y="1385" font-size="10" fill="#aaa" font-family="Arial">changing approach</text>
  <text x="80" y="1405" font-size="9" fill="#66ff66" font-family="Arial" font-weight="bold">Outcome: "I see the problem"</text>
  
  <!-- Tier 2 Success -->
  <rect x="370" y="1270" width="280" height="150" fill="#1a2a3a" stroke="#44ddff" stroke-width="1" rx="4"/>
  <text x="510" y="1290" font-size="12" fill="#44ddff" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 2 Success</text>
  <text x="380" y="1310" font-size="10" fill="#aaa" font-family="Arial">✓ Can explain how</text>
  <text x="380" y="1325" font-size="10" fill="#aaa" font-family="Arial">gates work universally</text>
  <text x="380" y="1340" font-size="10" fill="#aaa" font-family="Arial">✓ See gates in 13 domains</text>
  <text x="380" y="1355" font-size="10" fill="#aaa" font-family="Arial">(computing, physics, org, etc)</text>
  <text x="380" y="1370" font-size="10" fill="#aaa" font-family="Arial">✓ Understand why spiral</text>
  <text x="380" y="1385" font-size="10" fill="#aaa" font-family="Arial">model is better than linear</text>
  <text x="380" y="1405" font-size="9" fill="#66ddff" font-family="Arial" font-weight="bold">Outcome: "I understand framework"</text>
  
  <!-- Tier 3 Success -->
  <rect x="670" y="1270" width="280" height="150" fill="#2a1a3a" stroke="#aa44ff" stroke-width="1" rx="4"/>
  <text x="810" y="1290" font-size="12" fill="#aa44ff" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 3 Success</text>
  <text x="680" y="1310" font-size="10" fill="#aaa" font-family="Arial">✓ Can diagnose which</text>
  <text x="680" y="1325" font-size="10" fill="#aaa" font-family="Arial">gates you personally skipped</text>
  <text x="680" y="1340" font-size="10" fill="#aaa" font-family="Arial">✓ Design gate-passage</text>
  <text x="680" y="1355" font-size="10" fill="#aaa" font-family="Arial">environment for yourself</text>
  <text x="680" y="1370" font-size="10" fill="#aaa" font-family="Arial">✓ Can see where help</text>
  <text x="680" y="1385" font-size="10" fill="#aaa" font-family="Arial">systems are blocking you</text>
  <text x="680" y="1405" font-size="9" fill="#dd88ff" font-family="Arial" font-weight="bold">Outcome: "I know what to do"</text>
  
  <!-- Tier 4 Success -->
  <rect x="970" y="1270" width="280" height="150" fill="#3a1a1a" stroke="#ff6666" stroke-width="1" rx="4"/>
  <text x="1110" y="1290" font-size="12" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">TIER 4 Success</text>
  <text x="980" y="1310" font-size="10" fill="#aaa" font-family="Arial">✓ Gates actually pass</text>
  <text x="980" y="1325" font-size="10" fill="#aaa" font-family="Arial">✓ Internal coherence builds</text>
  <text x="980" y="1340" font-size="10" fill="#aaa" font-family="Arial">✓ Dependency on help</text>
  <text x="980" y="1355" font-size="10" fill="#aaa" font-family="Arial">systems decreases</text>
  <text x="980" y="1370" font-size="10" fill="#aaa" font-family="Arial">✓ Φ (potential energy)</text>
  <text x="980" y="1385" font-size="10" fill="#aaa" font-family="Arial">measurably decreases</text>
  <text x="980" y="1405" font-size="9" fill="#ff8888" font-family="Arial" font-weight="bold">Outcome: "I am becoming coherent"</text>
  
  <!-- Bottom guidance -->
  <text x="700" y="1520" font-size="12" fill="#aaa" font-family="Arial" text-anchor="middle" font-weight="bold">Reading Guide:</text>
  <text x="700" y="1540" font-size="11" fill="#888" font-family="Arial" text-anchor="middle">Start at TIER 1 (2 hours) → Move to TIER 2 (3-4 hours) → TIER 3 (2-3 weeks) → TIER 4 (12+ weeks)</text>
  <text x="700" y="1560" font-size="11" fill="#888" font-family="Arial" text-anchor="middle">Each tier builds on previous. Don't skip. Comprehension requires sequential integration.</text>
</svg>