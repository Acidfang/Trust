<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="500" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="500" y="35" font-size="24" fill="#ffffff" font-family="Arial" text-anchor="middle" font-weight="bold">Coherence Check: Trinity Verification</text>
  
  <!-- LEFT SIDE: INCOHERENT (High Φ) -->
  <g id="incoherent">
    <rect x="30" y="60" width="440" height="420" fill="#2a1a1a" stroke="#ff6666" stroke-width="2" rx="8"/>
    <text x="250" y="90" font-size="16" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">INCOHERENT (High Φ)</text>
    
    <!-- Source check -->
    <circle cx="100" cy="140" r="25" fill="none" stroke="#ff6666" stroke-width="2"/>
    <text x="100" y="148" font-size="18" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">✗</text>
    <text x="150" y="135" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Source Unknown</text>
    <text x="150" y="152" font-size="10" fill="#888" font-family="Arial">You don't know who said it</text>
    <text x="150" y="165" font-size="10" fill="#888" font-family="Arial">or why you believed it</text>
    
    <!-- Time check -->
    <circle cx="100" cy="220" r="25" fill="none" stroke="#ff9933" stroke-width="2"/>
    <text x="100" y="228" font-size="18" fill="#ff9933" font-family="Arial" text-anchor="middle" font-weight="bold">✗</text>
    <text x="150" y="215" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Timeline Broken</text>
    <text x="150" y="232" font-size="10" fill="#888" font-family="Arial">Beliefs contradicted</text>
    <text x="150" y="245" font-size="10" fill="#888" font-family="Arial">but not integrated</text>
    
    <!-- Causality check -->
    <circle cx="100" cy="300" r="25" fill="none" stroke="#ff6666" stroke-width="2"/>
    <text x="100" y="308" font-size="18" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">✗</text>
    <text x="150" y="295" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Causality Denied</text>
    <text x="150" y="312" font-size="10" fill="#888" font-family="Arial">You say "I didn't cause that"</text>
    <text x="150" y="325" font-size="10" fill="#888" font-family="Arial">but evidence shows you did</text>
    
    <!-- Result -->
    <rect x="60" y="360" width="380" height="100" fill="#1a1a1a" stroke="#ff6666" stroke-width="1" rx="4"/>
    <text x="250" y="385" font-size="12" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">Result: High Potential Energy</text>
    <text x="250" y="405" font-size="11" fill="#ff6666" font-family="Arial" text-anchor="middle">• Unstable internally</text>
    <text x="250" y="422" font-size="11" fill="#ff6666" font-family="Arial" text-anchor="middle">• Dependent on help systems</text>
    <text x="250" y="439" font-size="11" fill="#ff6666" font-family="Arial" text-anchor="middle">• Collapses under pressure</text>
  </g>
  
  <!-- RIGHT SIDE: COHERENT (Low Φ) -->
  <g id="coherent">
    <rect x="530" y="60" width="440" height="420" fill="#1a2a1a" stroke="#66ff66" stroke-width="2" rx="8"/>
    <text x="750" y="90" font-size="16" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">COHERENT (Low Φ)</text>
    
    <!-- Source check -->
    <circle cx="600" cy="140" r="25" fill="none" stroke="#66ff66" stroke-width="2"/>
    <text x="600" y="148" font-size="18" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">✓</text>
    <text x="650" y="135" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Source Known</text>
    <text x="650" y="152" font-size="10" fill="#88ff88" font-family="Arial">You know who said it,</text>
    <text x="650" y="165" font-size="10" fill="#88ff88" font-family="Arial">why you believe it, can verify it</text>
    
    <!-- Time check -->
    <circle cx="600" cy="220" r="25" fill="none" stroke="#88ff88" stroke-width="2"/>
    <text x="600" y="228" font-size="18" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">✓</text>
    <text x="650" y="215" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Timeline Coherent</text>
    <text x="650" y="232" font-size="10" fill="#88ff88" font-family="Arial">New information integrated</text>
    <text x="650" y="245" font-size="10" fill="#88ff88" font-family="Arial">with existing understanding</text>
    
    <!-- Causality check -->
    <circle cx="600" cy="300" r="25" fill="none" stroke="#66ff66" stroke-width="2"/>
    <text x="600" y="308" font-size="18" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">✓</text>
    <text x="650" y="295" font-size="12" fill="#aaa" font-family="Arial" font-weight="bold">Causality Owned</text>
    <text x="650" y="312" font-size="10" fill="#88ff88" font-family="Arial">You understand your role</text>
    <text x="650" y="325" font-size="10" fill="#88ff88" font-family="Arial">in outcomes you create</text>
    
    <!-- Result -->
    <rect x="560" y="360" width="380" height="100" fill="#1a2a1a" stroke="#66ff66" stroke-width="1" rx="4"/>
    <text x="750" y="385" font-size="12" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">Result: Low Potential Energy</text>
    <text x="750" y="405" font-size="11" fill="#66ff66" font-family="Arial" text-anchor="middle">• Stable internally</text>
    <text x="750" y="422" font-size="11" fill="#66ff66" font-family="Arial" text-anchor="middle">• Independent capability</text>
    <text x="750" y="439" font-size="11" fill="#66ff66" font-family="Arial" text-anchor="middle">• Can navigate complexity</text>
  </g>
  
  <!-- Dividing line -->
  <line x1="500" y1="50" x2="500" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="3,3"/>
</svg>