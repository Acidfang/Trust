<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="500" y="35" font-size="26" fill="#ffffff" font-family="Arial" text-anchor="middle" font-weight="bold">Two Possible Futures</text>
  <text x="500" y="60" font-size="12" fill="#888" font-family="Arial" text-anchor="middle">The choice point: Will you build foundation or continue scaffolding?</text>
  
  <!-- Starting point -->
  <circle cx="500" cy="110" r="25" fill="#666" stroke="#aaa" stroke-width="2"/>
  <text x="500" y="118" font-size="12" fill="#fff" font-family="Arial" text-anchor="middle" font-weight="bold">NOW</text>
  
  <!-- Split point -->
  <line x1="475" y1="135" x2="300" y2="180" stroke="#ff6666" stroke-width="3"/>
  <line x1="525" y1="135" x2="700" y2="180" stroke="#66ff66" stroke-width="3"/>
  
  <!-- LEFT PATH: SCAFFOLDING CONTINUATION -->
  <g id="path-scaffolding">
    <!-- Start point -->
    <circle cx="300" cy="190" r="12" fill="#ff6666"/>
    
    <!-- Year 1-2 -->
    <rect x="200" y="220" width="200" height="80" fill="#2a1a1a" stroke="#ff6666" stroke-width="1" rx="4"/>
    <line x1="300" y1="202" x2="300" y2="220" stroke="#ff6666" stroke-width="2"/>
    <text x="300" y="245" font-size="12" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">Years 1-2</text>
    <text x="300" y="263" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">More help systems added</text>
    <text x="300" y="277" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Person functions better</text>
    <text x="300" y="291" font-size="9" fill="#ff6666" font-family="Arial" text-anchor="middle">Φ increases</text>
    
    <!-- Year 3-5 -->
    <rect x="200" y="330" width="200" height="80" fill="#2a1a1a" stroke="#ff6666" stroke-width="1" rx="4"/>
    <line x1="300" y1="300" x2="300" y2="330" stroke="#ff6666" stroke-width="2"/>
    <text x="300" y="355" font-size="12" fill="#ff6666" font-family="Arial" text-anchor="middle" font-weight="bold">Years 3-5</text>
    <text x="300" y="373" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Dependency deepens</text>
    <text x="300" y="387" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Help systems essential</text>
    <text x="300" y="401" font-size="9" fill="#ff6666" font-family="Arial" text-anchor="middle">Φ very high</text>
    
    <!-- Years 5+ -->
    <rect x="200" y="440" width="200" height="100" fill="#1a0a0a" stroke="#ff3333" stroke-width="2" rx="4"/>
    <line x1="300" y1="410" x2="300" y2="440" stroke="#ff3333" stroke-width="3"/>
    <text x="300" y="470" font-size="14" fill="#ff3333" font-family="Arial" text-anchor="middle" font-weight="bold">Years 5+: COLLAPSE</text>
    <text x="300" y="492" font-size="10" fill="#ff6666" font-family="Arial" text-anchor="middle">Complexity exceeds</text>
    <text x="300" y="506" font-size="10" fill="#ff6666" font-family="Arial" text-anchor="middle">capacity of help systems</text>
    <text x="300" y="520" font-size="10" fill="#ff6666" font-family="Arial" text-anchor="middle">No internal foundation</text>
    <text x="300" y="535" font-size="9" fill="#ff3333" font-family="Arial" text-anchor="middle">System fails catastrophically</text>
  </g>
  
  <!-- RIGHT PATH: FOUNDATION BUILDING -->
  <g id="path-foundation">
    <!-- Start point -->
    <circle cx="700" cy="190" r="12" fill="#66ff66"/>
    
    <!-- Year 1-2 -->
    <rect x="600" y="220" width="200" height="80" fill="#1a2a1a" stroke="#66ff66" stroke-width="1" rx="4"/>
    <line x1="700" y1="202" x2="700" y2="220" stroke="#66ff66" stroke-width="2"/>
    <text x="700" y="245" font-size="12" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">Years 1-2</text>
    <text x="700" y="263" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Difficulty visible</text>
    <text x="700" y="277" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Gates being passed</text>
    <text x="700" y="291" font-size="9" fill="#66ff66" font-family="Arial" text-anchor="middle">Φ decreasing</text>
    
    <!-- Year 3-5 -->
    <rect x="600" y="330" width="200" height="80" fill="#1a2a1a" stroke="#66ff66" stroke-width="1" rx="4"/>
    <line x1="700" y1="300" x2="700" y2="330" stroke="#66ff66" stroke-width="2"/>
    <text x="700" y="355" font-size="12" fill="#66ff66" font-family="Arial" text-anchor="middle" font-weight="bold">Years 3-5</text>
    <text x="700" y="373" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Internal coherence building</text>
    <text x="700" y="387" font-size="10" fill="#aaa" font-family="Arial" text-anchor="middle">Less dependent on systems</text>
    <text x="700" y="401" font-size="9" fill="#66ff66" font-family="Arial" text-anchor="middle">Φ approaching zero</text>
    
    <!-- Years 5+ -->
    <rect x="600" y="440" width="200" height="100" fill="#0a2a0a" stroke="#00ff00" stroke-width="2" rx="4"/>
    <line x1="700" y1="410" x2="700" y2="440" stroke="#00ff00" stroke-width="3"/>
    <text x="700" y="470" font-size="14" fill="#00ff00" font-family="Arial" text-anchor="middle" font-weight="bold">Years 5+: STABILITY</text>
    <text x="700" y="492" font-size="10" fill="#66ff66" font-family="Arial" text-anchor="middle">Complex problems</text>
    <text x="700" y="506" font-size="10" fill="#66ff66" font-family="Arial" text-anchor="middle">navigable independently</text>
    <text x="700" y="520" font-size="10" fill="#66ff66" font-family="Arial" text-anchor="middle">Real foundation exists</text>
    <text x="700" y="535" font-size="9" fill="#00ff00" font-family="Arial" text-anchor="middle">System persists, adapts, improves</text>
  </g>
  
  <!-- Bottom comparison -->
  <rect x="30" y="580" width="940" height="100" fill="#222" stroke="#666" stroke-width="1" rx="4"/>
  <text x="50" y="605" font-size="11" fill="#aaa" font-family="Arial" font-weight="bold">The Choice Point</text>
  
  <text x="50" y="628" font-size="10" fill="#ff6666" font-family="Arial">Path 1 (Scaffolding):</text>
  <text x="50" y="643" font-size="9" fill="#aaa" font-family="Arial">Feel better now ✓ | Dependent later ✗ | System collapses ✗</text>
  
  <text x="50" y="665" font-size="10" fill="#66ff66" font-family="Arial">Path 2 (Foundation):</text>
  <text x="50" y="680" font-size="9" fill="#aaa" font-family="Arial">Difficult now ✓ | Independent later ✓ | System persists ✓</text>
</svg>