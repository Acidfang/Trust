<!-- Search Index for Jekyll -->
<script>
window.store = {
  {% for doc in site.docs %}
    "{{ doc.url }}": {
      "title": "{{ doc.title | xml_escape }}",
      "content": {{ doc.content | markdownify | strip_html | jsonify }},
      "url": "{{ doc.url | relative_url }}"
    }
    {% unless forloop.last %},{% endunless %}
  {% endfor %}
};
</script>
