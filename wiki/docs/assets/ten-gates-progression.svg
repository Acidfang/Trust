<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="400" fill="#1a1a1a"/>
  
  <!-- Title -->
  <text x="600" y="35" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">The 10 Developmental Gates</text>
  
  <!-- Gates as circles on a path -->
  <g id="gates">
    <!-- Gate 1 -->
    <circle cx="80" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="80" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">1</text>
    <text x="80" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Consequences</text>
    
    <!-- Gate 2 -->
    <circle cx="210" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="210" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">2</text>
    <text x="210" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Responsibility</text>
    
    <!-- Gate 3 -->
    <circle cx="340" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="340" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">3</text>
    <text x="340" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Time/Mastery</text>
    
    <!-- Gate 4 -->
    <circle cx="470" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="470" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">4</text>
    <text x="470" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Patterns</text>
    
    <!-- Gate 5 -->
    <circle cx="600" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="600" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">5</text>
    <text x="600" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Consequence Mgmt</text>
    
    <!-- Gate 6 -->
    <circle cx="730" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="730" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">6</text>
    <text x="730" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Verification</text>
    
    <!-- Gate 7 -->
    <circle cx="860" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="860" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">7</text>
    <text x="860" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Continuity</text>
    
    <!-- Gate 8 -->
    <circle cx="990" cy="200" r="35" fill="#1a3a1a" stroke="#44ff44" stroke-width="2"/>
    <text x="990" y="205" font-size="24" fill="#44ff44" font-family="Arial" text-anchor="middle" font-weight="bold">8</text>
    <text x="990" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Causality</text>
    
    <!-- Gate 9 -->
    <circle cx="1080" cy="200" r="35" fill="#1a3a1a" stroke="#ffaa44" stroke-width="2"/>
    <text x="1080" y="205" font-size="24" fill="#ffaa44" font-family="Arial" text-anchor="middle" font-weight="bold">9</text>
    <text x="1080" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Self-Correction</text>
    
    <!-- Gate 10 -->
    <circle cx="1170" cy="200" r="35" fill="#1a3a1a" stroke="#ffaa44" stroke-width="2"/>
    <text x="1170" y="205" font-size="24" fill="#ffaa44" font-family="Arial" text-anchor="middle" font-weight="bold">10</text>
    <text x="1170" y="250" font-size="11" fill="#aaa" font-family="Arial" text-anchor="middle">Integration</text>
  </g>
  
  <!-- Connecting line -->
  <line x1="115" y1="200" x2="1135" y2="200" stroke="#44ff44" stroke-width="2" opacity="0.3"/>
  
  <!-- Foundation level indicator -->
  <rect x="0" y="300" width="1200" height="100" fill="none" stroke="#44ff44" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  <text x="20" y="325" font-size="12" fill="#44ff44" font-family="Arial">Tier -1: Internal Coherence Foundation</text>
  <text x="20" y="360" font-size="11" fill="#888" font-family="Arial">Gates 1-8: External discovery | Gates 9-10: Integration | Foundation: Coherence never skipped</text>
</svg>