# Jekyll Configuration for The Cold Hard Truth, The Path To Perfection

title: The Cold Hard Truth, The Path To Perfection
description: A Complete Framework for Understanding Human Development, Gate-Passage, and Civilization's Future
author: Determined
email: contact@determined.dev

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  docs:
    output: true
    permalink: /:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "page"
      toc: true
  - scope:
      path: "docs"
    values:
      layout: "default"

# Post defaults (for pages in docs)
permalink: /:basename/

# Site URL for GitHub Pages
url: "https://acidfang.github.io"
baseurl: "/Trust"

# Search index
search_enabled: true
heading_anchors: true

# Analytics (optional)
google_analytics: ""

# Build options
source: .
destination: _site
exclude:
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

# Permalink settings
permalink: /:title/

# Allow symlinks
safe: false
