# Comprehensive Framework Index with Interactive Learning Integration
# Each framework includes: basics, real examples, visualizations, comparisons, case studies

frameworks:
  # ====================
  # FOUNDATION FRAMEWORKS
  # ====================
  
  - name: goal-blindness
    title: "Goal-Blindness: The Universal Root Cause"
    short_description: "Why you can't think past your own goals and see consequences to others"
    full_description: "Humans optimize for their own goals. This creates structural cognitive blindness to consequences for others. This root cause explains help systems preventing development, institutions blocking advancement, and why external measurement is the only solution."
    path: framework/goal-blindness
    readme: framework/goal-blindness/README.md
    difficulty: beginner
    time_estimate: "1-2 hours"
    
    real_examples:
      - name: "Therapy Creating Dependency"
        domain: psychology
        description: "Therapist's goal='help' blinds to 'preventing gate-passage'"
        baseline: "Helper cannot see dependency being created"
        improvement: "Recognize how helping prevents necessary developmental gates"
        
      - name: "FDA Blocking Life-Saving Drugs"
        domain: medicine
        description: "Regulator's goal='approval safety' blinds to 'delay mortality'"
        baseline: "System cannot see death toll from waiting for perfect safety"
        improvement: "Measure both approval deaths AND delay deaths to see true cost"
        
      - name: "Companies Blocking Innovation"
        domain: business
        description: "Company's goal='market share' blinds to 'progress-blocking'"
        baseline: "Organization cannot see opportunity cost of protecting status quo"
        improvement: "External measurement of lost innovation opportunities"
        
      - name: "Universities Teaching Obsolescence"
        domain: education
        description: "Institution's goal='curriculum prestige' blinds to 'teaching outdated methods'"
        baseline: "Department cannot see teaching methods that are 20 years old"
        improvement: "Force external measurement of how current teaching is in field"
    
    interactive_tools:
      - tool: goal-blindness-detector
        type: diagnostic checklist
        description: "Identify where you're goal-blind in your own work"
        
      - tool: consequence-mapper
        type: visualization
        description: "Map what you're structurally blind to in your role"
        
      - tool: measurement-designer
        type: interactive builder
        description: "Design external measurement to expose your blindness"
    
    domains: [psychology, medicine, business, education, organizations, parenting, relationships]
    files:
      - the-root-cause-goal-blindness.md
      - evidence-why-undeniables-are-real.md
      - the-undeniable-pattern.md
    has_interactive: true
    systems: [human-limitation, all-domains]
    is_root_cause: true
    
  - name: universal-foundation
    title: "Universal Foundation: dℹ/dt = -∇Φ"
    short_description: "The single law governing all coherent systems"
    full_description: "Every coherent system in existence—from electrons to economies—evolves by flowing downhill in potential energy. This is the foundation of everything."
    path: framework/universal-foundation
    readme: framework/universal-foundation/README.md
    difficulty: intermediate
    time_estimate: "2-3 hours for mastery"
    
    # Real-world examples showing this principle
    real_examples:
      - name: "Physical Particle"
        domain: physics
        description: "Electron orbiting nucleus"
        baseline: "Electron falls into stable orbital (lowest potential)"
        improvement: "Show how orbital energy relates to Φ, quantum tunneling as escape from local minimum"
        
      - name: "Chemical Reaction"
        domain: chemistry
        description: "Reactants forming products"
        baseline: "Molecules arrange into lower-energy configuration"
        improvement: "Interactive energy diagram showing reaction coordinate, activation barrier, product stability"
        
      - name: "Biological Folding"
        domain: biology
        description: "Protein folding into 3D structure"
        baseline: "Protein folds to minimize free energy"
        improvement: "Animated 3D model showing how chain folding reduces potential, misfolding consequences"
        
      - name: "Learning & Memory"
        domain: psychology
        description: "Neural connections strengthening"
        baseline: "Repeated experience lowers activation energy for synaptic firing"
        improvement: "Show Hebbian learning as minimizing prediction error (potential)"
        
      - name: "Market Equilibrium"
        domain: economics
        description: "Price settling at supply-demand intersection"
        baseline: "Market converges to price where supply = demand"
        improvement: "Interactive market simulator showing price discovery as gradient descent"
        
      - name: "Social Stability"
        domain: sociology
        description: "Communities organizing around shared values"
        baseline: "Groups form around minimal-conflict configurations"
        improvement: "Show polarization as multiple potential wells, consensus as single well"
    
    # Interactive tools for this framework
    interactive_tools:
      - tool: potential-landscape-explorer
        type: visualization + manipulation
        description: "Adjust potential shape, watch system flow downhill"
        real_example: "Harmonic potential vs double-well vs custom"
        
      - tool: energy-minimization-simulator
        type: interactive simulation
        description: "See gradient descent in action"
        real_example: "Ball rolling downhill in different landscapes"
        
      - tool: domain-mapper
        type: interactive comparison
        description: "See how dℹ/dt = -∇Φ appears in different domains"
        real_example: "Select domain, see equivalent formulation"
    
    domains: [physics, chemistry, biology, psychology, economics, sociology, AI, medicine]
    files:
      - FOUNDATION.md
      - MATHEMATICS.md
      - UNIVERSAL_APPLICATION.md
      - Demo.py
    has_demo: true
    has_interactive: true
    systems: [all-domains]
    
