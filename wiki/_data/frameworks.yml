        domain: cosmology
        description: "Tracing universe back to Big Bang"
        baseline: "Run Einstein equations backward, time reversal symmetry"
        improvement: "Interactive timeline showing particle creation, recombination, inflation phases"
        
      - name: "Ecosystem Evolution Reversal"
        domain: biology
        description: "Reconstructing ancient ecosystems"
        baseline: "Use fossil record + evolutionary law to trace back"
        improvement: "Animated ecosystem reconstruction, species interactions over time"
        
      - name: "Historical Event Analysis"
        domain: history
        description: "Understanding how current tensions originated"
        baseline: "Trace geopolitical tensions backward to root causes"
        improvement: "Interactive historical simulator, what-if scenarios"
    
    interactive_tools:
      - tool: timeline-reversal-viewer
        type: visualization
        description: "Watch complex system evolution in reverse"
        
      - tool: causality-tracer
        type: interactive exploration
        description: "Trace events backward to first cause"
    
    domains: [cosmology, biology, history, archaeology, economics]
    files:
      - CosmologyReversal.py
      - Demo.py
      - README.md
      - HISTORICAL_APPLICATIONS.md
    has_demo: true
    has_interactive: true
    systems: [temporal, gravitational, evolutionary]
    
  - name: help-systems-framework
    title: "Universal Help Systems Framework"
    short_description: "The structure of all systems that help people grow"
    full_description: "Therapists, teachers, parents, and coaches all use the same invisible architecture. Understanding it makes helping more effective."
    path: framework/help-systems
    readme: framework/help-systems/README.md
    difficulty: beginner-to-intermediate
    time_estimate: "1-2 hours"
    
    real_examples:
      - name: "Classroom Teaching"
        domain: education
        description: "Teacher guiding students to mastery"
        baseline: "Gradual release of responsibility model"
        improvement: "Interactive classroom simulator, adjust autonomy level, see learning outcomes"
        
      - name: "Therapy Sessions"
        domain: psychology
        description: "Therapist helping client heal"
        baseline: "CBT progression from guided to self-directed"
        improvement: "Case study viewer showing session progression, autonomy growth over time"
        
      - name: "Parenting Stages"
        domain: family
        description: "Parent supporting child development"
        baseline: "Stages from dependent to independent"
        improvement: "Interactive parenting decision tree, alignment with child's autonomy level"
        
      - name: "Athletic Coaching"
        domain: sports
        description: "Coach developing athlete skills"
        baseline: "Scaffolding from demonstration to independent performance"
        improvement: "Training progression simulator, individualized coaching paths"
        
      - name: "Software Onboarding"
        domain: technology
        description: "Team member learning new codebase"
        baseline: "Guided tours → pair programming → independent work"
        improvement: "Interactive onboarding journey, personalized learning tracks"
    
    interactive_tools:
      - tool: help-system-designer
        type: interactive builder
        description: "Design a help system for any domain"
        
      - tool: autonomy-level-matcher
        type: decision tree
        description: "What autonomy level matches this person's current state?"
        
      - tool: progression-tracker
        type: progress visualization
        description: "Track transitions from Guided → Supported → Autonomous"
    
    domains: [education, psychology, parenting, coaching, management, onboarding]
    files:
      - HELP_SYSTEMS_FRAMEWORK.md
      - LEVELS_EXPLAINED.md
      - Demo.py
      - CASE_STUDIES.md
    has_demo: true
    has_interactive: true
    systems: [learning, growth, support]
    
  - name: cosmic-eras
    title: "The Cosmic Eras Framework"
    short_description: "History as progressive sophistication of consciousness"
    full_description: "From quantum plasma to conscious AI: each era shows new organizational principles emerging. Understanding the pattern helps predict what's next."
    path: framework/cosmic-eras
    readme: framework/cosmic-eras/README.md
    difficulty: beginner
    time_estimate: "1 hour"
    
    real_examples:
      - name: "From Atoms to Cells"
        domain: biology
        description: "How chemistry became life"
        baseline: "Molecular organization → self-replicating systems"
        improvement: "Animated progression showing exactly when life-like properties emerge"
        
      - name: "From Individuals to Societies"
        domain: sociology
        description: "How consciousness became collective"
        baseline: "Individual agency → group dynamics → cultural institutions"
        improvement: "Interactive society builder, see how institutions emerge from simple rules"
        
      - name: "From Neurons to Thought"
        domain: neuroscience
        description: "How firing patterns become consciousness"
        baseline: "Neural activity → emergent cognition"
        improvement: "Interactive neural network that develops its own learning rules"
    
    interactive_tools:
      - tool: cosmic-timeline
        type: interactive timeline
